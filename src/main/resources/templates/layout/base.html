<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"/>
    <title layout:title-pattern="$CONTENT_TITLE - RAG Q&A" th:text="#{nav.title}">Document Q&amp;A</title>

    <!-- ── PWA ──────────────────────────────────────────────────────────── -->
    <meta name="theme-color" content="#212529"/>
    <link rel="manifest" th:href="@{/manifest.webmanifest}"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/icons/icon.svg}"/>
    <link rel="apple-touch-icon" th:href="@{/icons/icon.svg}"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="RAG Q&amp;A"/>

    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/theme.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <link rel="stylesheet" id="hljs-style"
          th:href="@{/webjars/highlight.js/styles/github.min.css}"/>
    <!-- FOUC prevention: set data-theme before body renders -->
    <script>
    (function(){
        var t=localStorage.getItem('theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
        document.documentElement.setAttribute('data-theme',t);
    })();
    </script>
</head>
<body>

<!-- ── Navbar ─────────────────────────────────────────────────────────── -->
<nav class="navbar navbar-expand-md navbar-dark bg-dark px-3 py-2">
    <a class="navbar-brand fw-semibold" th:href="@{/}">
        <i class="bi bi-chat-dots-fill me-1"></i>
        <span th:text="#{nav.title}">Document Q&amp;A</span>
    </a>

    <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse" data-bs-target="#navbarContent"
            aria-controls="navbarContent" aria-expanded="false"
            th:attr="aria-label=#{nav.menu.toggle}" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav me-auto mb-0">
            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/}"
                   th:classappend="${requestURI == '/' or #strings.startsWith(requestURI, '/chat')} ? ' active'">
                    <i class="bi bi-chat me-1"></i>
                    <span th:text="#{nav.chat}">Chat</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/documents}"
                   th:classappend="${#strings.startsWith(requestURI, '/documents')} ? ' active'">
                    <i class="bi bi-file-earmark-text me-1"></i>
                    <span th:text="#{nav.documents}">Documents</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/llm-usage}"
                   th:classappend="${#strings.startsWith(requestURI, '/llm-usage')} ? ' active'">
                    <i class="bi bi-bar-chart-line me-1"></i>
                    <span th:text="#{nav.llm_usage}">LLM Usage</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                   th:href="@{/settings}"
                   th:classappend="${#strings.startsWith(requestURI, '/settings')} ? ' active'">
                    <i class="bi bi-sliders me-1"></i>
                    <span th:text="#{nav.settings}">Settings</span>
                </a>
            </li>
            <li class="nav-item" th:if="${isAdmin}">
                <a class="nav-link"
                   th:href="@{/admin}"
                   th:classappend="${#strings.startsWith(requestURI, '/admin')} ? ' active'">
                    <i class="bi bi-gear me-1"></i>
                    <span th:text="#{nav.admin}">Vector Store</span>
                </a>
            </li>
        </ul>

        <div class="d-flex align-items-center gap-3">
            <!-- API health indicator -->
            <span id="api-status" class="small text-secondary">
                <span id="api-dot" class="status-dot dot-unknown"></span>
                <span id="api-label" th:text="#{nav.api.checking}">Checking</span>
            </span>

            <!-- LOCAL LLM concurrency indicator (role=LOCAL, priority=1 tier) — hidden until the
                 first poll confirms such a provider exists; refreshed every ~3s (script below).
                 Bootstrap Tooltip (not native title) for the same fast-appearance reason as the
                 S/M/L response-mode buttons in chat.html — see that file's tooltip init comment. -->
            <span id="llm-concurrency" class="small text-secondary d-none"
                  data-bs-toggle="tooltip" th:title="#{nav.llm.tooltip}">
                <span th:text="#{nav.llm.label}">LLM</span>: <span id="llm-concurrency-value">0/0</span>
            </span>

            <!-- Language switcher -->
            <div class="d-flex align-items-center gap-1 small">
                <a th:href="@{''(lang=ko)}"
                   th:classappend="${#locale.language == 'ko'} ? ' fw-bold text-white' : ' text-secondary'"
                   class="text-decoration-none">KO</a>
                <span class="text-secondary">|</span>
                <a th:href="@{''(lang=en)}"
                   th:classappend="${#locale.language != 'ko'} ? ' fw-bold text-white' : ' text-secondary'"
                   class="text-decoration-none">EN</a>
            </div>

            <!-- Theme toggle -->
            <button id="theme-toggle" class="btn btn-sm btn-link text-light border-0 p-1"
                    th:title="#{nav.theme.toggle}"
                    th:attr="aria-label=#{nav.theme.toggle}" aria-label="Toggle theme">
                <i class="bi bi-sun-fill" data-theme-icon="light"></i>
                <i class="bi bi-moon-fill" data-theme-icon="dark"></i>
            </button>

            <!-- User info (authenticated) — in management-only mode, NoAuthAutoLoginFilter's
                 GUEST_PRINCIPAL is itself a real (non-anonymous) authenticated principal, so
                 sec:authorize="isAuthenticated()" alone can't tell guest apart from a real admin
                 login; the extra th:if does that (true unchanged in full-auth/plain no-auth). -->
            <div sec:authorize="isAuthenticated()" th:if="${!managementOnly or isAdmin}"
                 class="d-flex align-items-center gap-2">
                <span class="text-light small">
                    <i class="bi bi-person-circle me-1"></i>
                    <span sec:authentication="principal.displayName">User</span>
                </span>
                <form th:if="${authEnabled or (managementOnly and isAdmin)}" th:action="@{/logout}" method="post" class="mb-0">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
                           th:value="${_csrf != null ? _csrf.token : ''}"/>
                    <button type="submit" class="btn btn-sm btn-outline-light border-0 py-0"
                            th:title="#{auth.logout}"
                            th:attr="aria-label=#{auth.logout}" aria-label="Logout">
                        <i class="bi bi-box-arrow-right"></i>
                    </button>
                </form>
            </div>
            <!-- Guest (anonymous) — full-auth mode only; sec:authorize="isAnonymous()" never
                 fires in either no-auth submode (GUEST_PRINCIPAL is never Spring-anonymous). -->
            <span th:if="${authEnabled}" sec:authorize="isAnonymous()" class="text-secondary small">
                <i class="bi bi-person-circle me-1"></i>
                <a th:href="@{/login}" class="text-secondary text-decoration-none"
                   th:text="#{nav.login}">Login</a>
            </span>
            <!-- Guest in management-only mode — separate block since isAnonymous() never applies. -->
            <span th:if="${managementOnly and !isAdmin}" class="text-secondary small">
                <i class="bi bi-person-circle me-1"></i>
                <a th:href="@{/login}" class="text-secondary text-decoration-none"
                   th:text="#{nav.login}">Login</a>
            </span>
        </div>
    </div>
</nav>

<!-- ── Network error banner (shown on htmx:sendError) ────────────────── -->
<div id="network-banner" class="alert alert-danger rounded-0 mb-0 d-none" role="alert">
    <i class="bi bi-wifi-off me-2"></i>
    <span id="network-banner-msg" th:text="#{banner.network}">Cannot connect to server.</span>
    <button type="button" class="btn-close float-end"
            onclick="document.getElementById('network-banner').classList.add('d-none')"></button>
</div>

<!-- ── Page content ───────────────────────────────────────────────────── -->
<main>
    <th:block layout:fragment="content">
        <!-- child page content goes here -->
    </th:block>
</main>

<!-- ── Toast container (global, fixed bottom-right) ─────────────────── -->
<div id="toast-container"
     class="toast-container position-fixed bottom-0 end-0 p-3"
     style="z-index: 1100;">
</div>

<!-- ── Scripts ────────────────────────────────────────────────────────── -->
<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<script th:src="@{/webjars/marked/marked.min.js}"></script>
<script th:src="@{/webjars/dompurify/dist/purify.min.js}"></script>
<script th:src="@{/js/vendor/highlight.min.js}"></script>

<!-- Global i18n strings injected server-side -->
<script th:inline="javascript">
const I18N = {
    apiOk:           /*[[#{nav.api.ok}]]*/ 'API OK',
    apiError:        /*[[#{nav.api.error}]]*/ 'API Error',
    fileTooBig:      /*[[#{toast.upload.too_large}]]*/ 'File exceeds 200 MB limit',
    duplicateFileName: /*[[#{toast.upload.duplicate_name}]]*/ 'A file with this name already exists. Uploading will register it as {name}. To replace the existing file, delete it first.',
    similarFileName: /*[[#{toast.upload.similar_name}]]*/ 'A document with the same name but a different extension already exists ({name}). It will be uploaded as a separate file — delete the existing one first if you want to replace it.',
    uploadSuccess:   /*[[#{toast.upload.success}]]*/ 'uploaded successfully',
    uploadChunks:    /*[[#{toast.upload.chunks}]]*/ 'chunks',
    uploadError:     /*[[#{toast.upload.error}]]*/ 'error',
    networkError:    /*[[#{error.network.short}]]*/ 'Network error',
    cancelled:       /*[[#{error.cancelled}]]*/ 'Cancelled',
    serverError:     /*[[#{error.server}]]*/ 'Server error',
    fileEmpty:       /*[[#{error.file.empty}]]*/ 'File is empty',
    chromaUnavailable: /*[[#{error.chroma.unavailable}]]*/ 'Vector DB (ChromaDB) is not running',
    requestFailed:   /*[[#{toast.request.failed}]]*/ 'Request failed',
    deleteConfirmDoc:    /*[[#{confirm.delete.doc}]]*/ 'Delete this document?',
    deleteConfirmThread: /*[[#{confirm.delete.thread}]]*/ 'Delete this conversation?',
    curatedSaved:        /*[[#{toast.curated.saved}]]*/ 'Curated answer saved',
    statusWaiting:   /*[[#{status.waiting}]]*/ 'Waiting',
    statusUploading: /*[[#{status.uploading}]]*/ 'Uploading...',
    statusIndexing:  /*[[#{status.indexing}]]*/ 'Indexing...',
    deleteBtnLabel:  /*[[#{doc.btn.delete}]]*/ 'Delete',
    cancelBtnLabel:  /*[[#{doc.btn.cancel}]]*/ 'Cancel',
    llmStatusNormal:     /*[[#{llm.status.normal}]]*/ 'Normal',
    llmStatusBlocked:    /*[[#{llm.status.blocked}]]*/ 'Blocked',
    llmTableTotal:       /*[[#{llm.table.total}]]*/ 'Total',
    llmNoProviders:      /*[[#{llm.no.providers}]]*/ 'No providers configured.'
};
</script>

<script>
    /* Theme toggle */
    (function () {
        function applyTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            document.dispatchEvent(new CustomEvent('themechange', { detail: { theme: t } }));
        }
        const stored  = localStorage.getItem('theme');
        const initial = stored || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        applyTheme(initial);
        document.getElementById('theme-toggle').addEventListener('click', function () {
            const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            localStorage.setItem('theme', next);
            applyTheme(next);
        });
    })();

    /* highlight.js theme sync */
    function syncHljsTheme() {
        const dark = document.documentElement.getAttribute('data-theme') === 'dark';
        const el = document.getElementById('hljs-style');
        if (el) el.href = dark
            ? '/webjars/highlight.js/styles/github-dark.min.css'
            : '/webjars/highlight.js/styles/github.min.css';
    }
    document.addEventListener('themechange', syncHljsTheme);
    syncHljsTheme();

    /* fetch() 에서 공통으로 사용하는 CSRF 헤더 빌더 */
    function getCsrfHeaders() {
        const tokenMeta  = document.querySelector('meta[name="_csrf"]');
        const headerMeta = document.querySelector('meta[name="_csrf_header"]');
        if (tokenMeta && headerMeta && tokenMeta.content) {
            return { [headerMeta.content]: tokenMeta.content };
        }
        return {};
    }

    /* HTMX CSRF 자동 전송 */
    document.body.addEventListener('htmx:configRequest', function (event) {
        Object.assign(event.detail.headers, getCsrfHeaders());
    });

    /* Global HTMX error handlers */
    document.body.addEventListener('htmx:sendError', function () {
        document.getElementById('network-banner').classList.remove('d-none');
    });
    document.body.addEventListener('htmx:responseError', function (e) {
        const status = e.detail.xhr ? e.detail.xhr.status : '';
        showToast(I18N.requestFailed + (status ? ' (' + status + ')' : ''), 'danger');
    });

    /* Auto-initialize Bootstrap toasts injected by HTMX fragments */
    document.body.addEventListener('htmx:afterSettle', function (e) {
        (e.detail.target || document).querySelectorAll('.toast:not([data-bs-inited])').forEach(function (el) {
            el.setAttribute('data-bs-inited', '');
            new bootstrap.Toast(el, { delay: 4000 }).show();
            el.addEventListener('hidden.bs.toast', function () { el.remove(); });
        });
    });

    /* API health check on every page load */
    (function () {
        const dot   = document.getElementById('api-dot');
        const label = document.getElementById('api-label');
        fetch('/api/v1/health')
            .then(r => r.ok ? r.json() : Promise.reject())
            .then(d => {
                if (d.status === 'ok') {
                    dot.className     = 'status-dot dot-ok';
                    label.textContent = I18N.apiOk;
                } else {
                    throw new Error();
                }
            })
            .catch(() => {
                dot.className     = 'status-dot dot-error';
                label.textContent = I18N.apiError;
            });
    })();

    /* LOCAL LLM concurrency indicator (role=LOCAL, priority=1 tier) — polled every ~3s.
       Hidden whenever no such provider is available (never shown as a stale/meaningless 0/0).
       inUse already folds in embedding activity + fully-counts circuit-broken providers and is
       clamped to capacity server-side (OperationsController.getLlmConcurrency), so inUse ===
       capacity here reliably means "fully saturated" — styled bold red as a busy/backpressure cue. */
    (function () {
        const wrap  = document.getElementById('llm-concurrency');
        const value = document.getElementById('llm-concurrency-value');
        function refreshLlmConcurrency() {
            fetch('/api/v1/llm/concurrency')
                .then(r => r.ok ? r.json() : Promise.reject())
                .then(d => {
                    if (d.available) {
                        value.textContent = d.inUse + '/' + d.capacity;
                        const saturated = d.inUse >= d.capacity;
                        value.classList.toggle('text-danger', saturated);
                        value.classList.toggle('fw-bold', saturated);
                        wrap.classList.remove('d-none');
                    } else {
                        wrap.classList.add('d-none');
                    }
                })
                .catch(() => wrap.classList.add('d-none'));
        }
        refreshLlmConcurrency();
        setInterval(refreshLlmConcurrency, 3000);
        // Same fast-appearance rationale as chat.html's S/M/L tooltip init — native title's
        // ~1.5s browser default delay reads as unresponsive for a quick-glance header hint.
        new bootstrap.Tooltip(wrap, { delay: { show: 100, hide: 0 } });
    })();

    /* Global toast helper — called by child pages */
    function showToast(message, type) {
        type = type || 'info';
        const bgMap = { success: 'text-bg-success', danger: 'text-bg-danger',
                        warning: 'text-bg-warning',  info:    'text-bg-secondary' };
        const el = document.createElement('div');
        el.className = 'toast align-items-center border-0 ' + (bgMap[type] || bgMap.info);
        el.setAttribute('role', 'alert');
        el.innerHTML = `
            <div class="d-flex">
                <div class="toast-body">${message}</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast"></button>
            </div>`;
        document.getElementById('toast-container').appendChild(el);
        new bootstrap.Toast(el, { delay: 4000 }).show();
        el.addEventListener('hidden.bs.toast', () => el.remove());
    }
</script>

<!-- ── PWA: service worker + iOS install hint ──────────────────────────── -->
<script th:inline="javascript">
    /* Register the service worker (offline fallback only). */
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
            navigator.serviceWorker.register('/sw.js').catch(function () { /* non-fatal */ });
        });
    }

    /* iOS Safari has no install prompt — show a one-time "Add to Home Screen"
       hint. Skipped if already running standalone or shown before. */
    (function () {
        var HINT_KEY = 'pwa-ios-hint-shown';
        var ua = navigator.userAgent || '';
        var isiOS = /iphone|ipad|ipod/i.test(ua);
        var isStandalone = navigator.standalone === true
            || matchMedia('(display-mode: standalone)').matches;
        if (!isiOS || isStandalone || localStorage.getItem(HINT_KEY)) return;

        var msg = /*[[#{pwa.ios.hint}]]*/ 'Tap the Share button, then "Add to Home Screen" to install.';
        window.addEventListener('load', function () {
            try {
                localStorage.setItem(HINT_KEY, '1');
                if (typeof showToast === 'function') showToast(msg, 'info');
            } catch (e) {}
        });
    })();
</script>

<!-- optional per-page scripts -->
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
