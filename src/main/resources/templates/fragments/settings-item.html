<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- ── One settings row — editable or read-only ───────────────────────────────
     Returned on its own by POST /admin/settings/update|reset (hx-swap=outerHTML),
     and inserted per-item by settings.html. `isAdmin` comes from GlobalModelAdvice. -->
<div th:fragment="item"
     class="setting-row row g-2 align-items-center py-2 border-bottom"
     th:id="'setting-' + (${item.key} ?: ${item.label})">

    <!-- Hidden key travels with the editor's hx-include (see the buttons below: the row is selected
         with `closest .setting-row`, NOT by this element's id — a key containing a dot, e.g.
         llm.direct-temperature, makes `#setting-llm.direct-temperature` parse as
         "#setting-llm with class .max-…", which matches nothing and posts neither key nor value). -->
    <input th:if="${item.editable}" type="hidden" name="key" th:value="${item.key}"/>

    <!-- Label + technical key + badges.
         `col-md` (no number) takes every column the value doesn't need, so a long Korean
         label gets the width instead of wrapping while dead space sits right of the value. -->
    <div class="col-12 col-md">
        <span class="fw-semibold" th:text="#{__${item.label}__}">label</span>
        <span th:if="${item.overridden}" class="badge bg-info ms-1"
              th:text="#{settings.badge.overridden}">overridden</span>
        <span th:if="${item.note != null}" class="badge bg-warning text-dark ms-1"
              th:text="#{__${item.note}__}">note</span>
        <!-- 값 열이 12rem 고정이라 계산 근거·적용 범위를 값에 다 적을 수 없다. 긴 설명은 여기로.
             초기화는 settings.html 하단에서(HTMX 스왑 후 재초기화 포함). -->
        <span th:if="${item.tooltip != null}" class="text-secondary ms-1" role="button"
              tabindex="0" data-bs-toggle="tooltip" data-bs-custom-class="tooltip-wide"
              th:title="#{__${item.tooltip}__}" aria-label="설명">&#9432;</span>
        <code th:if="${item.key != null}" class="d-block small text-secondary mt-1"
              th:text="'app.' + ${item.key}">app.key</code>
    </div>

    <!-- Value / editor — `.setting-value-col` is a FIXED width (see app.css), identical on every
         row so the editors line up in a column, and the label column (`col-md`) absorbs the rest
         of the width instead of leaving a gap right of the value. -->
    <div class="col-12 col-md-auto ps-md-3 setting-value-col">
        <!-- Admin editor for hot-editable items. Order is 값 → [기본값] → 저장; the field itself
             flexes (.setting-value), so on a row with no override — where the 기본값 button is
             absent — the input simply grows into that space and the group stays the same width. -->
        <div th:if="${item.editable and isAdmin}" class="input-group input-group-sm">
            <!-- 허용 범위는 컨트롤 자신에 툴팁으로 붙인다. 조건 분기가 없는 이유: 이 두 요소는
                 이미 타입별로 갈라져 있어 각자 자기 문구만 알면 된다. trigger=hover 로 고정하는 것이
                 중요하다 — Bootstrap 기본값은 'hover focus' 라, 값을 고치려고 클릭한 순간 툴팁이
                 떠서 아래 행을 가린 채 blur 까지 남는다. 명시 config 가 data 속성을 이기므로
                 (settings.html 의 initTooltips 는 delay 만 넘긴다) trigger 는 여기서 정해진다. -->
            <input th:if="${item.type == 'number'}" type="number" name="value" class="form-control setting-value"
                   th:value="${item.value}" th:min="${item.min}" th:max="${item.max}" th:step="${item.step}"
                   data-bs-toggle="tooltip" data-bs-trigger="hover"
                   th:title="#{settings.range.number(${item.minLabel}, ${item.maxLabel}, ${item.stepLabel})}"/>
            <select th:if="${item.type == 'bool'}" name="value" class="form-select setting-value"
                    data-bs-toggle="tooltip" data-bs-trigger="hover"
                    th:title="#{settings.range.bool}">
                <option value="true"  th:selected="${item.value == 'true'}">true</option>
                <option value="false" th:selected="${item.value == 'false'}">false</option>
            </select>
            <button type="button" class="btn btn-outline-secondary" th:if="${item.overridden}"
                    hx-post="/admin/settings/reset"
                    hx-include="closest .setting-row"
                    hx-target="closest .setting-row" hx-swap="outerHTML"
                    th:text="#{settings.btn.reset}">Reset</button>
            <button type="button" class="btn btn-primary"
                    hx-post="/admin/settings/update"
                    hx-include="closest .setting-row"
                    hx-target="closest .setting-row" hx-swap="outerHTML"
                    th:text="#{settings.btn.save}">Save</button>
        </div>
        <!-- Read-only value (non-editable rows, or guests on editable rows) -->
        <span th:unless="${item.editable and isAdmin}" class="font-monospace"
              th:text="${item.value}">value</span>
    </div>
</div>

</body>
</html>
