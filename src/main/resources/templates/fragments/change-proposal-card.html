<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--/* 유지보수 수정안 카드 하나(AGENT_MCP_DESIGN §10.7). 문서 화면(admin-change-job)과 고치기 응답이 같이 쓴다.
     필요한 값: v(ProposalView), job. 고치기가 거절됐을 때만 editError·editText 가 있다. */-->
<div th:fragment="card" class="card mb-2" th:id="'proposal-' + ${v.proposal.id}">
    <div class="card-header d-flex justify-content-between align-items-center flex-wrap gap-1">
        <span><span class="text-muted small" th:text="${v.proposal.chunkId}">id</span>
            <span class="badge ms-1" th:classappend="${v.proposal.kind == 'literal'} ? 'bg-light text-dark border' : 'bg-warning text-dark'"
                  th:text="#{'maint.kind.' + ${v.proposal.kind}}">literal</span>
            <span class="badge bg-info text-dark ms-1" th:if="${v.proposal.edited()}" th:text="#{maint.edited}">edited by admin</span></span>
        <span class="badge bg-secondary" th:text="#{'maint.status.' + ${v.proposal.status}}">pending</span>
    </div>
    <div class="card-body">
        <pre class="small mb-0" style="white-space:pre-wrap" th:text="${v.diff}">diff</pre>
        <p class="small text-muted mt-2 mb-0" th:if="${v.tooLarge}" th:text="#{maint.diff.too-large}">too large</p>
        <div class="small text-muted mt-2" th:if="${v.proposal.afterContext != null or v.proposal.afterKeywords != null}">
            <div th:if="${v.proposal.afterContext != null}"><span th:text="#{maint.context}">Context</span>:
                <span th:text="${v.proposal.afterContext}">ctx</span></div>
            <div th:if="${v.proposal.afterKeywords != null}"><span th:text="#{maint.keywords}">Keywords</span>:
                <span th:text="${v.proposal.afterKeywords}">kw</span></div>
        </div>
        <div class="alert alert-danger py-1 px-2 small mt-2 mb-0" th:if="${contextError != null}" th:text="${contextError}">error</div>

        <div th:if="${v.proposal.status == 'pending'}" class="mt-2">
            <details th:open="${editError != null}">
                <summary class="small" th:text="#{maint.edit}">Edit</summary>
                <form class="mt-2" th:unless="${v.proposal.kind == 'delete_chunk'}"
                      th:attr="hx-post=@{/admin/change-jobs/{id}/proposals/{pid}/edit(id=${job.id},pid=${v.proposal.id})},
                               hx-target='#proposal-' + ${v.proposal.id}"
                      hx-swap="outerHTML">
                    <div class="alert alert-danger py-1 px-2 small mb-2" th:if="${editError != null}" th:text="${editError}">error</div>
                    <textarea name="afterText" class="form-control form-control-sm font-monospace" rows="10"
                              th:text="${editText != null ? editText : v.proposal.afterText}">after</textarea>
                    <div class="small text-muted mt-1" th:text="#{maint.edit.hint}">hint</div>
                    <button type="submit" class="btn btn-outline-primary btn-sm mt-2" th:text="#{maint.edit.save}">Save</button>
                </form>
                <p class="small text-muted mt-2 mb-0" th:if="${v.proposal.kind == 'delete_chunk'}" th:text="#{maint.edit.delete-chunk}">no body</p>
            </details>
            <form class="mt-2" th:unless="${v.proposal.kind == 'delete_chunk'}"
                  th:attr="hx-post=@{/admin/change-jobs/{id}/proposals/{pid}/regenerate-context(id=${job.id},pid=${v.proposal.id})},
                           hx-target='#proposal-' + ${v.proposal.id}"
                  hx-swap="outerHTML">
                <button type="submit" class="btn btn-link btn-sm p-0" th:text="#{maint.regenerate-context}">Regenerate context</button>
                <span class="small text-muted ms-1" th:if="${v.proposal.edited()}" th:text="#{maint.regenerate-context.hint}">hint</span>
            </form>
            <form class="mt-2"
                  th:attr="hx-post=@{/admin/change-jobs/{id}/proposals/{pid}/withdraw(id=${job.id},pid=${v.proposal.id})},
                           hx-confirm=#{maint.withdraw.confirm}"
                  hx-swap="none">
                <button type="submit" class="btn btn-link btn-sm p-0 text-danger" th:text="#{maint.withdraw}">Withdraw this chunk</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
