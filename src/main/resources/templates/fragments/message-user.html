<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<div th:fragment="message" class="d-flex justify-content-end mb-3 user-turn"
     th:attr="data-question=${question},data-response-mode=${modeLabel}">
    <!-- ⚠️ 이 프래그먼트는 현재 어떤 컨트롤러도 렌더하지 않는다(문서의 구조 목록에만 남아 있다).
         모드 표기를 null-safe 로 둔 이유가 그것이다 — 나중에 배선될 때 modeLabel 모델 속성을
         빠뜨리면 표기가 '[null]' 로 찍히느니 아예 안 나오는 편이 낫다. -->
    <div class="bubble-user p-3"><span class="bubble-user-mode" th:if="${modeLabel != null}"
            th:text="'[' + ${modeLabel} + '] '">[RN] </span><span th:text="${question}">질문 내용</span></div>
    <i class="bi bi-person-circle fs-5 text-secondary ms-2 mt-1 flex-shrink-0"></i>
</div>
</body>
</html>
