<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<div th:fragment="message" class="d-flex align-items-end mb-3">
    <div class="bubble-assistant p-3 flex-grow-1">

        <!-- Question-type badge -->
        <span th:if="${questionType != null and !#strings.isEmpty(questionType)}"
              class="badge mb-2"
              th:classappend="'badge-' + ${questionType}"
              th:text="${questionType}"></span>

        <!-- PROGRESSIVE upgrade badge -->
        <span th:if="${premiumUpgraded != null}" class="badge-upgraded ms-1">
            ⬆ 고추론 재분석 → <span th:text="${premiumUpgraded}"></span>
        </span>

        <!-- 검증 결과 배지 — 문구·색·툴팁 판단은 전부 VerificationSnapshot 한 곳에 있다
             (SourceRef.staleBadge() 와 같은 이유: 렌더러가 셋이라 조건을 풀어 쓰면 갈라진다).
             verdictLabel=null 은 검증 미실행(S 모드, meta/Direct, 검색 결과 없음) → 아무것도 안 띄운다.
             통과 배지가 '검증됨'(초록)/'생성'(파랑)으로 갈리는 이유도 그 레코드에 적혀 있다.
             chat-stream.js 는 같은 규칙을 한 번 더 구현한다 — 바꾸면 양쪽을 함께 고쳐야 한다. -->
        <span th:if="${verification != null and verification.verdictLabel != null}"
              class="badge ms-1"
              th:classappend="${verification.verdictClass}"
              th:attr="title=${verification.verdictTitle}"
              th:style="${verification.verdictTitle != null} ? 'cursor:help;' : ''"
              th:text="${verification.verdictLabel}"></span>
        <!-- 발명된 이름 경고 — 재시도를 걸지 않는 값이라(§6.24 Step 2-d) 통과한 답변에도 붙는다. -->
        <span th:if="${verification != null and verification.hasInventedSymbols}"
              class="badge bg-warning text-dark ms-1" style="cursor:help;"
              th:attr="title=${verification.inventedSymbolsText}">문서 밖 이름
            <span th:text="${#lists.size(verification.inventedSymbols)}"></span></span>

        <!-- Answer (markdown → DOMPurify sanitized HTML) -->
        <div class="md-content"
             th:attr="data-md=${answer}"></div>

        <!-- 재시도를 다 쓰고도 검증을 통과하지 못한 답변의 사유. 배지 툴팁만으로는 모바일에서
             확인할 방법이 없어 한 줄로도 노출한다(chat-stream.js onDone 과 동일). -->
        <div th:if="${verification != null and verification.showsEvalReasonLine}"
             class="small text-warning mt-2">
            <i class="bi bi-exclamation-triangle me-1"></i>검증 미통과 사유:
            <span th:text="${verification.evalReason}"></span>
        </div>

        <!-- 경로·주소·포트·환경변수처럼 실행 환경에 따라 달라지는 값 안내. 이런 값은 문서와 달라도
             검증 실패로 치지 않으므로(prompt.answer.eval 의 환경 의존 값 예외) 검증 통과한 답변에도
             나올 수 있다 — 미통과 사유와 달리 grounded 조건을 걸지 않는다(chat-stream.js onDone 과 동일). -->
        <!-- 발명된 이름 목록 — 배지 툴팁만으로는 모바일에서 확인할 방법이 없다(evalReason과 같은 이유).
             C에서는 이것이 안전 신호라 통과·미통과와 무관하게 항상 펼쳐 보여준다. -->
        <div th:if="${verification != null and verification.hasInventedSymbols}"
             class="small text-warning mt-2">
            <i class="bi bi-exclamation-triangle me-1"></i>문서에서 확인되지 않은 이름:
            <span th:text="${verification.inventedSymbolsText}"></span>
        </div>

        <div th:if="${verification != null and verification.envNote != null}" class="small text-info mt-2">
            <i class="bi bi-info-circle me-1"></i>환경에 따라 달라질 수 있는 값:
            <span th:text="${verification.envNote}"></span>
        </div>

        <!-- 축소 안내: 아래 출처 목록은 검색된 전부라 줄지 않는다. 이 줄이 없으면 사용자는
             모델이 그 출처를 다 읽고 답한 것으로 읽는다. -->
        <div th:if="${verification != null and verification.budgetNote != null}" class="small text-warning mt-2">
            <i class="bi bi-scissors me-1"></i>
            <span th:text="${verification.budgetNote}"></span>
        </div>

        <!-- §10.12 검색어 재작성 안내: 질문 버블에는 원문이 그대로 떠 있으므로, 검색이 다른
             문장으로 돌았다는 사실을 말하지 않으면 잘못된 재작성이 "엉뚱한 답변"으로만 보인다.
             진단값이라 기본 숨김 — ui.retrieval-metrics-enabled 가 켜졌을 때만 하단 스크립트가
             d-none 을 벗긴다(출처 수치와 같은 규칙). -->
        <div th:if="${verification != null and verification.hasCondensedQuestion()}"
             class="condensed-question small text-muted mt-2 d-none">
            <i class="bi bi-search me-1"></i>검색에 사용된 질문:
            <span th:text="${verification.condensedQuestion}"></span>
        </div>

        <!-- Image thumbnails -->
        <div th:if="${imageRefs != null and !#lists.isEmpty(imageRefs)}" class="mt-2 d-flex flex-wrap gap-2">
            <a th:each="ref : ${imageRefs}"
               href="#"
               class="chat-image-thumb"
               th:attr="data-image-ref=${ref},data-turn-id=${turnId}">
                <img th:src="@{'/api/v1/' + ${ref}}"
                     alt="참조 이미지"
                     style="max-height:120px; max-width:180px; object-fit:contain; border:1px solid var(--border-default, #dee2e6); border-radius:4px;"
                     loading="lazy" />
            </a>
        </div>

        <!-- Sources accordion -->
        <details th:if="${sources != null and !#lists.isEmpty(sources)}" class="mt-2">
            <summary class="small text-muted" style="cursor:pointer;">
                ▶ <span th:text="#{sources.label}">Sources</span>
                (<span th:text="${#lists.size(sources)}"></span>)
            </summary>
            <!-- 배지와 그 수치는 .source-item 한 단위로 묶는다(chat.html 기록·chat-stream.js 와 동일).
                 예전에는 이 프래그먼트만 <ul>/<li> 로 그리면서 data-chunk-id/turn-id/share 를 싣지
                 않아, 출처를 눌러도 원문 보기 모달이 열리지 않았다 — 모달을 여는 클릭 위임이
                 badge.dataset.chunkId 가 없으면 그대로 빠져나가기 때문이다(chat.html). 출처
                 렌더러가 넷이므로 구조와 data-* 를 넷 다 같게 유지한다. -->
            <div class="mt-1">
                <span class="source-item" th:each="src : ${sources}"
                      th:attr="data-turn-id=${turnId},data-share=${src.answerShare}">
                    <a href="#" class="source-ref badge bg-secondary text-decoration-none"
                       th:text="${src.label}"
                       th:attr="data-bs-toggle='popover',
                                data-bs-trigger='hover focus',
                                data-bs-placement='top',
                                data-preview-md=${src.preview},
                                data-chunk-id=${src.chunkId}"></a>
                    <!-- 프롬프트에서 빠진 출처 — 모델이 읽지 '못한' 것이라, 읽고도 안 쓴
                         (answerShare 0) 것과 구별해서 보여야 한다. -->
                    <span th:if="${src.promptExcluded}"
                          class="badge ms-1 bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle"
                          style="font-size:0.62rem; vertical-align:middle; cursor:help;"
                          th:title="'컨텍스트 한도로 이 출처는 답변 생성에 사용되지 않았습니다. 모델이 읽지 못한 문서이므로 답변이 이 내용을 반영하지 못했을 수 있습니다.'">미사용</span>
                    <!-- 검색 진단 수치: 항상 렌더하되 기본 숨김 — ui.retrieval-metrics-enabled가
                         켜져 있을 때만 하단 스크립트가 d-none을 벗긴다(스트리밍 경로와 동일 규칙). -->
                    <span class="source-metrics text-muted d-none" style="font-size:0.72rem;"
                          th:if="${src.similarity != null or src.axisRanks != null or src.answerShare != null}">
                        <!-- 근거 품질 한 칸 — 유사도 우선, 없으면 축 표기로 대체(chat-stream.js의
                             renderSourceMetrics()와 같은 폴백 체인). 검색기여는 순위 기반이라
                             한 턴 안에서 평평해 /admin 패널에만 남긴다. -->
                        <span th:if="${src.similarity != null}"
                              th:text="'유사도 ' + ${#numbers.formatDecimal(src.similarity, 1, 2)}"></span>
                        <span th:if="${src.similarity == null and src.axisRanks != null}"
                              th:text="${src.axisRanks}"></span>
                        <!-- 앞 칸이 비었을 때 구분자로 시작하지 않도록 ' · '를 조건부로 붙인다 -->
                        <strong th:if="${src.answerShare != null}"
                                th:text="${(src.similarity != null or src.axisRanks != null) ? ' · ' : ''}
                                         + '응답 ' + ${#numbers.formatDecimal(src.answerShare * 100, 1, 0)} + '%'"></strong>
                    </span>
                </span>
            </div>
        </details>

        <!-- Feedback (like/dislike) + Metadata, same line -->
        <div class="mt-2 d-flex align-items-center flex-wrap gap-2">
            <div class="feedback-controls d-flex gap-1"
                 th:if="${turnId != null}"
                 th:attr="data-turn-id=${turnId},data-thread-id=${threadId}">
                <!-- 좋아요가 지식 제안을 열어 주지 않는 모드(S)에서는 누를 수 없게 하고 사유를
                     툴팁으로 밝힌다 — 예전에는 눌리고 상태까지 남아 기여한 것처럼 보였다. -->
                <button type="button" class="btn btn-sm btn-outline-secondary feedback-btn" data-feedback="LIKE"
                        th:if="${proposable}"
                        th:attr="aria-label=#{feedback.like},title=#{feedback.like}">👍</button>
                <button type="button" class="btn btn-sm btn-outline-secondary feedback-btn opacity-50"
                        th:unless="${proposable}" disabled
                        th:attr="aria-label=#{${curationBlockedKey}},title=#{${curationBlockedKey}}">👍</button>
                <button type="button" class="btn btn-sm btn-outline-secondary feedback-btn" data-feedback="DISLIKE"
                        th:attr="aria-label=#{feedback.dislike},title=#{feedback.dislike}">👎</button>
            </div>
            <div class="text-muted" style="font-size: 0.72rem;">
                <span th:if="${usedProvider != null}">🤖 <span th:text="${usedProvider}"></span>
                      &nbsp;·&nbsp;</span>
                <span>⏱ <span th:text="${#numbers.formatDecimal(elapsedSeconds,1,1)}"></span>
                      <span th:text="#{meta.elapsed}">sec</span></span>
                &nbsp;·&nbsp;
                <span>📥 <span th:text="${totalInputTokens}"></span>
                      <span th:text="#{meta.input.tokens}">tokens in</span></span>
                &nbsp;·&nbsp;
                <span>📤 <span th:text="${totalOutputTokens}"></span>
                      <span th:text="#{meta.output.tokens}">tokens out</span></span>
                &nbsp;·&nbsp;
                <span><span th:text="#{meta.total}">total</span>
                      <span th:text="${totalInputTokens + totalOutputTokens}"></span></span>
                &nbsp;·&nbsp;
                <span>🔄 <span th:text="#{meta.llm.calls}">LLM calls</span>
                      <span th:text="${llmCallCount}"></span></span>
                &nbsp;·&nbsp;
                <span>📝 <span th:text="${#strings.length(answer)}"></span>
                      <span th:text="#{meta.answer.length}">chars</span></span>
                <span th:if="${receivedAt != null}">&nbsp;·&nbsp;🕐 <span th:text="${receivedAt}"></span></span>
            </div>
        </div>
    </div>
    <i class="bi bi-robot fs-5 text-secondary ms-1 mt-1 flex-shrink-0"></i>
</div>

<script>
    /* Initialize Bootstrap Popovers on source refs in this fragment */
    const sourcePreviewEnabled = typeof window.isSourcePreviewEnabled === 'function'
        ? window.isSourcePreviewEnabled()
        : true;
    if (sourcePreviewEnabled && typeof window.initSourcePopovers === 'function') {
        window.initSourcePopovers(document);
    } else {
        document.querySelectorAll('.source-ref[data-bs-toggle="popover"]').forEach(function (el) {
            el.removeAttribute('data-bs-toggle');
            el.removeAttribute('data-bs-trigger');
            el.removeAttribute('data-bs-placement');
            el.removeAttribute('data-preview-md');
        });
    }

    /* 검색 진단 수치 노출 — 기본 숨김, ui.retrieval-metrics-enabled가 켜진 경우에만 보인다.
       서버 렌더/HTMX 프래그먼트 양쪽에서 같은 헬퍼를 쓰므로 모델 속성을 프래그먼트로
       내려보낼 필요가 없다(위 출처 미리보기 토글과 동일 패턴). */
    if (typeof window.isRetrievalMetricsEnabled === 'function' && window.isRetrievalMetricsEnabled()) {
        document.querySelectorAll('.source-metrics.d-none, .condensed-question.d-none').forEach(function (el) {
            el.classList.remove('d-none');
        });
    }

    /* Render all un-rendered md-content blocks with XSS sanitization + syntax highlight */
    document.querySelectorAll('.md-content[data-md]').forEach(function (el) {
        const raw = el.dataset.md || '';
        // 살균기가 없으면 마크다운 렌더를 포기하고 평문으로 — chat-stream.js 의 renderMarkdown() 과 같은 규칙.
        if (typeof marked === 'undefined' || typeof DOMPurify === 'undefined') {
            el.textContent = raw; delete el.dataset.md; return;
        }
        el.innerHTML = DOMPurify.sanitize(marked.parse(raw));
        if (typeof hljs !== 'undefined') {
            el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        }
        delete el.dataset.md;
    });
</script>
</body>
</html>
