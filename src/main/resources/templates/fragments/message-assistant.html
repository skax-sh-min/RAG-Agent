<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<div th:fragment="message" class="d-flex align-items-start mb-3">
    <i class="bi bi-robot fs-5 text-secondary me-2 mt-1 flex-shrink-0"></i>
    <div class="bubble-assistant p-3 flex-grow-1">

        <!-- Question-type badge -->
        <span th:if="${questionType != null and !#strings.isEmpty(questionType)}"
              class="badge mb-2"
              th:classappend="'badge-' + ${questionType}"
              th:text="${questionType}"></span>

        <!-- Answer (markdown → DOMPurify sanitized HTML) -->
        <div class="md-content"
             th:attr="data-md=${answer}"></div>

        <!-- Sources accordion -->
        <details th:if="${sources != null and !#lists.isEmpty(sources)}" class="mt-2">
            <summary class="small text-muted" style="cursor:pointer;">
                ▶ <span th:text="#{sources.label}">Sources</span>
                (<span th:text="${#lists.size(sources)}"></span>)
            </summary>
            <ul class="mt-1 mb-0 small ps-3">
                <li th:each="src : ${sources}" th:text="${src}"></li>
            </ul>
        </details>

        <!-- Metadata -->
        <div class="mt-2 text-muted" style="font-size: 0.72rem;">
            <span>⏱ <span th:text="${#numbers.formatDecimal(elapsedSeconds,1,1)}"></span>
                  <span th:text="#{meta.elapsed}">sec</span></span>
            &nbsp;·&nbsp;
            <span>📥 <span th:text="${totalInputTokens}"></span>
                  <span th:text="#{meta.input.tokens}">tokens in</span></span>
            &nbsp;·&nbsp;
            <span>📤 <span th:text="${totalOutputTokens}"></span>
                  <span th:text="#{meta.output.tokens}">tokens out</span></span>
            &nbsp;·&nbsp;
            <span><span th:text="#{meta.total}">total</span>
                  <span th:text="${totalInputTokens + totalOutputTokens}"></span></span>
            &nbsp;·&nbsp;
            <span>🔄 <span th:text="#{meta.llm.calls}">LLM calls</span>
                  <span th:text="${llmCallCount}"></span></span>
        </div>
    </div>
</div>

<script>
    /* Render all un-rendered md-content blocks with XSS sanitization */
    document.querySelectorAll('.md-content[data-md]').forEach(function (el) {
        const raw = el.dataset.md || '';
        if (typeof marked === 'undefined') { el.textContent = raw; delete el.dataset.md; return; }
        const html = marked.parse(raw);
        el.innerHTML = typeof DOMPurify !== 'undefined'
            ? DOMPurify.sanitize(html)
            : html;
        delete el.dataset.md;
    });
</script>
</body>
</html>
