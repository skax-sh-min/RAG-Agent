<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<div th:fragment="item"
     class="thread-item"
     th:if="${thread != null}"
     th:classappend="${thread.threadId == activeThreadId} ? ' active'"
     th:onclick="|window.location.href='/chat/${thread.threadId}'|">
    <div class="text-truncate small" th:text="${thread.title}">제목</div>
    <div class="text-muted" style="font-size: 0.72rem;" th:text="${thread.updatedAt}"></div>
</div>
</body>
</html>
