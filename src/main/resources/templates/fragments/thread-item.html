<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<div th:fragment="item"
     th:if="${thread != null}"
     th:id="'thread-' + ${thread.threadId}"
     class="thread-item"
     th:classappend="${thread.threadId == activeThreadId} ? ' active'"
     th:attr="data-href=@{/chat/{id}(id=${thread.threadId})}"
     onclick="window.location.href=this.dataset.href">
    <div class="text-truncate small" th:text="${thread.title}">제목</div>
    <div class="thread-date text-muted" style="font-size: 0.72rem;"
         th:attr="data-date=${thread.updatedAt}"
         th:text="${thread.updatedAt}"></div>
</div>
</body>
</html>
