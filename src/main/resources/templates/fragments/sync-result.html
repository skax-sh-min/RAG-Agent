<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<div th:fragment="result">
    <div th:if="${success}"
         class="toast align-items-center border-0 text-bg-success show"
         role="alert">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle me-1"></i>
                <span th:text="#{toast.sync.done}">Sync complete</span>
                <span th:if="${!#lists.isEmpty(indexed)}">
                    · <span th:text="#{toast.sync.new}">new</span>
                    <span th:text="${#lists.size(indexed)}"></span>
                </span>
                <span th:if="${updated != null and !#lists.isEmpty(updated)}">
                    · <span th:text="#{toast.sync.updated}">updated</span>
                    <span th:text="${#lists.size(updated)}"></span>
                </span>
                <span th:if="${deleted != null and !#lists.isEmpty(deleted)}">
                    · <span th:text="#{toast.sync.deleted}">deleted</span>
                    <span th:text="${#lists.size(deleted)}"></span>
                </span>
                <span th:if="${#lists.isEmpty(indexed) and (updated == null or #lists.isEmpty(updated)) and (deleted == null or #lists.isEmpty(deleted))}"
                      th:text="#{toast.sync.no_changes}">· No changes</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
    <div th:unless="${success}"
         class="toast align-items-center border-0 text-bg-danger show"
         role="alert">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-exclamation-triangle me-1"></i>
                <span th:text="${message} ?: #{toast.sync.fail}">Sync failed.</span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>
</body>
</html>
