<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<div th:fragment="result">
    <div th:if="${success}"
         class="toast align-items-center border-0 text-bg-success show"
         role="alert">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-check-circle me-1"></i>
                동기화 완료
                <span th:if="${!#lists.isEmpty(indexed)}">
                    · 신규 <span th:text="${#lists.size(indexed)}"></span>건
                </span>
                <span th:if="${updated != null and !#lists.isEmpty(updated)}">
                    · 업데이트 <span th:text="${#lists.size(updated)}"></span>건
                </span>
                <span th:if="${deleted != null and !#lists.isEmpty(deleted)}">
                    · 삭제 <span th:text="${#lists.size(deleted)}"></span>건
                </span>
                <span th:if="${#lists.isEmpty(indexed) and (updated == null or #lists.isEmpty(updated)) and (deleted == null or #lists.isEmpty(deleted))}">
                    · 변경 없음
                </span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
    <div th:unless="${success}"
         class="toast align-items-center border-0 text-bg-danger show"
         role="alert">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-exclamation-triangle me-1"></i>
                <span th:text="${message} ?: '동기화 실패'"></span>
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>
</body>
</html>
