<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

<!-- 3단계 검색 진단 수치 패널 — /admin/retrieval-metrics 로 지연 로딩되는 카드 본문.
     큐레이션 패널과 동일하게 이 프래그먼트에는 <script>를 두지 않는다: 페이지네이션 재조회가
     plain innerHTML 삽입이라 프래그먼트 내장 스크립트는 실행되지 않기 때문(admin.html의
     loadRetrievalMetrics()가 페이지 레벨에 있다). -->
<th:block th:fragment="panel">
<div class="card-body p-0">
    <div class="px-3 py-2 border-bottom d-flex align-items-center flex-wrap gap-2 small text-muted">
        전체 <span class="badge bg-secondary" th:text="${metricsTotal}">0</span>턴
        <span class="ms-2">검색 튜닝용 읽기 전용 뷰 — 값의 의미는 운영자 매뉴얼 §6.5 참고</span>
        <select class="form-select form-select-sm ms-auto" style="max-width:100px;"
                onchange="applyMetricsLimitFilter(this)">
            <option value="20"  th:selected="${limit == 20}">20건</option>
            <option value="50"  th:selected="${limit == 50}">50건</option>
            <option value="100" th:selected="${limit == 100}">100건</option>
        </select>
    </div>

    <div class="px-3 py-2 border-bottom d-flex align-items-center gap-2 small text-muted"
         th:if="${#lists.size(metricTurns) > 0 or offset > 0}">
        <button class="btn btn-sm btn-outline-secondary py-0 px-2"
                th:disabled="${offset == 0}"
                th:data-offset="${offset - limit}" th:data-limit="${limit}"
                onclick="loadRetrievalMetrics(+this.dataset.offset, +this.dataset.limit)">‹ 이전</button>
        <span>
            <span th:text="${offset + 1}">1</span> –
            <span th:text="${offset + #lists.size(metricTurns)}">20</span>
        </span>
        <button class="btn btn-sm btn-outline-secondary py-0 px-2"
                th:disabled="${#lists.size(metricTurns) < limit}"
                th:data-offset="${offset + limit}" th:data-limit="${limit}"
                onclick="loadRetrievalMetrics(+this.dataset.offset, +this.dataset.limit)">다음 ›</button>
    </div>

    <div th:if="${#lists.isEmpty(metricTurns)}" class="text-muted small p-3 text-center">
        기록된 검색 진단 수치가 없습니다. RAG 질문을 한 번 이상 해야 쌓입니다.
    </div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(metricTurns)}">
        <table class="table table-sm table-hover mb-0 small align-middle">
            <thead>
            <tr>
                <th style="width:130px;">시각</th>
                <th>질문</th>
                <th style="width:60px;">모드</th>
                <th style="width:90px;">최고 유사도</th>
                <th style="width:110px;">사용/검색</th>
                <th style="width:60px;"></th>
            </tr>
            </thead>
            <tbody th:each="t : ${metricTurns}">
            <tr>
                <td class="text-muted text-nowrap" th:text="${t.askedAt}">2026-08-16</td>
                <td class="text-truncate" style="max-width:0;" th:text="${t.question}" th:title="${t.question}">질문</td>
                <td><span class="badge bg-secondary" th:text="${t.responseMode} ?: '-'">M</span></td>
                <td th:text="${t.maxSimilarity != null} ? ${#numbers.formatDecimal(t.maxSimilarity, 1, 2)} : '-'">0.72</td>
                <!-- 검색은 많이 했는데 답변이 거의 안 쓴 턴이 튜닝에서 가장 볼 만한 신호다 -->
                <td>
                    <span th:text="${t.usedSourceCount}">3</span>/<span th:text="${#lists.size(t.sources)}">8</span>
                    <span class="text-warning" th:if="${t.usedSourceCount * 2 < #lists.size(t.sources)}"
                          title="검색된 출처의 절반 이상이 답변에 반영되지 않았습니다 — topK 과다 또는 프롬프트 문제일 수 있습니다">⚠</span>
                </td>
                <td>
                    <button class="btn btn-sm btn-outline-secondary py-0 px-2"
                            th:data-target="'metrics-detail-' + ${t.turnId}"
                            onclick="const el=document.getElementById(this.dataset.target); el.classList.toggle('d-none');">
                        상세
                    </button>
                </td>
            </tr>
            <tr class="d-none" th:id="'metrics-detail-' + ${t.turnId}">
                <td colspan="6" class="bg-body-tertiary">
                    <div class="small text-muted mb-1">
                        turn #<span th:text="${t.turnId}">1</span>
                        · provider <span th:text="${t.provider} ?: '-'">local</span>
                    </div>
                    <table class="table table-sm mb-0 small">
                        <thead>
                        <tr>
                            <th>출처</th>
                            <th style="width:80px;">유사도</th>
                            <th style="width:80px;">검색기여</th>
                            <th style="width:120px;">축별 순위</th>
                            <th style="width:80px;">응답참여</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${t.sources}">
                            <td class="text-truncate" style="max-width:0;" th:text="${s.label}" th:title="${s.label}">문서</td>
                            <!-- null = 측정 안 됨(벡터 축에 없던 청크 등). 0으로 보이면 안 되므로 '-' -->
                            <td th:text="${s.similarity != null} ? ${#numbers.formatDecimal(s.similarity, 1, 2)} : '-'">0.72</td>
                            <td th:text="${s.retrievalShare != null} ? ${#numbers.formatDecimal(s.retrievalShare * 100, 1, 0)} + '%' : '-'">18%</td>
                            <td class="text-muted" th:text="${s.axisRanks} ?: '-'">vec:2, bm25:5</td>
                            <td th:text="${s.answerShare != null} ? ${#numbers.formatDecimal(s.answerShare * 100, 1, 0)} + '%' : '-'">31%</td>
                        </tr>
                        </tbody>
                    </table>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</th:block>

</body>
</html>
