<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>

<!--
  Fragment: cards
  Model:    reports (List<LlmProviderReport>)
  Used by:  llm-usage.html (initial render) + GET /ui/llm-usage/cards (HTMX every 30 s)
-->
<div th:fragment="cards" class="row g-3">

    <!-- ── Per-provider card ──────────────────────────────────────────── -->
    <div th:each="r : ${reports}" class="col-12 col-sm-6 col-xl-3">
        <div class="card h-100"
             th:classappend="${!r.configured} ? ' opacity-50' : (${r.blocked} ? ' border-danger border-2' : '')">

            <!-- Header: name + role badge + type badge + orphan delete button (§6.8) -->
            <div class="card-header d-flex justify-content-between align-items-center py-2">
                <span class="fw-semibold small" th:text="${r.name}">provider</span>
                <div>
                    <span th:switch="${r.role}">
                        <span th:case="'LOCAL'"   class="badge bg-success me-1">LOCAL</span>
                        <span th:case="'NORMAL'"  class="badge bg-info text-dark me-1">NORMAL</span>
                        <span th:case="'PREMIUM'" class="badge bg-warning text-dark me-1">PREMIUM</span>
                    </span>
                    <span class="badge bg-secondary" th:text="${r.type}">TYPE</span>
                    <button th:if="${r.deletable}"
                            type="button"
                            class="btn btn-sm btn-link text-danger p-0 ms-1 align-baseline"
                            th:attr="hx-delete=@{/admin/llm-usage/{provider}(provider=${r.name})},hx-confirm=#{llm.orphan.confirm}"
                            hx-target="#llm-cards-target"
                            hx-swap="innerHTML"
                            th:title="#{llm.orphan.delete}">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>

            <div class="card-body py-2 px-3">

                <!-- Model name -->
                <div class="text-muted small mb-2">
                    <i class="bi bi-cpu me-1"></i>
                    <span th:text="${r.model}">model-name</span>
                </div>

                <!-- Circuit Breaker / Configuration status -->
                <div class="mb-3">
                    <!-- API key not configured -->
                    <span th:if="${!r.configured}"
                          class="badge bg-secondary">
                        <i class="bi bi-key me-1"></i>API 키 미설정
                    </span>
                    <!-- Normal -->
                    <span th:if="${r.configured and !r.blocked}"
                          class="badge bg-success">
                        <i class="bi bi-check-circle-fill me-1"></i>
                        <span th:text="#{llm.status.normal}">Normal</span>
                    </span>
                    <!-- Blocked + countdown -->
                    <span th:if="${r.configured and r.blocked}"
                          class="badge bg-danger"
                          th:attr="data-blocked-until=${r.blockedUntilIso()}">
                        <i class="bi bi-x-circle-fill me-1"></i>
                        <span th:text="#{llm.status.blocked}">Blocked</span>
                        <span class="blocked-countdown ms-1 font-monospace">--:--</span>
                    </span>
                    <div th:if="${r.configured and r.blocked}"
                         class="text-muted mt-1"
                         style="font-size:.72rem;"
                         th:text="#{llm.blocked.until} + ' ' + ${r.blockedUntil}">
                    </div>
                </div>

                <!-- Token stats mini-table -->
                <table class="table table-sm mb-0" style="font-size:0.76rem;">
                    <thead class="table-light">
                    <tr>
                        <th class="py-1"></th>
                        <th class="text-end py-1" th:text="#{llm.stat.daily}">Today</th>
                        <th class="text-end py-1" th:text="#{llm.stat.weekly}">7d</th>
                        <th class="text-end py-1" th:text="#{llm.stat.monthly}">Mo</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr>
                        <td class="text-muted py-1" th:text="#{llm.stat.tokens}">Tokens</td>
                        <td class="text-end py-1"
                            th:text="${#numbers.formatInteger(r.daily.inputTokens + r.daily.outputTokens, 1, 'COMMA')}">0</td>
                        <td class="text-end py-1"
                            th:text="${#numbers.formatInteger(r.weekly.inputTokens + r.weekly.outputTokens, 1, 'COMMA')}">0</td>
                        <td class="text-end py-1"
                            th:text="${#numbers.formatInteger(r.monthly.inputTokens + r.monthly.outputTokens, 1, 'COMMA')}">0</td>
                    </tr>
                    <tr>
                        <td class="text-muted py-1" th:text="#{llm.stat.calls}">Calls</td>
                        <td class="text-end py-1" th:text="${r.daily.callCount}">0</td>
                        <td class="text-end py-1" th:text="${r.weekly.callCount}">0</td>
                        <td class="text-end py-1" th:text="${r.monthly.callCount}">0</td>
                    </tr>
                    </tbody>
                </table>

            </div>
        </div>
    </div>

    <!-- Empty state -->
    <div th:if="${#lists.isEmpty(reports)}" class="col-12">
        <div class="alert alert-secondary py-2 mb-0">
            <i class="bi bi-info-circle me-2"></i>
            <span th:text="#{llm.no.providers}">No providers configured.</span>
            <code>app.llm.providers</code>
        </div>
    </div>

</div>
</body>
</html>
