<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<div th:fragment="list" id="thread-list">
    <p th:if="${#lists.isEmpty(threads)}"
       class="text-muted small px-1"
       th:text="#{chat.threads.empty}">No conversations.</p>
    <div th:each="thread : ${threads}"
         th:id="'thread-' + ${thread.threadId}"
         class="thread-item"
         th:classappend="${thread.threadId == activeThreadId} ? ' active'"
         th:onclick="|window.location.href='/chat/${thread.threadId}'|">
        <div class="text-truncate small" th:text="${thread.title}">제목</div>
        <div class="thread-date text-muted" style="font-size: 0.72rem;"
             th:attr="data-date=${thread.updatedAt}"
             th:text="${thread.updatedAt}"></div>
    </div>
</div>
</body>
</html>
