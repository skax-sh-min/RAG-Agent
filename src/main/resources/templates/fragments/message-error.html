<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body>
<div th:fragment="message" class="d-flex align-items-end mb-3">
    <div class="bubble-assistant p-3 border-danger text-danger">
        <i class="bi bi-exclamation-triangle me-1"></i>
        <span th:text="${errorMessage} ?: #{error.chat.failed}">An error occurred.</span>
    </div>
    <i class="bi bi-robot fs-5 text-danger ms-1 mt-1 flex-shrink-0"></i>
</div>
</body>
</html>
