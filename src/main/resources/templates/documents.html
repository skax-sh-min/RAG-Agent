<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="ko">
<head>
    <title th:text="#{nav.documents}">Documents</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container-fluid py-4" style="max-width: 1500px;">

        <!-- ── Upload card ───────────────────────────────────────────── -->
        <div class="card mb-4">
            <div class="card-header fw-semibold">
                <i class="bi bi-cloud-upload me-1"></i>
                <span th:text="#{doc.upload.title}">Document Upload</span>
            </div>
            <div class="card-body">

                <!-- Drop zone -->
                <div id="drop-zone" class="drop-zone text-center py-5 mb-3">
                    <i class="bi bi-folder2-open fs-2 text-secondary d-block mb-2"></i>
                    <span class="text-muted" th:text="#{doc.drop.hint}">Drag files here or click to select</span><br/>
                    <small class="text-muted" th:text="#{doc.drop.formats}">Supported: PDF, PPTX, DOCX, TXT, MD · Max 200 MB</small>
                    <input id="file-input" type="file"
                           accept=".pdf,.pptx,.docx,.txt,.md"
                           multiple class="d-none"/>
                </div>

                <!-- Selected file list (populated by JS) -->
                <div id="file-list" class="d-none mb-3">
                    <table class="table table-sm mb-2">
                        <thead><tr>
                            <th th:text="#{doc.col.name}">Filename</th>
                            <th th:text="#{doc.col.size}">Size</th>
                            <th th:text="#{doc.col.status}">Status</th>
                            <th></th>
                        </tr></thead>
                        <tbody id="file-list-body"></tbody>
                    </table>
                    <!-- Overall progress -->
                    <div id="overall-progress" class="d-none">
                        <div class="d-flex justify-content-between small text-muted mb-1">
                            <span id="overall-label"></span>
                        </div>
                        <div class="progress" style="height: 6px;">
                            <div id="overall-bar" class="progress-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <div class="input-group input-group-sm" style="width: 180px;">
                        <span class="input-group-text" th:text="#{doc.version.label}">Version</span>
                        <input id="version-input" name="version" type="text"
                               class="form-control"
                               style="min-width: 100px;" value="latest"
                               list="version-options"
                               th:placeholder="#{doc.version.label}"/>
                    </div>
                    <datalist id="version-options"></datalist>

                    <div class="input-group input-group-sm" style="min-width: 200px; max-width: 400px;">
                        <span class="input-group-text"><i class="bi bi-tags"></i></span>
                        <input id="tags-input" name="tags" type="text"
                               class="form-control"
                               th:placeholder="#{doc.tags.placeholder}"
                               th:title="#{doc.tags.tooltip}" autocomplete="off"/>
                    </div>
                    <div class="form-check form-check-inline mb-0">
                        <input class="form-check-input" type="checkbox" id="add-image-desc-checkbox"/>
                        <label class="form-check-label small" for="add-image-desc-checkbox"
                               th:text="#{doc.upload.image_desc.option}"
                               th:title="#{doc.upload.image_desc.tooltip}">이미지 설명 추가</label>
                    </div>
                    <div class="form-check form-check-inline mb-0">
                        <input class="form-check-input" type="checkbox" id="add-heading-numbers-checkbox" checked/>
                        <label class="form-check-label small" for="add-heading-numbers-checkbox"
                               th:text="#{doc.upload.heading_number.option}"
                               th:title="#{doc.upload.heading_number.tooltip}">소제목 숫자 생성</label>
                    </div>
                    <button id="upload-btn" class="btn btn-sm btn-primary" disabled>
                        <i class="bi bi-upload me-1"></i>
                        <span th:text="#{doc.btn.upload}">Upload &amp; Index</span>
                    </button>
                    <button id="sync-btn" class="btn btn-sm btn-outline-secondary" onclick="startSync()">
                        <span id="sync-spinner" class="spinner-border spinner-border-sm me-1 d-none" role="status"></span>
                        <i class="bi bi-arrow-repeat me-1"></i>
                        <span th:text="#{doc.btn.sync}">Sync Folder</span>
                    </button>
                </div>
                <!-- 기존 태그 칩 (클릭하면 위 입력칸에 추가) -->
                <div id="tag-suggest" class="d-none mt-2">
                    <span class="small text-muted me-1" th:text="#{tags.existing}">Existing tags</span>
                    <span id="tag-suggest-chips" class="d-inline-flex flex-wrap gap-1 align-middle"></span>
                </div>
                <!-- Sync progress (shown only during sync) -->
                <div id="sync-progress" class="d-none mt-3">
                    <div class="d-flex align-items-center gap-2 mb-1">
                        <span class="spinner-border spinner-border-sm text-secondary flex-shrink-0"></span>
                        <span id="sync-stage-label" class="small text-muted"></span>
                    </div>
                    <div class="progress" style="height: 5px;">
                        <div id="sync-progress-bar" class="progress-bar" style="width: 0%; transition: width 0.4s;"></div>
                    </div>
                </div>

            </div>
        </div>

        <!-- ── Active task recovery panel (shown when returning mid-index) ── -->
        <div id="recovery-panel" class="card border-info mb-4 d-none">
            <div class="card-header text-info fw-semibold d-flex align-items-center gap-2">
                <span class="spinner-border spinner-border-sm flex-shrink-0" role="status"></span>
                진행 중인 인덱싱 작업
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <thead class="table-light">
                            <tr>
                                <th th:text="#{doc.col.name}">Filename</th>
                                <th th:text="#{doc.col.status}">Status</th>
                            </tr>
                        </thead>
                        <tbody id="recovery-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ── Document list ─────────────────────────────────────────── -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-semibold">
                    <i class="bi bi-file-earmark-text me-1"></i>
                    <span th:text="#{doc.list.title}">Indexed Documents</span>
                </span>
                <button class="btn btn-sm btn-outline-secondary"
                        hx-get="/ui/documents/list"
                        hx-target="#doc-table-body"
                        hx-swap="outerHTML">
                    <span class="htmx-indicator spinner-border spinner-border-sm me-1" role="status"></span>
                    <i class="bi bi-arrow-clockwise me-1"></i>
                    <span th:text="#{doc.btn.refresh}">Refresh</span>
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th th:text="#{doc.col.name}">Filename</th>
                            <th th:text="#{doc.col.version}">Version</th>
                            <th th:text="#{doc.col.tags}">Tags</th>
                            <th th:text="#{doc.col.chunks}">Chunks</th>
                            <th th:text="#{doc.col.indexed_at}">Indexed At</th>
                            <th></th>
                        </tr>
                        </thead>
                        <th:block th:replace="~{fragments/doc-table-body :: body}"></th:block>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<th:block layout:fragment="scripts">
<script th:inline="javascript">
    /* Page-level i18n (complements global I18N from base.html) */
    const PAGE_I18N = {
        statusDone:   /*[[#{status.done}]]*/ 'Done',
        chunks:       /*[[#{toast.upload.chunks}]]*/ 'chunks'
    };
</script>
<script>
    /* ── Drop zone ───────────────────────────────────────────────────────── */
    const dropZone  = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(Array.from(e.dataTransfer.files));
    });
    fileInput.addEventListener('change', () => handleFiles(Array.from(fileInput.files)));

    function handleFiles(files) {
        const limit = 200 * 1024 * 1024;
        files.filter(f => f.size > limit).forEach(f =>
            showToast(`${escHtml(f.name)}: ${I18N.fileTooBig}`, 'warning'));
        selectedFiles = files.filter(f => f.size <= limit);
        if (selectedFiles.length === 0) return;

        const existing = existingFilenames();
        selectedFiles.forEach(f => {
            const nextName = predictDuplicateName(f.name, existing);
            if (nextName) showToast(escHtml(duplicateMessage(nextName)), 'warning');
        });

        renderFileList();
        document.getElementById('upload-btn').disabled = false;
    }

    /** Filenames of documents already indexed — scraped from the live doc table, no extra round trip. */
    function existingFilenames() {
        return new Set(Array.from(document.querySelectorAll('#doc-table-body .doc-filename'))
            .map(el => el.textContent.trim())
            .filter(Boolean));
    }

    /**
     * If `filename` collides with an already-indexed document, predicts the "_vN" name the
     * server will actually store it under (mirrors DocumentController#versionedPath). Returns
     * null when there's no collision. Best-effort: only sees registered docs, not stray files
     * dropped into data/documents/ that were never synced.
     */
    function predictDuplicateName(filename, existing) {
        const name = filename.normalize('NFC');
        if (!existing.has(name)) return null;
        const dot = name.lastIndexOf('.');
        const stem = dot > 0 ? name.substring(0, dot) : name;
        const ext  = dot > 0 ? name.substring(dot)    : '';
        for (let v = 2; v <= 99; v++) {
            const candidate = `${stem}_v${v}${ext}`;
            if (!existing.has(candidate)) return candidate;
        }
        return `${stem}_v${Date.now()}${ext}`;
    }

    function duplicateMessage(nextName) {
        return I18N.duplicateFileName.replace('{name}', nextName);
    }

    function renderFileList() {
        const existing = existingFilenames();
        const tbody = document.getElementById('file-list-body');
        tbody.innerHTML = selectedFiles.map((f, i) => {
            const nextName = predictDuplicateName(f.name, existing);
            const status = nextName
                ? `<span class="text-warning"><i class="bi bi-exclamation-triangle-fill"></i> ${escHtml(duplicateMessage(nextName))}</span>`
                : `<span class="text-muted">⏳ ${I18N.statusWaiting}</span>`;
            return `
            <tr id="file-row-${i}">
                <td class="text-truncate" style="max-width:260px;">${escHtml(f.name)}</td>
                <td>${(f.size / 1024 / 1024).toFixed(1)} MB</td>
                <td id="file-status-${i}" style="min-width:260px;">${status}</td>
                <td><button class="btn btn-sm btn-link text-danger p-0"
                            onclick="removeFile(${i})">✕</button></td>
            </tr>`;
        }).join('');
        document.getElementById('file-list').classList.remove('d-none');
    }

    function removeFile(i) {
        selectedFiles.splice(i, 1);
        if (selectedFiles.length === 0) {
            document.getElementById('file-list').classList.add('d-none');
            document.getElementById('upload-btn').disabled = true;
        } else {
            renderFileList();
        }
    }

    document.getElementById('upload-btn').addEventListener('click', () => {
        const version = (document.getElementById('version-input').value || '').trim() || 'latest';
        const tags = (document.getElementById('tags-input').value || '').trim();
        const addImageDescriptions = document.getElementById('add-image-desc-checkbox').checked;
        const addHeadingNumbers = document.getElementById('add-heading-numbers-checkbox').checked;
        uploadFiles([...selectedFiles], version, tags, addImageDescriptions, addHeadingNumbers);
    });

    /* ── Upload orchestration ────────────────────────────────────────────── */
    async function uploadFiles(files, version, tags, addImageDescriptions, addHeadingNumbers) {
        const btn = document.getElementById('upload-btn');
        btn.disabled = true;

        const overallEl    = document.getElementById('overall-progress');
        const overallLabel = document.getElementById('overall-label');
        const overallBar   = document.getElementById('overall-bar');
        overallEl.classList.remove('d-none');

        let doneCount = 0;
        const total = files.length;

        for (let i = 0; i < total; i++) {
            setFileStatus(i, 'uploading');
            try {
                const result = await uploadWithProgress(files[i], version, tags,
                    addImageDescriptions, addHeadingNumbers,
                    pct => {                                    // XHR upload progress
                        setUploadBar(i, pct);
                        if (pct === 100) setFileStatus(i, 'queued');
                    },
                    evt => setIndexingStage(i, evt)            // SSE indexing progress
                );
                setFileStatus(i, 'done', result.chunks);
                appendDocRow(result);
                showToast(`${escHtml(result.filename)} ${I18N.uploadSuccess} (${result.chunks} ${I18N.uploadChunks})`, 'success');
            } catch (err) {
                setFileStatus(i, 'error', err.message);
                showToast(`${escHtml(files[i].name)} ${I18N.uploadError}: ${err.message}`, 'danger');
            }
            doneCount++;
            overallLabel.textContent = `${doneCount} / ${total}`;
            overallBar.style.width = `${(doneCount / total) * 100}%`;
        }

        htmx.ajax('GET', '/ui/documents/list', {target: '#doc-table-body', swap: 'outerHTML'});
        loadTagSuggestions();   // 새 태그가 추가됐을 수 있으니 제안 목록 갱신
    }

    /**
     * Phase 1 — XHR: POST file → receive {taskId} (HTTP 202).
     * Phase 2 — SSE: subscribe to /ui/documents/progress/{taskId} for chunk-level events.
     * Resolves with DocumentInfo on 'done', rejects on 'error'.
     */
    function uploadWithProgress(file, version, tags, addImageDescriptions, addHeadingNumbers, onUploadPct, onStage) {
        return new Promise((resolve, reject) => {
            const xhr  = new XMLHttpRequest();
            const form = new FormData();
            form.append('file', file);
            form.append('version', version);
            if (tags) form.append('tags', tags);   // 검색 스코프 태그
            form.append('addImageDescriptions', addImageDescriptions ? 'true' : 'false');
            form.append('addHeadingNumbers', addHeadingNumbers ? 'true' : 'false');

            xhr.upload.addEventListener('progress', e => {
                if (e.lengthComputable) onUploadPct(Math.round(e.loaded / e.total * 100));
            });
            xhr.upload.addEventListener('load', () => onUploadPct(100));

            xhr.addEventListener('load', () => {
                if (xhr.status === 202) {
                    const { taskId } = JSON.parse(xhr.responseText);
                    storePendingTask(taskId, file.name);
                    subscribeIndexingProgress(taskId, onStage, resolve, reject);
                } else if (xhr.status === 503) {
                    reject(new Error(I18N.chromaUnavailable));
                } else {
                    reject(new Error(xhr.status === 400 ? I18N.fileEmpty
                            : `${I18N.serverError} (${xhr.status})`));
                }
            });
            xhr.addEventListener('error', () => reject(new Error(I18N.networkError)));
            xhr.addEventListener('abort', () => reject(new Error(I18N.cancelled)));

            xhr.open('POST', '/ui/documents/upload');
            xhr.send(form);
        });
    }

    function subscribeIndexingProgress(taskId, onStage, resolve, reject) {
        const sse = new EventSource(`/ui/documents/progress/${taskId}`);
        let retryCount = 0;
        sse.addEventListener('progress', e => {
            retryCount = 0;
            const evt = JSON.parse(e.data);
            onStage(evt);
            if (evt.stage === 'done') {
                sse.close();
                dropPendingTask(taskId);
                resolve(evt.docResult);
            } else if (evt.stage === 'error') {
                sse.close();
                dropPendingTask(taskId);
                reject(new Error(evt.message || '인덱싱 오류'));
            }
        });
        sse.onerror = () => {
            retryCount++;
            if (retryCount > 5) {
                sse.close();
                reject(new Error('SSE 연결 실패 (재시도 초과)'));
            }
        };
        return sse;
    }

    /* ── File row status helpers ─────────────────────────────────────────── */
    function setFileStatus(i, status, extra) {
        const el = document.getElementById(`file-status-${i}`);
        if (!el) return;
        const map = {
            uploading: `<span class="text-primary">🔄 ${I18N.statusUploading}</span>
                        <div id="upload-bar-${i}" class="progress mt-1" style="height:4px;">
                            <div class="progress-bar" style="width:0%;transition:width 0.2s;"></div>
                        </div>`,
            queued:    `<span class="text-info">⏳ 인덱싱 대기 중...</span>`,
            done:      `<span class="text-success">✅ ${PAGE_I18N.statusDone} (${extra} ${PAGE_I18N.chunks})</span>`,
            error:     `<span class="text-danger">❌ ${extra}</span>`,
        };
        if (map[status]) el.innerHTML = map[status];
    }

    function setUploadBar(i, pct) {
        const bar = document.querySelector(`#upload-bar-${i} .progress-bar`);
        if (bar) bar.style.width = pct + '%';
    }

    function setIndexingStage(i, evt) {
        setIndexingStageById(`file-status-${i}`, evt);
    }

    function setIndexingStageById(elId, evt) {
        const el = document.getElementById(elId);
        if (!el) return;

        const pct = evt.total > 0 ? Math.round(evt.done / evt.total * 100) : 0;

        const stageHtml = {
            loading:    () => evt.total > 0 ? `
                <div class="d-flex justify-content-between align-items-center small mb-1">
                    <span class="text-info">📄 ${escHtml(evt.message || '문서 로드 중...')}</span>
                    <span class="text-muted fw-semibold">${evt.done} / ${evt.total}</span>
                </div>
                <div class="progress" style="height:5px;">
                    <div class="progress-bar bg-secondary"
                         style="width:${pct}%; transition:width 0.3s;"></div>
                </div>` : `<span class="text-info">📄 ${escHtml(evt.message || '문서 로드 중...')}</span>`,
            structuring: () => evt.total > 0 ? `
                <div class="d-flex justify-content-between align-items-center small mb-1">
                    <span class="text-info">🧱 Markdown 구조화 중</span>
                    <span class="text-muted fw-semibold">${evt.done} / ${evt.total} 블록</span>
                </div>
                <div class="progress" style="height:5px;">
                    <div class="progress-bar bg-warning"
                         style="width:${pct}%; transition:width 0.3s;"></div>
                </div>` : `<span class="text-info">🧱 Markdown 구조화 중...</span>`,
            correcting: () => evt.total > 0 ? `
                <div class="d-flex justify-content-between align-items-center small mb-1">
                    <span class="text-info">📝 Markdown 교정 중</span>
                    <span class="text-muted fw-semibold">${evt.done} / ${evt.total} 섹션</span>
                </div>
                <div class="progress" style="height:5px;">
                    <div class="progress-bar bg-warning"
                         style="width:${pct}%; transition:width 0.3s;"></div>
                </div>` : `<span class="text-info">📝 Markdown 교정 중...</span>`,
            chunking:   () => evt.total > 0
                ? `<span class="text-info">✂️ 청크 분할 완료 <span class="fw-semibold">(${evt.total}개)</span></span>`
                : `<span class="text-info">✂️ 청크 분할 중...</span>`,
            enriching:  () => `
                <div class="d-flex justify-content-between align-items-center small mb-1">
                    <span class="text-info">🔑 키워드 추출 중</span>
                    <span class="text-muted fw-semibold">${evt.done} / ${evt.total}</span>
                </div>
                <div class="progress" style="height:5px;">
                    <div class="progress-bar bg-info"
                         style="width:${pct}%; transition:width 0.3s;"></div>
                </div>`,
            storing:    () => `<span class="text-info">💾 벡터 DB 저장 중...</span>`,
        };

        const fn = stageHtml[evt.stage];
        if (fn) el.innerHTML = fn();
    }

    /* ── Sync ────────────────────────────────────────────────────────────── */
    async function startSync() {
        const version  = (document.getElementById('version-input').value || '').trim() || 'latest';
        const btn      = document.getElementById('sync-btn');
        const spinner  = document.getElementById('sync-spinner');
        const progress = document.getElementById('sync-progress');
        const label    = document.getElementById('sync-stage-label');
        const bar      = document.getElementById('sync-progress-bar');

        btn.disabled = true;
        spinner.classList.remove('d-none');
        progress.classList.remove('d-none');
        label.textContent = '동기화 준비 중...';
        bar.style.width = '0%';

        try {
            const res = await fetch('/ui/documents/sync', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
                body: `version=${encodeURIComponent(version)}`
            });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const { taskId } = await res.json();

            await new Promise((resolve, reject) => {
                const sse = new EventSource(`/ui/documents/progress/${taskId}`);
                let retryCount = 0;
                sse.addEventListener('progress', e => {
                    retryCount = 0;
                    const evt = JSON.parse(e.data);

                    if (evt.stage === 'sync_start') {
                        if (evt.total === 0) {
                            label.textContent = '변경 파일 없음';
                            bar.style.width = '100%';
                        } else {
                            label.textContent = `파일 ${evt.total}개 인덱싱 시작...`;
                        }
                    } else if (evt.stage === 'sync_file_done') {
                        const pct = evt.total > 0 ? Math.round(evt.done / evt.total * 100) : 100;
                        bar.style.width = `${pct}%`;
                        label.textContent = `${evt.done} / ${evt.total} 완료: ${evt.filename}`;
                    } else if (evt.stage === 'sync_file_error') {
                        const pct = evt.total > 0 ? Math.round(evt.done / evt.total * 100) : 100;
                        bar.style.width = `${pct}%`;
                        label.textContent = `❌ ${evt.filename}: ${evt.message || '인덱싱 오류'}`;
                        showToast(`${escHtml(evt.filename)} 인덱싱 실패: ${escHtml(evt.message || '오류')}`, 'danger');
                    } else if (evt.stage === 'sync_done') {
                        sse.close();
                        bar.style.width = '100%';
                        const s = evt.syncSummary;
                        showToast(`동기화 완료 · 신규 ${s.indexed} · 갱신 ${s.updated} · 삭제 ${s.deleted}`, 'success');
                        htmx.ajax('GET', '/ui/documents/list', {target: '#doc-table-body', swap: 'outerHTML'});
                        resolve();
                    } else if (evt.stage === 'error') {
                        sse.close();
                        reject(new Error(evt.message || '동기화 오류'));
                    }
                });
                sse.onerror = () => {
                    retryCount++;
                    if (retryCount > 5) {
                        sse.close();
                        reject(new Error('SSE 연결 실패 (재시도 초과)'));
                    }
                };
            });
        } catch (err) {
            showToast(`동기화 실패: ${escHtml(err.message)}`, 'danger');
        } finally {
            btn.disabled = false;
            spinner.classList.add('d-none');
            progress.classList.add('d-none');
        }
    }

    /* ── Shared helpers ──────────────────────────────────────────────────── */
    function appendDocRow(doc) {
        const tbody = document.getElementById('doc-table-body');
        if (!tbody) return;
        const emptyRow = tbody.querySelector('td[colspan]')?.closest('tr');
        if (emptyRow) emptyRow.remove();

        // Be tolerant to both snake_case and camelCase JSON keys.
        const filename = doc?.filename ?? '';
        const version = doc?.version ?? 'latest';
        const tags = Array.isArray(doc?.tags) ? doc.tags : [];
        const chunks = doc?.chunks ?? 0;
        const indexedAt = doc?.indexed_at ?? doc?.indexedAt ?? '';
        const docId = doc?.doc_id ?? doc?.docId ?? '';

        // If a critical key is missing, skip optimistic row append and rely on full reload.
        if (!filename || !docId) return;

        const tagsHtml = renderTagBadges(tags);
        const deleteLabel = I18N.deleteBtnLabel || 'Delete';
        const deleteConfirm = I18N.deleteConfirmDoc || 'Delete this document?';

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><i class="bi bi-file-earmark-text me-1 text-secondary"></i><span class="doc-filename">${escHtml(filename)}</span></td>
            <td>${escHtml(version)}</td>
            <td>${tagsHtml}</td>
            <td>${chunks}</td>
            <td>${escHtml(formatIndexedAtMinute(indexedAt))}</td>
            <td><button class="btn btn-sm btn-outline-danger"
                        hx-delete="/ui/documents/${encodeURIComponent(docId)}?version=${encodeURIComponent(version)}"
                        hx-target="closest tr" hx-swap="outerHTML swap:0.3s"
                        hx-confirm="${escHtml(deleteConfirm)}">${escHtml(deleteLabel)}</button></td>`;
        tbody.appendChild(tr);
        htmx.process(tr);
    }

    function formatIndexedAtMinute(value) {
        if (!value) return '';
        const s = String(value).trim();
        if (s.length >= 16) {
            return s.slice(0, 16).replace('T', ' ');
        }
        return s.replace('T', ' ');
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTagBadges(tags) {
        if (!Array.isArray(tags) || tags.length === 0) {
            return '<span class="text-muted">-</span>';
        }
        return tags.map(t =>
            `<span class="badge text-bg-light border me-1 mb-1">${escHtml(t)}</span>`
        ).join('');
    }

    /* ── Pending task persistence (survives same-tab page navigation) ────── */
    const TASK_STORE_KEY = 'rag-active-tasks';

    function storePendingTask(taskId, filename) {
        try {
            const list = loadPendingTasks().filter(t => t.taskId !== taskId);
            list.push({ taskId, filename, ts: Date.now() });
            sessionStorage.setItem(TASK_STORE_KEY, JSON.stringify(list));
        } catch (_) {}
    }

    function dropPendingTask(taskId) {
        try {
            const list = loadPendingTasks().filter(t => t.taskId !== taskId);
            sessionStorage.setItem(TASK_STORE_KEY, JSON.stringify(list));
        } catch (_) {}
    }

    function loadPendingTasks() {
        try {
            const raw = sessionStorage.getItem(TASK_STORE_KEY);
            if (!raw) return [];
            return JSON.parse(raw).filter(t => Date.now() - t.ts < 15 * 60 * 1000);
        } catch (_) { return []; }
    }

    function restorePendingTasks() {
        const tasks = loadPendingTasks();
        if (tasks.length === 0) return;

        const panel = document.getElementById('recovery-panel');
        const tbody = document.getElementById('recovery-body');
        panel.classList.remove('d-none');

        tasks.forEach(({ taskId, filename }) => {
            const rowId    = `rec-row-${taskId}`;
            const statusId = `rec-status-${taskId}`;
            const tr = document.createElement('tr');
            tr.id = rowId;
            tr.innerHTML = `
                <td class="text-truncate" style="max-width:280px;">${escHtml(filename)}</td>
                <td id="${statusId}" style="min-width:280px;">
                    <span class="spinner-border spinner-border-sm text-info me-1"></span>
                    <span class="text-info small">진행 상태 복구 중...</span>
                </td>`;
            tbody.appendChild(tr);

            let gotEvent = false;
            let noEventTimer = null;

            const sse = subscribeIndexingProgress(
                taskId,
                evt => {
                    if (!gotEvent) { gotEvent = true; clearTimeout(noEventTimer); }
                    setIndexingStageById(statusId, evt);
                },
                docResult => {
                    clearTimeout(noEventTimer);
                    dropPendingTask(taskId);
                    const el = document.getElementById(statusId);
                    if (el) el.innerHTML = `<span class="text-success">✅ 완료 (${docResult?.chunks ?? 0} ${PAGE_I18N.chunks})</span>`;
                    showToast(`${escHtml(filename)} ${I18N.uploadSuccess} (${docResult?.chunks ?? 0} ${I18N.uploadChunks})`, 'success');
                    removeRecoveryRow(rowId, tbody, panel, true);
                },
                err => {
                    clearTimeout(noEventTimer);
                    dropPendingTask(taskId);
                    const el = document.getElementById(statusId);
                    if (el) el.innerHTML = `<span class="text-danger">❌ ${escHtml(err.message)}</span>`;
                    removeRecoveryRow(rowId, tbody, panel, false);
                }
            );

            // No events within 5 s → task completed while away and buffer expired
            noEventTimer = setTimeout(() => {
                if (gotEvent) return;
                sse.close();
                dropPendingTask(taskId);
                const el = document.getElementById(statusId);
                if (el) el.innerHTML = `<span class="text-muted">✔️ 페이지 이탈 중 처리 완료</span>`;
                removeRecoveryRow(rowId, tbody, panel, true);
            }, 5000);
        });
    }

    function removeRecoveryRow(rowId, tbody, panel, refreshList) {
        setTimeout(() => {
            const row = document.getElementById(rowId);
            if (row) row.remove();
            if (tbody.children.length === 0) panel.classList.add('d-none');
            if (refreshList) htmx.ajax('GET', '/ui/documents/list', {target: '#doc-table-body', swap: 'outerHTML'});
        }, 3000);
    }

    restorePendingTasks();

    /* ── 기존 태그 제안 칩 ─────────────────────────────────────────────── */
    const tagsInput = document.getElementById('tags-input');
    const tagSelect = document.getElementById('tag-select');
    const versionInput = document.getElementById('version-input');
    const versionOptions = document.getElementById('version-options');
    const tagSelectPlaceholder = (tagSelect?.options?.[0]?.textContent || '태그 선택...').trim();
    let knownTagOptions = [];

    function currentTags() {
        return (tagsInput.value || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    }
    function addTag(tag) {
        const t = (tag || '').trim().toLowerCase();
        if (!t) return;
        const tags = currentTags();
        if (!tags.includes(t)) tags.push(t);
        tagsInput.value = tags.join(', ');
        syncTagChipStates();
        syncTagSelectOptions();
    }
    function syncTagChipStates() {
        const sel = currentTags();
        document.querySelectorAll('#tag-suggest-chips [data-tag]').forEach(el => {
            el.classList.toggle('btn-primary', sel.includes(el.dataset.tag));
            el.classList.toggle('btn-outline-secondary', !sel.includes(el.dataset.tag));
        });
    }
    function loadVersionSuggestions() {
        const current = (versionInput.value || '').trim() || 'latest';
        fetch('/api/v1/versions')
            .then(r => r.ok ? r.json() : [])
            .then(versions => {
                const items = Array.isArray(versions) ? versions.filter(Boolean) : [];
                if (!items.includes('latest')) items.push('latest');
                if (!items.includes(current)) items.push(current);
                items.sort();
                versionOptions.innerHTML = items.map(v => `<option value="${escHtml(v)}"></option>`).join('');
                versionInput.value = current;
            })
            .catch(() => {
                versionOptions.innerHTML = `<option value="${escHtml(current)}"></option>`;
                versionInput.value = current;
            });
    }

    function loadTagSuggestions() {
        const version = (versionInput.value || '').trim();
        const url = '/api/v1/tags' + (version ? ('?version=' + encodeURIComponent(version)) : '');
        fetch(url)
            .then(r => r.ok ? r.json() : [])
            .then(tags => {
                const wrap  = document.getElementById('tag-suggest');
                const chips = document.getElementById('tag-suggest-chips');
                if (!tags || tags.length === 0) {
                    wrap.classList.add('d-none');
                    chips.innerHTML = '';
                    knownTagOptions = [];
                    syncTagSelectOptions();
                    return;
                }
                chips.innerHTML = tags.map(t =>
                    `<button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2"
                             style="font-size:0.72rem;" data-tag="${escHtml(t)}">${escHtml(t)}</button>`).join('');
                chips.querySelectorAll('[data-tag]').forEach(btn =>
                    btn.addEventListener('click', () => addTag(btn.dataset.tag)));

                knownTagOptions = tags.map(t => String(t).trim().toLowerCase()).filter(Boolean);
                syncTagSelectOptions();

                wrap.classList.remove('d-none');
                syncTagChipStates();
            })
            .catch(() => {});
    }

    function syncTagSelectOptions() {
        if (!tagSelect) return;
        const merged = Array.from(new Set([].concat(knownTagOptions, currentTags()))).sort();
        tagSelect.innerHTML = ['<option value="" selected>' + escHtml(tagSelectPlaceholder) + '</option>']
            .concat(merged.map(t => `<option value="${escHtml(t)}">${escHtml(t)}</option>`))
            .join('');
    }

    if (tagSelect) {
        tagSelect.addEventListener('change', function () {
            if (!this.value) return;
            addTag(this.value);
            this.value = '';
        });
    }
    versionInput.addEventListener('change', function () {
        const v = (this.value || '').trim() || 'latest';
        this.value = v;
        loadTagSuggestions();
    });
    tagsInput.addEventListener('input', function () {
        syncTagChipStates();
        syncTagSelectOptions();
    });
    loadVersionSuggestions();
    loadTagSuggestions();
</script>
</th:block>

</body>
</html>
