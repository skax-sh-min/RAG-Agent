<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="ko">
<head>
    <title th:text="#{nav.documents}">Documents</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container-fluid py-4" style="max-width: 1500px;">

        <!-- ── Upload card ───────────────────────────────────────────── -->
        <!-- CSS-hidden (not th:if) for non-admins: the drop-zone/file-input JS below assumes
             these elements always exist (document.getElementById(...).addEventListener(...) with
             no null guard) — removing them from the DOM would throw on page load. Visually and
             interactively this is indistinguishable from absent; the write endpoint itself is
             already server-side gated (SecurityConfig hasRole("ADMIN")) regardless. -->
        <div class="card mb-4" th:classappend="${isAdmin} ? '' : ' d-none'">
            <div class="card-header fw-semibold">
                <i class="bi bi-cloud-upload me-1"></i>
                <span th:text="#{doc.upload.title}">Document Upload</span>
            </div>
            <div class="card-body">

                <!-- Drop zone -->
                <div id="drop-zone" class="drop-zone text-center py-5 mb-3">
                    <i class="bi bi-folder2-open fs-2 text-secondary d-block mb-2"></i>
                    <span class="text-muted" th:text="#{doc.drop.hint}">Drag files here or click to select</span><br/>
                    <small class="text-muted" th:text="#{doc.drop.formats}">Supported: PDF, PPTX, DOCX, TXT, MD · Max 200 MB</small>
                    <input id="file-input" type="file"
                           accept=".pdf,.pptx,.docx,.txt,.md"
                           multiple class="d-none"/>
                </div>

                <!-- Selected file list (populated by JS) -->
                <div id="file-list" class="d-none mb-3">
                    <table class="table table-sm mb-2">
                        <thead><tr>
                            <th th:text="#{doc.col.name}">Filename</th>
                            <th th:text="#{doc.col.size}">Size</th>
                            <th th:text="#{doc.col.status}">Status</th>
                            <th></th>
                        </tr></thead>
                        <tbody id="file-list-body"></tbody>
                    </table>
                    <!-- Overall progress -->
                    <div id="overall-progress" class="d-none">
                        <div class="d-flex justify-content-between small text-muted mb-1">
                            <span id="overall-label"></span>
                        </div>
                        <div class="progress" style="height: 6px;">
                            <div id="overall-bar" class="progress-bar" style="width: 0%;"></div>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <div class="input-group input-group-sm" style="width: 180px;">
                        <span class="input-group-text" th:text="#{doc.version.label}">Version</span>
                        <input id="version-input" name="version" type="text"
                               class="form-control"
                               style="min-width: 100px;" value="latest"
                               list="version-options"
                               th:placeholder="#{doc.version.label}"/>
                    </div>
                    <datalist id="version-options"></datalist>

                    <div class="input-group input-group-sm" style="min-width: 200px; max-width: 400px;">
                        <span class="input-group-text"><i class="bi bi-tags"></i></span>
                        <input id="tags-input" name="tags" type="text"
                               class="form-control"
                               th:placeholder="#{doc.tags.placeholder}"
                               th:title="#{doc.tags.tooltip}" autocomplete="off"/>
                    </div>
                    <div class="form-check form-check-inline mb-0">
                           <input class="form-check-input" type="checkbox" id="add-image-desc-checkbox"
                               th:disabled="${!imageDescriptionAvailable}"/>
                        <label class="form-check-label small" for="add-image-desc-checkbox"
                               th:text="#{doc.upload.image_desc.option}"
                               th:title="#{doc.upload.image_desc.tooltip}">이미지 설명 추가</label>
                    </div>
                    <div class="form-check form-check-inline mb-0">
                        <input class="form-check-input" type="checkbox" id="add-heading-numbers-checkbox" checked/>
                        <label class="form-check-label small" for="add-heading-numbers-checkbox"
                               th:text="#{doc.upload.heading_number.option}"
                               th:title="#{doc.upload.heading_number.tooltip}">소제목 숫자 생성</label>
                    </div>
                    <button id="upload-btn" class="btn btn-sm btn-primary" disabled>
                        <i class="bi bi-upload me-1"></i>
                        <span th:text="#{doc.btn.upload}">Upload &amp; Index</span>
                    </button>
                </div>
                <!-- 기존 태그 칩 (클릭하면 위 입력칸에 추가) -->
                <div id="tag-suggest" class="d-none mt-2">
                    <span class="small text-muted me-1" th:text="#{tags.existing}">Existing tags</span>
                    <span id="tag-suggest-chips" class="d-inline-flex flex-wrap gap-1 align-middle"></span>
                </div>
            </div>
        </div>

        <!-- ── Active task recovery panel (shown when returning mid-index) ── -->
        <div id="recovery-panel" class="card border-info mb-4 d-none">
            <div class="card-header text-info fw-semibold d-flex align-items-center gap-2">
                <span class="spinner-border spinner-border-sm flex-shrink-0" role="status"></span>
                진행 중인 인덱싱 작업
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-sm mb-0">
                        <thead class="table-light">
                            <tr>
                                <th th:text="#{doc.col.name}">Filename</th>
                                <th th:text="#{doc.col.status}">Status</th>
                            </tr>
                        </thead>
                        <tbody id="recovery-body"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- ── Document list ─────────────────────────────────────────── -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span class="fw-semibold">
                    <i class="bi bi-file-earmark-text me-1"></i>
                    <span th:text="#{doc.list.title}">Indexed Documents</span>
                </span>
                <button class="btn btn-sm btn-outline-secondary"
                        hx-get="/ui/documents/list"
                        hx-target="#doc-table-body"
                        hx-swap="outerHTML">
                    <span class="htmx-indicator spinner-border spinner-border-sm me-1" role="status"></span>
                    <i class="bi bi-arrow-clockwise me-1"></i>
                    <span th:text="#{doc.btn.refresh}">Refresh</span>
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover mb-0">
                        <thead class="table-light">
                        <tr>
                            <th th:text="#{doc.col.name}">Filename</th>
                            <th th:text="#{doc.col.version}">Version</th>
                            <th th:text="#{doc.col.tags}">Tags</th>
                            <th th:text="#{doc.col.chunks}">Chunks</th>
                            <th th:text="#{doc.col.indexed_at}">Indexed At</th>
                            <th></th>
                        </tr>
                        </thead>
                        <th:block th:replace="~{fragments/doc-table-body :: body}"></th:block>
                    </table>
                </div>
            </div>
        </div>

    </div>

<!-- ── 문서 내보내기 다이얼로그 (§ 문서 내보내기) ─────────────────────────────
     layout:fragment="content" 안에 있어야 한다 — Layout Dialect는 fragment 바깥의
     마크업을 렌더링에서 통째로 버리므로, 밖에 두면 모달이 DOM에 아예 나타나지 않는다. -->
<div class="modal fade" id="exportModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title mb-0">
          <i class="bi bi-download me-1"></i>
          <span th:text="#{doc.export.title}">Export document</span>
        </h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"
                th:attr="aria-label=#{doc.btn.cancel}"></button>
      </div>
      <div class="modal-body">
        <div class="small text-muted mb-2" id="export-filename"></div>

        <label class="form-label small fw-semibold mb-1" th:text="#{doc.export.format}">Format</label>
        <div class="btn-group w-100 mb-3" role="group">
          <input type="radio" class="btn-check" name="export-format" id="export-format-md" value="md" checked/>
          <label class="btn btn-sm btn-outline-primary" for="export-format-md"
                 th:text="#{doc.export.format.md}">MD</label>
          <input type="radio" class="btn-check" name="export-format" id="export-format-txt" value="txt"/>
          <label class="btn btn-sm btn-outline-primary" for="export-format-txt"
                 th:text="#{doc.export.format.txt}">TXT</label>
          <input type="radio" class="btn-check" name="export-format" id="export-format-docx" value="docx"/>
          <label class="btn btn-sm btn-outline-primary" for="export-format-docx"
                 th:text="#{doc.export.format.docx}">DOCX</label>
        </div>

        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="export-image-desc" checked/>
          <label class="form-check-label small" for="export-image-desc"
                 th:text="#{doc.export.opt.image_desc}">Include image descriptions</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="export-toc"/>
          <label class="form-check-label small" for="export-toc"
                 th:text="#{doc.export.opt.toc}">Add heading numbers &amp; TOC</label>
          <div id="export-toc-hint" class="form-text d-none"
               th:text="#{doc.export.opt.toc_pptx_hint}">Not applied to PPTX.</div>
        </div>

        <div class="alert alert-light border small mt-3 mb-0 py-2"
             th:text="#{doc.export.hint}">Rebuilt from indexed chunks.</div>
      </div>
      <div class="modal-footer py-2">
        <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal"
                th:text="#{doc.btn.cancel}">Cancel</button>
        <button type="button" class="btn btn-sm btn-primary" id="export-submit"
                onclick="runExport()" th:text="#{doc.export.submit}">Export</button>
      </div>
    </div>
  </div>
</div>
</div>

<th:block layout:fragment="scripts">
<script th:inline="javascript">
    /* Page-level i18n (complements global I18N from base.html) */
    const PAGE_I18N = {
        statusDone:   /*[[#{status.done}]]*/ 'Done',
        chunks:       /*[[#{toast.upload.chunks}]]*/ 'chunks',
        exportPreparing: /*[[#{doc.export.preparing}]]*/ 'Exporting...',
        exportSubmit:    /*[[#{doc.export.submit}]]*/ 'Export',
        exportFailed:    /*[[#{doc.export.failed}]]*/ 'Export failed.'
    };
</script>
<script>
    /* ── Drop zone ───────────────────────────────────────────────────────── */
    const dropZone  = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    let selectedFiles = [];

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        handleFiles(Array.from(e.dataTransfer.files));
    });
    fileInput.addEventListener('change', () => handleFiles(Array.from(fileInput.files)));

    function handleFiles(files) {
        const limit = 200 * 1024 * 1024;
        files.filter(f => f.size > limit).forEach(f =>
            showToast(`${escHtml(f.name)}: ${I18N.fileTooBig}`, 'warning'));
        selectedFiles = files.filter(f => f.size <= limit);
        if (selectedFiles.length === 0) return;

        const existing = existingFilenames();
        selectedFiles.forEach(f => {
            const dup = checkDuplicate(f.name, existing);
            if (dup) showToast(escHtml(dup.message), 'warning');
        });

        renderFileList();
        syncHeadingNumbersCheckbox();
        warnIfPptxMixed();
        document.getElementById('upload-btn').disabled = false;
    }

    function extOf(filename) {
        return (filename.split('.').pop() || '').toLowerCase();
    }

    function isPptx(file) {
        return extOf(file.name) === 'pptx';
    }

    /**
     * 선택된 파일 구성에 맞춰 '소제목 숫자 생성' 체크박스를 자동으로 맞춘다 — PPTX가 하나라도
     * 섞여 있으면 해제, 그 외(DOCX/TXT/MD/PDF)만 있으면 체크(기본값).
     *
     * PPTX만 대상인 이유: DocumentIndexer의 .pptx 분기가 체크 여부와 무관하게 항상
     * addHeadingNumbers=false를 넘긴다(슬라이드 제목/부제목 헤딩은 문서 목차 같은 계층 구조가
     * 아니라서). 즉 PPTX에서는 체크해도 아무 효과가 없으므로 체크된 UI가 오히려 오해를 준다.
     * PDF는 반대로 체크 값이 그대로 전달되고, PdfToMarkdownConverter가 H2~H6를 아예 만들지
     * 않으므로 켜두어도 사실상 무해하다(LLM 교정이 헤딩을 만들어낸 경우에만 번호가 붙는다).
     *
     * 어디까지나 기본값 제안일 뿐이라 사용자가 업로드 직전에 직접 바꾸는 것은 그대로 가능하다
     * (선택이 다시 바뀌면 재계산됨).
     */
    function syncHeadingNumbersCheckbox() {
        const box = document.getElementById('add-heading-numbers-checkbox');
        if (!box) return;
        box.checked = !selectedFiles.some(isPptx);
    }

    /**
     * 업로드는 배치 전체에 addHeadingNumbers 값 하나만 전송하므로, PPTX와 다른 형식을 함께
     * 고르면 둘 중 하나는 원하는 설정으로 처리할 수 없다(PPTX에 맞춰 해제하면 DOCX/TXT/MD가
     * 소제목 번호를 잃는다). 나누어 올리도록 경고만 띄우고 업로드 자체는 막지 않는다.
     */
    function warnIfPptxMixed() {
        const pptxCount = selectedFiles.filter(isPptx).length;
        if (pptxCount > 0 && pptxCount < selectedFiles.length) {
            showToast(I18N.pptxMixedUpload, 'warning');
        }
    }

    /** Filenames of documents already indexed — scraped from the live doc table, no extra round trip. */
    function existingFilenames() {
        return new Set(Array.from(document.querySelectorAll('#doc-table-body .doc-filename'))
            .map(el => el.textContent.trim())
            .filter(Boolean));
    }

    /** Filename without its extension, NFC-normalized (matches server-side stem splitting). */
    function stemOf(filename) {
        const name = filename.normalize('NFC');
        const dot = name.lastIndexOf('.');
        return dot > 0 ? name.substring(0, dot) : name;
    }

    /**
     * If `filename` collides with an already-indexed document, predicts the "_vN" name the
     * server will actually store it under (mirrors DocumentController#versionedPath). Returns
     * null when there's no collision. Best-effort: only sees registered docs, not stray files
     * dropped into data/documents/ that were never synced.
     */
    function predictDuplicateName(filename, existing) {
        const name = filename.normalize('NFC');
        if (!existing.has(name)) return null;
        const dot = name.lastIndexOf('.');
        const stem = dot > 0 ? name.substring(0, dot) : name;
        const ext  = dot > 0 ? name.substring(dot)    : '';
        for (let v = 2; v <= 99; v++) {
            const candidate = `${stem}_v${v}${ext}`;
            if (!existing.has(candidate)) return candidate;
        }
        return `${stem}_v${Date.now()}${ext}`;
    }

    /**
     * Checks `filename` against already-indexed documents in two tiers:
     *  1. Exact name+extension match → server will rename it (versionedPath), warn with the
     *     predicted "_vN" name.
     *  2. Same stem, different extension → server does NOT rename (different filename, so no
     *     collision on disk); just flag that a same-titled document already exists so the user
     *     can decide whether to delete the old one first.
     * Returns null when there's no match either way.
     */
    function checkDuplicate(filename, existing) {
        const nextName = predictDuplicateName(filename, existing);
        if (nextName) return { message: duplicateMessage(nextName) };

        const stem = stemOf(filename);
        const similar = Array.from(existing).find(name => stemOf(name) === stem);
        if (similar) return { message: similarMessage(similar) };

        return null;
    }

    function duplicateMessage(nextName) {
        return I18N.duplicateFileName.replace('{name}', nextName);
    }

    function similarMessage(existingName) {
        return I18N.similarFileName.replace('{name}', existingName);
    }

    function renderFileList() {
        const existing = existingFilenames();
        const tbody = document.getElementById('file-list-body');
        tbody.innerHTML = selectedFiles.map((f, i) => {
            const dup = checkDuplicate(f.name, existing);
            const status = dup
                ? `<span class="text-warning"><i class="bi bi-exclamation-triangle-fill"></i> ${escHtml(dup.message)}</span>`
                : `<span class="text-muted">⏳ ${I18N.statusWaiting}</span>`;
            return `
            <tr id="file-row-${i}">
                <td class="text-truncate" style="max-width:260px;">${escHtml(f.name)}</td>
                <td>${(f.size / 1024 / 1024).toFixed(1)} MB</td>
                <td id="file-status-${i}" style="min-width:260px;">${status}</td>
                <td><button class="btn btn-sm btn-link text-danger p-0"
                            onclick="removeFile(${i})">✕</button></td>
            </tr>`;
        }).join('');
        document.getElementById('file-list').classList.remove('d-none');
    }

    function removeFile(i) {
        selectedFiles.splice(i, 1);
        if (selectedFiles.length === 0) {
            document.getElementById('file-list').classList.add('d-none');
            document.getElementById('upload-btn').disabled = true;
        } else {
            renderFileList();
        }
        // 남은 파일 구성이 바뀌었으므로 재계산 — 마지막 PPTX를 지우면 다시 체크되고,
        // 혼합 상태가 해소되면 경고도 더 이상 뜨지 않는다.
        syncHeadingNumbersCheckbox();
        warnIfPptxMixed();
    }

    document.getElementById('upload-btn').addEventListener('click', () => {
        const version = (document.getElementById('version-input').value || '').trim() || 'latest';
        const tags = (document.getElementById('tags-input').value || '').trim();
        const addImageDescriptions = document.getElementById('add-image-desc-checkbox').checked;
        const addHeadingNumbers = document.getElementById('add-heading-numbers-checkbox').checked;
        uploadFiles([...selectedFiles], version, tags, addImageDescriptions, addHeadingNumbers);
    });

    /* ── 문서 내보내기 (§ 문서 내보내기) ──────────────────────────────────────
     * 행의 '내보내기' 버튼 → 형식/옵션 선택 모달 → GET /ui/documents/{id}/export.
     * 응답을 Blob으로 받아 다운로드하는 이유는 실패 시 서버의 오류 메시지를 토스트로
     * 보여주기 위함이다(단순 location 이동은 오류 페이지로 넘어가 버린다).
     */
    let exportTarget = null;

    function openExportDialog(btn) {
        exportTarget = {
            docId:    btn.dataset.docId,
            version:  btn.dataset.version,
            filename: btn.dataset.filename || ''
        };
        document.getElementById('export-filename').textContent = exportTarget.filename;

        // PPTX는 슬라이드 제목이 목차 구조가 아니라 서버에서 번호/목차를 적용하지 않는다
        // (DocumentIndexer의 .pptx 분기와 동일한 규칙) → 체크박스를 비활성화하고 이유를 보여준다.
        const isPptx = exportTarget.filename.toLowerCase().endsWith('.pptx');
        const toc = document.getElementById('export-toc');
        toc.disabled = isPptx;
        if (isPptx) toc.checked = false;
        document.getElementById('export-toc-hint').classList.toggle('d-none', !isPptx);

        bootstrap.Modal.getOrCreateInstance(document.getElementById('exportModal')).show();
    }

    async function runExport() {
        if (!exportTarget) return;
        const btn = document.getElementById('export-submit');
        const format = document.querySelector('input[name="export-format"]:checked').value;
        const params = new URLSearchParams({
            version: exportTarget.version,
            format,
            includeImageDescriptions: document.getElementById('export-image-desc').checked,
            addHeadingNumbersAndToc:  document.getElementById('export-toc').checked
        });

        btn.disabled = true;
        btn.textContent = PAGE_I18N.exportPreparing;
        try {
            const res = await fetch(`/ui/documents/${encodeURIComponent(exportTarget.docId)}/export?${params}`);
            if (!res.ok) throw new Error(await extractError(res));

            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href = url;
            a.download = filenameFromDisposition(res.headers.get('Content-Disposition'))
                         || `${exportTarget.docId}.${format}`;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
            bootstrap.Modal.getOrCreateInstance(document.getElementById('exportModal')).hide();
        } catch (e) {
            showToast(`${PAGE_I18N.exportFailed} ${escHtml(e.message || '')}`, 'danger');
        } finally {
            btn.disabled = false;
            btn.textContent = PAGE_I18N.exportSubmit;
        }
    }

    /** RFC 5987 filename*=UTF-8''... 우선, 없으면 filename="..." 폴백. */
    function filenameFromDisposition(header) {
        if (!header) return null;
        const star = header.match(/filename\*=UTF-8''([^;]+)/i);
        if (star) { try { return decodeURIComponent(star[1]); } catch (_) { /* fall through */ } }
        const plain = header.match(/filename="?([^";]+)"?/i);
        return plain ? plain[1] : null;
    }

    /** ProblemDetail(JSON)의 detail 필드를 우선 사용하고, 아니면 상태 코드를 보여준다. */
    async function extractError(res) {
        try {
            const body = await res.json();
            return body.detail || body.title || `HTTP ${res.status}`;
        } catch (_) {
            return `HTTP ${res.status}`;
        }
    }

    /* ── Upload orchestration ────────────────────────────────────────────── */
    async function uploadFiles(files, version, tags, addImageDescriptions, addHeadingNumbers) {
        const btn = document.getElementById('upload-btn');
        btn.disabled = true;

        const overallEl    = document.getElementById('overall-progress');
        const overallLabel = document.getElementById('overall-label');
        const overallBar   = document.getElementById('overall-bar');
        overallEl.classList.remove('d-none');

        let doneCount = 0;
        const total = files.length;

        for (let i = 0; i < total; i++) {
            setFileStatus(i, 'uploading');
            try {
                const result = await uploadWithProgress(files[i], version, tags,
                    addImageDescriptions, addHeadingNumbers,
                    pct => {                                    // XHR upload progress
                        setUploadBar(i, pct);
                        if (pct === 100) setFileStatus(i, 'queued');
                    },
                    evt => setIndexingStage(i, evt),           // SSE indexing progress
                    cancelFn => setFileActionButton(i, cancelFn) // §6.16.1 — wire row's ✕ into cancel
                );
                setFileActionButton(i, null);
                setFileStatus(i, 'done', result.chunks);
                appendDocRow(result);
                showToast(`${escHtml(result.filename)} ${I18N.uploadSuccess} (${result.chunks} ${I18N.uploadChunks})`, 'success');
            } catch (err) {
                setFileActionButton(i, null);
                if (err.cancelled) {
                    setFileStatus(i, 'cancelled');
                    showToast(`${escHtml(files[i].name)} ${I18N.cancelled}`, 'warning');
                } else if (err.unknown) {
                    // Not a failure — the server just no longer has a record of this task's
                    // outcome (e.g. reconnect landed after a very long disconnect). Refresh the
                    // doc list afterward so a genuinely-completed file still shows up correctly.
                    setFileStatus(i, 'unknown');
                    showToast(`${escHtml(files[i].name)}: ${err.message}`, 'warning');
                } else {
                    setFileError(i, err.message);
                    showToast(`${escHtml(files[i].name)} ${I18N.uploadError}: ${err.message}`, 'danger');
                }
            }
            doneCount++;
            overallLabel.textContent = `${doneCount} / ${total}`;
            overallBar.style.width = `${(doneCount / total) * 100}%`;
        }

        htmx.ajax('GET', '/ui/documents/list', {target: '#doc-table-body', swap: 'outerHTML'});
        loadTagSuggestions();   // 새 태그가 추가됐을 수 있으니 제안 목록 갱신
    }

    /** §6.16.1 — POSTs the cancel signal for an in-progress upload task. Best-effort. */
    function cancelIndexingTask(taskId) {
        fetch(`/ui/documents/progress/${taskId}/cancel`, {
            method: 'POST',
            headers: getCsrfHeaders()
        }).catch(() => {});
    }

    /**
     * §6.16.1 — repurposes a file row's action cell (4th <td>) as a cancel button while that
     * row is uploading/indexing. Passing null restores it to empty (terminal state — the row
     * has nothing left to cancel).
     */
    function setFileActionButton(i, onCancel) {
        const row = document.getElementById(`file-row-${i}`);
        if (!row) return;
        const cell = row.children[3];
        if (!cell) return;
        if (!onCancel) {
            cell.innerHTML = '';
            return;
        }
        cell.innerHTML = `<button type="button" class="btn btn-sm btn-link text-danger p-0">${escHtml(I18N.cancelBtnLabel)}</button>`;
        cell.querySelector('button').addEventListener('click', onCancel, {once: true});
    }

    /**
     * Phase 1 — XHR: POST file → receive {taskId} (HTTP 202).
     * Phase 2 — SSE: subscribe to /ui/documents/progress/{taskId} for chunk-level events.
     * Resolves with DocumentInfo on 'done', rejects on 'error'/'cancelled' (rejection carries
     * `.cancelled = true` for the latter so the caller can render it as a neutral outcome).
     * onCancelReady(fn) hands the caller a cancel closure as soon as one is available — it
     * aborts the XHR before a taskId exists, or calls the server cancel endpoint after.
     */
    function uploadWithProgress(file, version, tags, addImageDescriptions, addHeadingNumbers, onUploadPct, onStage, onCancelReady) {
        return new Promise((resolve, reject) => {
            const xhr  = new XMLHttpRequest();
            const form = new FormData();
            form.append('file', file);
            form.append('version', version);
            if (tags) form.append('tags', tags);   // 검색 스코프 태그
            form.append('addImageDescriptions', addImageDescriptions ? 'true' : 'false');
            form.append('addHeadingNumbers', addHeadingNumbers ? 'true' : 'false');

            let sse = null;
            let currentTaskId = null;

            if (onCancelReady) {
                onCancelReady(() => {
                    if (currentTaskId) {
                        cancelIndexingTask(currentTaskId);
                        if (sse) sse.close();
                    } else {
                        xhr.abort();
                    }
                });
            }

            xhr.upload.addEventListener('progress', e => {
                if (e.lengthComputable) onUploadPct(Math.round(e.loaded / e.total * 100));
            });
            xhr.upload.addEventListener('load', () => onUploadPct(100));

            xhr.addEventListener('load', () => {
                if (xhr.status === 202) {
                    const { taskId } = JSON.parse(xhr.responseText);
                    currentTaskId = taskId;
                    storePendingTask(taskId, file.name);
                    sse = subscribeIndexingProgress(taskId, onStage, resolve, reject);
                } else if (xhr.status === 503) {
                    reject(new Error(I18N.chromaUnavailable));
                } else {
                    reject(new Error(xhr.status === 400 ? I18N.fileEmpty
                            : `${I18N.serverError} (${xhr.status})`));
                }
            });
            xhr.addEventListener('error', () => reject(new Error(I18N.networkError)));
            xhr.addEventListener('abort', () => {
                const err = new Error(I18N.cancelled);
                err.cancelled = true;
                reject(err);
            });

            xhr.open('POST', '/ui/documents/upload');
            // §6.17 — the only mutating call in this file that didn't already go through
            // getCsrfHeaders() (cancelIndexingTask() below already does). No-op when CSRF is
            // inactive (plain no-auth mode), since getCsrfHeaders() returns {} there.
            Object.entries(getCsrfHeaders()).forEach(([name, value]) => xhr.setRequestHeader(name, value));
            xhr.send(form);
        });
    }

    function subscribeIndexingProgress(taskId, onStage, resolve, reject) {
        let sse = new EventSource(`/ui/documents/progress/${taskId}`);
        let retryCount = 0;
        let settled = false;

        function handleTerminal(evt) {
            if (evt.stage === 'done') {
                dropPendingTask(taskId);
                resolve(evt.docResult);
            } else if (evt.stage === 'error') {
                dropPendingTask(taskId);
                reject(new Error(evt.message || '인덱싱 오류'));
            } else if (evt.stage === 'cancelled') {
                dropPendingTask(taskId);
                const err = new Error(evt.message || I18N.cancelled);
                err.cancelled = true;
                reject(err);
            } else if (evt.stage === 'unknown') {
                // Server no longer has any record of this task (outcome aged out after a long
                // disconnect, e.g. laptop sleep). Stop waiting instead of sitting on a connection
                // that will only ever receive heartbeat pings — surface it distinctly so the
                // caller doesn't report it as a hard failure.
                dropPendingTask(taskId);
                const err = new Error(evt.message || '작업 상태를 확인할 수 없습니다');
                err.unknown = true;
                reject(err);
            } else {
                return false; // not terminal
            }
            return true;
        }

        function settle(evt) {
            if (settled || !handleTerminal(evt)) return;
            settled = true;
            sse.close();
            document.removeEventListener('visibilitychange', onVisible);
        }

        function attach(emitter) {
            emitter.addEventListener('progress', e => {
                retryCount = 0;
                const evt = JSON.parse(e.data);
                onStage(evt);
                settle(evt);
            });
            emitter.onerror = () => {
                retryCount++;
                if (retryCount > 5 && !settled) {
                    settled = true;
                    emitter.close();
                    document.removeEventListener('visibilitychange', onVisible);
                    reject(new Error('SSE 연결 실패 (재시도 초과)'));
                }
            };
        }
        attach(sse);

        // A backgrounded tab can end up with a connection that's silently dead — browser network
        // throttling, a reverse proxy or NAT/firewall idle-connection cleanup, none of which fire
        // EventSource's onerror since as far as the browser knows the socket is still "open". This
        // is exactly what leaves a multi-hour indexing job looking stuck after switching tabs and
        // back. Rather than trust that connection, actively re-verify via the one-shot status
        // endpoint the moment the tab becomes visible again.
        function onVisible() {
            if (settled || document.visibilityState !== 'visible') return;
            fetch(`/ui/documents/progress/${taskId}/status`)
                .then(r => r.json())
                .then(evt => {
                    if (settled) return;
                    if (evt.stage === 'running') {
                        // Still going server-side — replace the connection outright in case the old
                        // one is a corpse that just hasn't errored yet; subscribe() replays history.
                        sse.close();
                        retryCount = 0; // fresh connection deserves its own retry budget
                        sse = new EventSource(`/ui/documents/progress/${taskId}`);
                        attach(sse);
                    } else {
                        settle(evt);
                    }
                })
                .catch(() => {}); // best-effort; the existing onerror/retry path still applies
        }
        document.addEventListener('visibilitychange', onVisible);

        return { close: () => sse.close() };
    }

    /* ── File row status helpers ─────────────────────────────────────────── */
    function setFileStatus(i, status, extra) {
        const el = document.getElementById(`file-status-${i}`);
        if (!el) return;
        const map = {
            uploading: `<span class="text-primary">🔄 ${I18N.statusUploading}</span>
                        <div id="upload-bar-${i}" class="progress mt-1" style="height:4px;">
                            <div class="progress-bar" style="width:0%;transition:width 0.2s;"></div>
                        </div>`,
            queued:    `<span class="text-info">⏳ 인덱싱 대기 중...</span>`,
            done:      `<span class="text-success">✅ ${PAGE_I18N.statusDone} (${extra} ${PAGE_I18N.chunks})</span>`,
            cancelled: `<span class="text-muted">⏹ ${I18N.cancelled}</span>`,
            unknown:   `<span class="text-warning">⚠️ 상태 확인 불가 — 문서 목록에서 확인해 주세요</span>`,
        };
        if (map[status]) el.innerHTML = map[status];
    }

    function setUploadBar(i, pct) {
        const bar = document.querySelector(`#upload-bar-${i} .progress-bar`);
        if (bar) bar.style.width = pct + '%';
    }

    /* ── Per-file indexing event log — in-memory only, so it naturally disappears on page
     * navigation. Lets a failed upload show which stage broke, not just the final message. ── */
    const STAGE_LABELS = {
        loading: '문서 로드', structuring: 'Markdown 구조화', describing_images: '이미지 분석',
        correcting: 'Markdown 교정', chunking: '청크 분할', enriching: '키워드 추출', storing: '벡터 DB 저장'
    };
    const fileEventLogs = {};   // i -> [{stage, message, done, total, time}]

    function setIndexingStage(i, evt) {
        (fileEventLogs[i] = fileEventLogs[i] || []).push({
            stage: evt.stage, message: evt.message, done: evt.done, total: evt.total,
            time: nowHms()
        });
        setIndexingStageById(`file-status-${i}`, evt);
    }

    function nowHms() {
        const d = new Date();
        const pad = n => String(n).padStart(2, '0');
        return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    }

    /** Shows which stage failed (if known) + a collapsible trail of this file's progress
     * events. The trail is in-memory only — it is not persisted and disappears on navigation. */
    function setFileError(i, message) {
        const el = document.getElementById(`file-status-${i}`);
        if (!el) return;
        const log = fileEventLogs[i] || [];
        const lastWorkStage = [...log].reverse().find(e => STAGE_LABELS[e.stage]);
        const stageLabel = lastWorkStage ? STAGE_LABELS[lastWorkStage.stage] : null;
        const headline = stageLabel
            ? `❌ <strong>${escHtml(stageLabel)}</strong> 단계 오류: ${escHtml(message)}`
            : `❌ ${escHtml(message)}`;

        const logId = `file-log-${i}`;
        const trail = log.length > 0
            ? log.map(e => {
                const label = STAGE_LABELS[e.stage] || e.stage;
                const detail = e.total > 0 ? ` (${e.done}/${e.total})` : '';
                const msg = e.message ? ` — ${escHtml(e.message)}` : '';
                return `<div>[${e.time}] ${escHtml(label)}${detail}${msg}</div>`;
            }).join('')
            : '<div class="text-muted">기록된 진행 로그 없음</div>';

        el.innerHTML = `
            <span class="text-danger">${headline}</span>
            <button type="button" class="btn btn-sm btn-link p-0 ms-1 small"
                    data-bs-toggle="collapse" data-bs-target="#${logId}">로그 보기</button>
            <div id="${logId}" class="collapse small mt-1 p-2 bg-body-secondary border rounded"
                 style="max-height:150px; overflow-y:auto; font-family:monospace;">${trail}</div>`;
    }

    function setIndexingStageById(elId, evt) {
        const el = document.getElementById(elId);
        if (!el) return;

        const pct = evt.total > 0 ? Math.round(evt.done / evt.total * 100) : 0;

        const stageHtml = {
            loading:    () => evt.total > 0 ? `
                <div class="d-flex justify-content-between align-items-center small mb-1">
                    <span class="text-info">📄 ${escHtml(evt.message || '문서 로드 중...')}</span>
                    <span class="text-muted fw-semibold">${pct}% (${evt.done} / ${evt.total})</span>
                </div>
                <div class="progress" style="height:5px;">
                    <div class="progress-bar bg-secondary"
                         style="width:${pct}%; transition:width 0.3s;"></div>
                </div>` : `<span class="text-info">📄 ${escHtml(evt.message || '문서 로드 중...')}</span>`,
            structuring: () => evt.total > 0 ? `
                <div class="d-flex justify-content-between align-items-center small mb-1">
                    <span class="text-info">🧱 Markdown 구조화 중</span>
                    <span class="text-muted fw-semibold">${pct}% (${evt.done} / ${evt.total} 블록)</span>
                </div>
                <div class="progress" style="height:5px;">
                    <div class="progress-bar bg-warning"
                         style="width:${pct}%; transition:width 0.3s;"></div>
                </div>` : `<span class="text-info">🧱 Markdown 구조화 중...</span>`,
            describing_images: () => evt.total > 0 ? `
                <div class="d-flex justify-content-between align-items-center small mb-1">
                    <span class="text-info">🖼️ 이미지 분석 중</span>
                    <span class="text-muted fw-semibold">${pct}% (${evt.done} / ${evt.total})</span>
                </div>
                <div class="progress" style="height:5px;">
                    <div class="progress-bar bg-warning"
                         style="width:${pct}%; transition:width 0.3s;"></div>
                </div>` : `<span class="text-info">🖼️ 이미지 분석 중...</span>`,
            correcting: () => evt.total > 0 ? `
                <div class="d-flex justify-content-between align-items-center small mb-1">
                    <span class="text-info">📝 Markdown 교정 중</span>
                    <span class="text-muted fw-semibold">${pct}% (${evt.done} / ${evt.total} 섹션)</span>
                </div>
                <div class="progress" style="height:5px;">
                    <div class="progress-bar bg-warning"
                         style="width:${pct}%; transition:width 0.3s;"></div>
                </div>` : `<span class="text-info">📝 Markdown 교정 중...</span>`,
            chunking:   () => evt.total > 0
                ? `<span class="text-info">✂️ 청크 분할 완료 <span class="fw-semibold">(${evt.total}개)</span></span>`
                : `<span class="text-info">✂️ 청크 분할 중...</span>`,
            enriching:  () => `
                <div class="d-flex justify-content-between align-items-center small mb-1">
                    <span class="text-info">🔑 키워드 추출 중</span>
                    <span class="text-muted fw-semibold">${pct}% (${evt.done} / ${evt.total})</span>
                </div>
                <div class="progress" style="height:5px;">
                    <div class="progress-bar bg-info"
                         style="width:${pct}%; transition:width 0.3s;"></div>
                </div>`,
            storing:    () => evt.total > 0 ? `
                <div class="d-flex justify-content-between align-items-center small mb-1">
                    <span class="text-info">💾 벡터 DB 저장 중</span>
                    <span class="text-muted fw-semibold">${pct}% (${evt.done} / ${evt.total})</span>
                </div>
                <div class="progress" style="height:5px;">
                    <div class="progress-bar bg-info"
                         style="width:${pct}%; transition:width 0.3s;"></div>
                </div>` : `<span class="text-info">💾 벡터 DB 저장 중...</span>`,
        };

        const fn = stageHtml[evt.stage];
        if (fn) el.innerHTML = fn();
    }

    /* ── Shared helpers ──────────────────────────────────────────────────── */
    function appendDocRow(doc) {
        const tbody = document.getElementById('doc-table-body');
        if (!tbody) return;
        const emptyRow = tbody.querySelector('td[colspan]')?.closest('tr');
        if (emptyRow) emptyRow.remove();

        // Be tolerant to both snake_case and camelCase JSON keys.
        const filename = doc?.filename ?? '';
        const version = doc?.version ?? 'latest';
        const tags = Array.isArray(doc?.tags) ? doc.tags : [];
        const chunks = doc?.chunks ?? 0;
        const indexedAt = doc?.indexed_at ?? doc?.indexedAt ?? '';
        const docId = doc?.doc_id ?? doc?.docId ?? '';

        // If a critical key is missing, skip optimistic row append and rely on full reload.
        if (!filename || !docId) return;

        const tagsHtml = renderTagBadges(tags);
        const deleteLabel = I18N.deleteBtnLabel || 'Delete';
        const deleteConfirm = I18N.deleteConfirmDoc || 'Delete this document?';

        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td><i class="bi bi-file-earmark-text me-1 text-secondary"></i><span class="doc-filename">${escHtml(filename)}</span></td>
            <td>${escHtml(version)}</td>
            <td>${tagsHtml}</td>
            <td>${chunks}</td>
            <td>${escHtml(formatIndexedAtMinute(indexedAt))}</td>
            <td><button class="btn btn-sm btn-outline-danger"
                        hx-delete="/ui/documents/${encodeURIComponent(docId)}?version=${encodeURIComponent(version)}"
                        hx-target="closest tr" hx-swap="outerHTML swap:0.3s"
                        hx-confirm="${escHtml(deleteConfirm)}">${escHtml(deleteLabel)}</button></td>`;
        tbody.appendChild(tr);
        htmx.process(tr);
    }

    function formatIndexedAtMinute(value) {
        if (!value) return '';
        const s = String(value).trim();
        if (s.length >= 16) {
            return s.slice(0, 16).replace('T', ' ');
        }
        return s.replace('T', ' ');
    }

    function escHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function renderTagBadges(tags) {
        if (!Array.isArray(tags) || tags.length === 0) {
            return '<span class="text-muted">-</span>';
        }
        return tags.map(t =>
            `<span class="badge text-bg-light border me-1 mb-1">${escHtml(t)}</span>`
        ).join('');
    }

    /* ── Pending task persistence (survives same-tab page navigation) ────── */
    const TASK_STORE_KEY = 'rag-active-tasks';

    function storePendingTask(taskId, filename) {
        try {
            const list = loadPendingTasks().filter(t => t.taskId !== taskId);
            list.push({ taskId, filename, ts: Date.now() });
            sessionStorage.setItem(TASK_STORE_KEY, JSON.stringify(list));
        } catch (_) {}
    }

    function dropPendingTask(taskId) {
        try {
            const list = loadPendingTasks().filter(t => t.taskId !== taskId);
            sessionStorage.setItem(TASK_STORE_KEY, JSON.stringify(list));
        } catch (_) {}
    }

    function loadPendingTasks() {
        try {
            const raw = sessionStorage.getItem(TASK_STORE_KEY);
            if (!raw) return [];
            return JSON.parse(raw).filter(t => Date.now() - t.ts < 15 * 60 * 1000);
        } catch (_) { return []; }
    }

    function restorePendingTasks() {
        const tasks = loadPendingTasks();
        if (tasks.length === 0) return;

        const panel = document.getElementById('recovery-panel');
        const tbody = document.getElementById('recovery-body');
        panel.classList.remove('d-none');

        tasks.forEach(({ taskId, filename }) => {
            const rowId    = `rec-row-${taskId}`;
            const statusId = `rec-status-${taskId}`;
            const tr = document.createElement('tr');
            tr.id = rowId;
            tr.innerHTML = `
                <td class="text-truncate" style="max-width:280px;">${escHtml(filename)}</td>
                <td id="${statusId}" style="min-width:280px;">
                    <span class="spinner-border spinner-border-sm text-info me-1"></span>
                    <span class="text-info small">진행 상태 복구 중...</span>
                </td>`;
            tbody.appendChild(tr);

            // subscribe() now answers authoritatively as soon as the connection opens — buffered
            // replay for a task that's still tracked, or a synthetic 'unknown' event for one whose
            // outcome already aged out server-side — so there's no more need to guess from silence.
            subscribeIndexingProgress(
                taskId,
                evt => setIndexingStageById(statusId, evt),
                docResult => {
                    dropPendingTask(taskId);
                    const el = document.getElementById(statusId);
                    if (el) el.innerHTML = `<span class="text-success">✅ 완료 (${docResult?.chunks ?? 0} ${PAGE_I18N.chunks})</span>`;
                    showToast(`${escHtml(filename)} ${I18N.uploadSuccess} (${docResult?.chunks ?? 0} ${I18N.uploadChunks})`, 'success');
                    removeRecoveryRow(rowId, tbody, panel, true);
                },
                err => {
                    dropPendingTask(taskId);
                    const el = document.getElementById(statusId);
                    if (err.cancelled) {
                        if (el) el.innerHTML = `<span class="text-muted">⏹ ${escHtml(err.message)}</span>`;
                    } else if (err.unknown) {
                        if (el) el.innerHTML = `<span class="text-warning">⚠️ ${escHtml(err.message)}</span>`;
                    } else {
                        if (el) el.innerHTML = `<span class="text-danger">❌ ${escHtml(err.message)}</span>`;
                    }
                    // A file that actually finished while away still needs its row to show up.
                    removeRecoveryRow(rowId, tbody, panel, true);
                }
            );
        });
    }

    function removeRecoveryRow(rowId, tbody, panel, refreshList) {
        setTimeout(() => {
            const row = document.getElementById(rowId);
            if (row) row.remove();
            if (tbody.children.length === 0) panel.classList.add('d-none');
            if (refreshList) htmx.ajax('GET', '/ui/documents/list', {target: '#doc-table-body', swap: 'outerHTML'});
        }, 3000);
    }

    restorePendingTasks();

    /* ── 기존 태그 제안 칩 ─────────────────────────────────────────────── */
    const tagsInput = document.getElementById('tags-input');
    const tagSelect = document.getElementById('tag-select');
    const versionInput = document.getElementById('version-input');
    const versionOptions = document.getElementById('version-options');
    const tagSelectPlaceholder = (tagSelect?.options?.[0]?.textContent || '태그 선택...').trim();
    let knownTagOptions = [];

    function currentTags() {
        return (tagsInput.value || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    }
    function addTag(tag) {
        const t = (tag || '').trim().toLowerCase();
        if (!t) return;
        const tags = currentTags();
        if (!tags.includes(t)) tags.push(t);
        tagsInput.value = tags.join(', ');
        syncTagChipStates();
        syncTagSelectOptions();
    }
    function syncTagChipStates() {
        const sel = currentTags();
        document.querySelectorAll('#tag-suggest-chips [data-tag]').forEach(el => {
            el.classList.toggle('btn-primary', sel.includes(el.dataset.tag));
            el.classList.toggle('btn-outline-secondary', !sel.includes(el.dataset.tag));
        });
    }
    function loadVersionSuggestions() {
        const current = (versionInput.value || '').trim() || 'latest';
        fetch('/api/v1/versions')
            .then(r => r.ok ? r.json() : [])
            .then(versions => {
                const items = Array.isArray(versions) ? versions.filter(Boolean) : [];
                if (!items.includes('latest')) items.push('latest');
                if (!items.includes(current)) items.push(current);
                items.sort();
                versionOptions.innerHTML = items.map(v => `<option value="${escHtml(v)}"></option>`).join('');
                versionInput.value = current;
            })
            .catch(() => {
                versionOptions.innerHTML = `<option value="${escHtml(current)}"></option>`;
                versionInput.value = current;
            });
    }

    function loadTagSuggestions() {
        const version = (versionInput.value || '').trim();
        const url = '/api/v1/tags' + (version ? ('?version=' + encodeURIComponent(version)) : '');
        fetch(url)
            .then(r => r.ok ? r.json() : [])
            .then(tags => {
                const wrap  = document.getElementById('tag-suggest');
                const chips = document.getElementById('tag-suggest-chips');
                if (!tags || tags.length === 0) {
                    wrap.classList.add('d-none');
                    chips.innerHTML = '';
                    knownTagOptions = [];
                    syncTagSelectOptions();
                    return;
                }
                chips.innerHTML = tags.map(t =>
                    `<button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2"
                             style="font-size:0.72rem;" data-tag="${escHtml(t)}">${escHtml(t)}</button>`).join('');
                chips.querySelectorAll('[data-tag]').forEach(btn =>
                    btn.addEventListener('click', () => addTag(btn.dataset.tag)));

                knownTagOptions = tags.map(t => String(t).trim().toLowerCase()).filter(Boolean);
                syncTagSelectOptions();

                wrap.classList.remove('d-none');
                syncTagChipStates();
            })
            .catch(() => {});
    }

    function syncTagSelectOptions() {
        if (!tagSelect) return;
        const merged = Array.from(new Set([].concat(knownTagOptions, currentTags()))).sort();
        tagSelect.innerHTML = ['<option value="" selected>' + escHtml(tagSelectPlaceholder) + '</option>']
            .concat(merged.map(t => `<option value="${escHtml(t)}">${escHtml(t)}</option>`))
            .join('');
    }

    if (tagSelect) {
        tagSelect.addEventListener('change', function () {
            if (!this.value) return;
            addTag(this.value);
            this.value = '';
        });
    }
    versionInput.addEventListener('change', function () {
        const v = (this.value || '').trim() || 'latest';
        this.value = v;
        loadTagSuggestions();
    });
    tagsInput.addEventListener('input', function () {
        syncTagChipStates();
        syncTagSelectOptions();
    });
    loadVersionSuggestions();
    loadTagSuggestions();
</script>
</th:block>

</body>
</html>
