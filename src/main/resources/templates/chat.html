<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="ko">
<head>
    <title th:text="#{nav.chat}">Chat</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex chat-shell">

        <!-- ── Sidebar (offcanvas drawer < md, static column ≥ md) ──────── -->
        <div class="sidebar border-end bg-light d-flex flex-column p-3 offcanvas-md offcanvas-start"
             id="threadDrawer" tabindex="-1"
             th:attr="aria-label=#{chat.threads.aria}" aria-label="Conversations">

            <!-- Drawer header (mobile only) -->
            <div class="offcanvas-header d-md-none px-0 pt-0 pb-2 mb-2 border-bottom">
                <h6 class="offcanvas-title mb-0 fw-semibold" th:text="#{chat.threads.title}">Conversations</h6>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                        data-bs-target="#threadDrawer"
                        th:attr="aria-label=#{action.close}" aria-label="Close"></button>
            </div>


            <!-- New chat -->
            <div class="d-flex align-items-center gap-2 mb-2">
                <form th:action="@{/ui/chat/new}" method="post" class="flex-grow-1">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
                           th:value="${_csrf != null ? _csrf.token : ''}"/>
                    <button type="submit" class="btn btn-sm btn-primary w-100">
                        <i class="bi bi-plus-lg me-1"></i>
                        <span th:text="#{chat.new}">New Chat</span>
                    </button>
                </form>
            </div>

            <!-- Routing strategy selector — meaningless when the deployment default is
                 LOCAL_ONLY (LLM_ROUTING_MODE=LOCAL_ONLY, the operator's local-only-mode
                 setting), so hidden entirely there -->
            <div class="mb-3" th:if="${!localOnlyDeployment}">
                <label class="form-label small text-muted mb-1" for="routing-mode-select"
                       th:text="#{chat.routing.label}">Routing Strategy</label>
                <select id="routing-mode-select"
                        class="form-select form-select-sm"
                        th:attr="data-thread-id=${threadId}, data-has-thread=${meta != null}">
                    <option value="COST_FIRST"
                            th:selected="${routingMode == 'COST_FIRST'}"
                            th:text="#{routing.cost_first}">Cost First</option>
                    <option value="QUALITY_FIRST"
                            th:selected="${routingMode == 'QUALITY_FIRST'}"
                            th:text="#{routing.quality_first}">Quality First</option>
                    <option value="PROGRESSIVE"
                            th:selected="${routingMode == 'PROGRESSIVE'}"
                            th:text="#{routing.progressive}">Progressive</option>
                    <option value="LOCAL_ONLY"
                            th:with="reqLocal=#{routing.requires_local}"
                            th:selected="${routingMode == 'LOCAL_ONLY'}"
                            th:disabled="${!hasLocalProvider}"
                            th:title="${!hasLocalProvider ? reqLocal : ''}"
                            th:text="#{routing.local_only}">Local Only</option>
                </select>
            </div>

            <!-- Thread list (HTMX auto-refresh on refreshThreadList event) -->
            <div id="thread-list-wrapper"
                 class="overflow-auto flex-grow-1"
                 th:attr="hx-get=@{/ui/threads(activeThreadId=${threadId})}"
                 hx-trigger="refreshThreadList from:body, refreshThreadListDelayed"
                 hx-target="#thread-list"
                 hx-swap="outerHTML">
                <div th:replace="~{fragments/thread-list :: list}"></div>
            </div>

            <!-- Current thread info -->
            <div th:if="${meta != null}" class="border-top pt-2 mt-2 small">
                <!-- Title -->
                <div id="current-thread-title" class="fw-semibold text-dark text-truncate mb-1"
                     th:text="${meta.title}"></div>
                <!-- Thread ID + copy -->
                <div class="d-flex align-items-center gap-1 mb-2 text-muted font-monospace">
                    <span th:text="${#strings.substring(meta.threadId, 0, 8)}"></span>
                    <button class="btn btn-link btn-sm p-0 text-muted lh-1"
                            th:title="#{chat.copy}"
                            th:attr="data-thread-id=${meta.threadId}"
                            onclick="copyThreadId(this, this.dataset.threadId)" >
                        <i class="bi bi-clipboard" style="font-size:0.75rem;"></i>
                    </button>
                </div>
                <!-- Actions -->
                <div class="d-flex gap-1">
                    <button class="btn btn-outline-secondary btn-sm flex-grow-1"
                            th:attr="data-thread-id=${meta.threadId}"
                            onclick="startTitleEdit(this.dataset.threadId)" >
                        <i class="bi bi-pencil me-1"></i>
                        <span th:text="#{chat.edit}">Edit</span>
                    </button>
                    <button class="btn btn-outline-danger btn-sm"
                            th:attr="data-thread-id=${meta.threadId}"
                            onclick="deleteCurrentThread(this.dataset.threadId)"
                            th:title="#{chat.delete}">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ── Chat area ─────────────────────────────────────────────── -->
        <div class="flex-grow-1 d-flex flex-column overflow-hidden position-relative">

            <!-- Mobile top bar (hamburger → opens thread drawer) -->
            <div class="d-flex d-md-none align-items-center gap-2 border-bottom p-2">
                <button type="button" class="btn btn-outline-secondary btn-sm btn-icon"
                        data-bs-toggle="offcanvas" data-bs-target="#threadDrawer"
                        aria-controls="threadDrawer"
                        th:attr="aria-label=#{chat.threads.open}" aria-label="Open conversations">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <span class="fw-semibold text-truncate"
                      th:text="${meta != null} ? ${meta.title} : #{chat.new}">New Chat</span>
            </div>

            <!-- Previous thread resume banner -->
            <div th:if="${meta != null and historyCount != null and historyCount > 0}"
                 class="alert alert-info rounded-0 mb-0 py-2 small">
                <i class="bi bi-chat-left-dots me-1"></i>
                <strong th:text="${meta.title}"></strong>
                <span th:text="#{chat.resume.label}">Continuing conversation</span> ·
                <span th:text="${historyCount}"></span>
                <span th:text="#{chat.resume.prev}">previous messages</span> ·
                <strong th:text="#{chat.resume.hint}">Continue typing below.</strong>
            </div>

            <!-- Messages -->
            <div id="chat-messages" class="flex-grow-1 p-3">
                <!-- Server-rendered previous turns (restored from conversation_turns) -->
                <th:block th:if="${turns != null}" th:each="turn : ${turns}">
                    <div class="d-flex justify-content-end mb-3 align-items-end">
                        <div class="d-flex flex-column align-items-end me-1">
                            <div class="bubble-user p-3" th:text="${turn.question}"></div>
                            <small class="text-muted msg-time"
                                   th:if="${turn.askedAt != null}"
                                   th:attr="data-utc-time=${turn.askedAt}"
                                   style="font-size:0.68rem; margin-top:2px;"></small>
                        </div>
                        <i class="bi bi-person-circle fs-5 text-secondary ms-2 mt-1 flex-shrink-0"></i>
                    </div>
                    <div class="d-flex align-items-end mb-3">
                        <i class="bi bi-robot fs-5 text-secondary me-1 mt-1 flex-shrink-0"></i>
                        <div class="bubble-assistant p-3 flex-grow-1">
                            <div class="md-content" th:attr="data-md=${turn.answer}"></div>

                            <!-- Feedback (like/dislike) + Metadata, same line -->
                            <div class="mt-1 d-flex align-items-center flex-wrap gap-2">
                                <div class="feedback-controls d-flex gap-1"
                                     th:attr="data-turn-id=${turn.id},data-thread-id=${threadId}">
                                    <button type="button" class="btn btn-sm feedback-btn" data-feedback="LIKE"
                                            th:classappend="${turn.feedback == 'LIKE'} ? 'btn-primary' : 'btn-outline-secondary'"
                                            th:attr="aria-label=#{feedback.like},title=#{feedback.like}">👍</button>
                                    <button type="button" class="btn btn-sm feedback-btn" data-feedback="DISLIKE"
                                            th:classappend="${turn.feedback == 'DISLIKE'} ? 'btn-danger' : 'btn-outline-secondary'"
                                            th:attr="aria-label=#{feedback.dislike},title=#{feedback.dislike}">👎</button>
                                    <!-- §10.10 — 좋아요한 답변만 편집 가능(본인 소유 turn, 채팅창은 항상 본인 스레드만 보여줌) -->
                                    <button type="button" class="btn btn-sm btn-outline-secondary curated-edit-btn"
                                            th:style="${turn.feedback == 'LIKE'} ? '' : 'display:none;'"
                                            th:attr="aria-label=#{curated.edit},title=#{curated.edit}">
                                        <i class="bi bi-pencil"></i>
                                    </button>
                                    <!-- §10.10 embedding-fallback — 좋아요한 답변의 큐레이션 임베딩이 (재시도 후에도)
                                         실패한 경우의 표시. 백그라운드 스레드에서 몇 초 뒤 실패하므로 실시간으로는
                                         알릴 수 없어 다음 페이지 로드 시 여기서 보여준다. -->
                                    <span th:if="${curatedEmbedFailedTurnIds != null and curatedEmbedFailedTurnIds.contains(turn.id)}"
                                          class="badge bg-warning text-dark"
                                          th:text="#{curated.embed.failed}"
                                          th:title="#{curated.embed.failed.hint}">임베딩 실패</span>
                                </div>
                                <div class="text-muted"
                                     style="font-size:0.68rem;"
                                     th:if="${turn.provider != null or turn.answeredAt != null}">
                                    <span th:if="${turn.provider != null}">🤖 <span th:text="${turn.provider}"></span> &nbsp;·&nbsp;</span>
                                    <span th:if="${turn.elapsedMs > 0}">⏱ <span th:text="${#numbers.formatDecimal(turn.elapsedMs / 1000.0, 1, 1)}"></span>s &nbsp;·&nbsp;</span>
                                    <span th:if="${turn.inputTokens > 0 or turn.outputTokens > 0}">
                                        📥 <span th:text="${turn.inputTokens}"></span>
                                        &nbsp;·&nbsp;
                                        📤 <span th:text="${turn.outputTokens}"></span>
                                        &nbsp;·&nbsp;
                                        합계 <span th:text="${turn.inputTokens + turn.outputTokens}"></span> tok
                                        &nbsp;·&nbsp;
                                    </span>
                                    <span th:if="${turn.llmCalls > 0}">🔄 <span th:text="${turn.llmCalls}"></span> &nbsp;·&nbsp;</span>
                                    <span>📝 <span th:text="${#strings.length(turn.answer)}"></span>자 &nbsp;·&nbsp;</span>
                                    <span class="msg-time"
                                          th:if="${turn.answeredAt != null}"
                                          th:attr="data-utc-time=${turn.answeredAt}">🕐</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </th:block>
            </div>

            <!-- Jump-to-latest: shown when the user scrolls up (e.g. to read earlier content
                 while an answer is streaming); auto-scroll is suppressed until they return. -->
            <button type="button" id="scroll-to-bottom-btn"
                    class="btn btn-secondary scroll-to-bottom-btn d-none"
                    th:attr="aria-label=#{chat.scroll.bottom},title=#{chat.scroll.bottom}"
                    aria-label="Jump to latest">
                <i class="bi bi-arrow-down"></i>
            </button>

            <!-- Typing indicator (outside scroll area, shown during request) -->
            <div id="typing-indicator" class="d-none align-items-center gap-2 px-3 pb-1">
                <i class="bi bi-robot fs-5 text-secondary"></i>
                <div class="bubble-assistant px-3 py-2">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>

            <!-- Input form -->
            <div class="border-top p-3 chat-input-bar">
                <form id="chat-form"
                      hx-post="/ui/chat"
                      hx-target="#chat-messages"
                      hx-swap="beforeend">
                    <input type="hidden" name="threadId" th:value="${threadId}"/>
                    <input type="hidden" id="form-version" name="version" th:value="${version}"/>
                    <input type="hidden" id="form-routing-mode" name="routingMode" th:value="${routingMode}"/>
                    <input type="hidden" id="form-direct-mode" name="directMode" value="false"/>
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                        <!-- 버전: 하나만 선택 -->
                        <div class="input-group input-group-sm w-auto">
                            <span class="input-group-text">Version</span>
                            <select id="version-input" class="form-select" style="max-width: 100px;">
                                <option th:value="${version}" th:text="${version}" selected>latest</option>
                            </select>
                        </div>

                        <!-- 검색 스코프 태그: 칩으로만 선택한다(별도 입력창 없음).
                             칩 토글 결과는 이 hidden 필드에 쉼표로 모여 폼/SSE로 전송된다. -->
                        <input type="hidden" id="chat-tags-input" name="tags"/>
                        <div id="chat-tag-suggest" class="d-none d-flex flex-wrap align-items-center gap-1">
                            <span id="chat-tag-suggest-chips" class="d-inline-flex flex-wrap gap-1"></span>
                        </div>

                        <div class="flex-grow-1"></div>

                        <!-- 응답 모드 S/M/L 토글 — 답변 길이·상세도 (기본 M).
                             L(원문 최대)은 RAG 검색 컨텍스트가 있을 때만 의미가 있어 Direct 모드에서 비활성화.
                             툴팁은 네이티브 title(브라우저 기본 지연 ~1.5s)이 아니라 Bootstrap Tooltip(짧은 delay)로 표시 — 하단 스크립트에서 초기화. -->
                        <span class="small text-muted" th:text="#{chat.response.group.label}">응답옵션</span>
                        <div id="response-mode-group" class="btn-group btn-group-sm" role="group"
                             th:attr="aria-label=#{chat.response.tooltip}">
                            <input type="radio" class="btn-check" name="response-mode-radio"
                                   id="response-mode-s" value="S" autocomplete="off"/>
                            <label class="btn btn-outline-secondary response-mode-btn" for="response-mode-s"
                                   data-bs-toggle="tooltip" th:title="#{chat.response.s}">S</label>

                            <input type="radio" class="btn-check" name="response-mode-radio"
                                   id="response-mode-m" value="M" checked autocomplete="off"/>
                            <label class="btn btn-outline-secondary response-mode-btn" for="response-mode-m"
                                   data-bs-toggle="tooltip" th:title="#{chat.response.m}">M</label>

                            <input type="radio" class="btn-check" name="response-mode-radio"
                                   id="response-mode-l" value="L" autocomplete="off"/>
                            <label class="btn btn-outline-secondary response-mode-btn" for="response-mode-l"
                                   id="response-mode-l-label" data-bs-toggle="tooltip" th:title="#{chat.response.l}">L</label>
                        </div>
                        <input type="hidden" id="form-response-mode" name="responseMode" value="M"/>
                    </div>
                    <div class="input-group">
                        <textarea id="question-input" name="question"
                                  class="form-control"
                                  th:placeholder="#{chat.input.placeholder}"
                                  rows="1"
                                  style="resize: none; overflow-y: hidden;"></textarea>
                        <!-- RAG / Direct LLM 토글 -->
                        <span class="input-group-text bg-body border-start-0 px-2"
                              id="direct-mode-wrapper"
                              th:title="#{chat.direct.tooltip}">
                            <div class="form-check form-switch mb-0 d-flex align-items-center gap-1">
                                <input class="form-check-input mt-0" type="checkbox"
                                       id="direct-mode-toggle" role="switch"
                                       style="cursor:pointer;"/>
                                <label class="form-check-label small text-muted mb-0"
                                       for="direct-mode-toggle"
                                       id="direct-mode-label"
                                       style="cursor:pointer; white-space:nowrap;"
                                       th:text="#{chat.direct.label.rag}">RAG</label>
                            </div>
                        </span>
                        <button id="send-btn" type="submit" class="btn btn-primary btn-icon"
                                th:data-send-label="#{chat.send}" th:data-stop-label="#{chat.stop}"
                                th:attr="aria-label=#{chat.send}" aria-label="Send">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ── §10.10 큐레이션 Q&A 편집 Offcanvas (본인 좋아요 답변) ──────────────── -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="curatedEditOffcanvas" style="width:480px; max-width:100%;">
        <div class="offcanvas-header border-bottom">
            <h6 class="offcanvas-title"><i class="bi bi-pencil-square me-2"></i><span th:text="#{curated.edit.title}">큐레이션 답변 편집</span></h6>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column gap-3" id="curatedEditOffcanvasBody">
            <textarea id="curated-edit-chat-answer" class="form-control flex-grow-1"
                      style="min-height:280px; font-size:0.9rem; resize:vertical;"></textarea>
            <div class="form-text small" th:text="#{curated.edit.hint}">저장하면 검색 임베딩이 자동으로 다시 계산됩니다.</div>
            <button class="btn btn-primary btn-sm" id="curated-edit-save-btn">
                <i class="bi bi-save me-1"></i><span th:text="#{action.save}">저장</span>
            </button>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script th:src="@{/js/chat-stream.js}" defer></script>
<script>
    const chatMessages    = document.getElementById('chat-messages');
    const typingIndicator = document.getElementById('typing-indicator');
    const chatForm        = document.getElementById('chat-form');
    const questionInput   = document.getElementById('question-input');
    const sendBtn         = document.getElementById('send-btn');
    const directToggle    = document.getElementById('direct-mode-toggle');
    const directLabel     = document.getElementById('direct-mode-label');
    const directModeInput = document.getElementById('form-direct-mode');

    /* RAG ↔ Direct LLM 토글 */
    const labelRag    = /*[[#{chat.direct.label.rag}]]*/ 'RAG';
    const labelDirect = /*[[#{chat.direct.label.direct}]]*/ 'Direct';
    directToggle.addEventListener('change', function () {
        const isDirect = this.checked;
        directModeInput.value = isDirect ? 'true' : 'false';
        directLabel.textContent = isDirect ? labelDirect : labelRag;
        directLabel.classList.toggle('text-primary', isDirect);
        directLabel.classList.toggle('text-muted', !isDirect);
        updateResponseModeAvailability(isDirect);
    });

    const versionInput  = document.getElementById('version-input');
    const tagSelect     = document.getElementById('chat-tag-select');

    /* Sync version selector → hidden form field */
    versionInput.addEventListener('change', function () {
        const ver = (this.value || '').trim() || 'latest';
        document.getElementById('form-version').value = ver;
        loadChatTagSuggestions();   // 버전 변경 시 해당 버전 태그로 갱신
    });

    function loadVersionOptions() {
        const current = (document.getElementById('form-version').value || 'latest').trim();
        fetch('/api/v1/versions')
            .then(r => r.ok ? r.json() : [])
            .then(versions => {
                const list = Array.isArray(versions) ? versions.filter(Boolean) : [];
                if (!list.includes(current)) list.push(current);
                if (!list.includes('latest')) list.push('latest');
                list.sort();
                versionInput.innerHTML = list.map(v =>
                    `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join('');
                versionInput.value = current;
            })
            .catch(() => {
                versionInput.innerHTML = `<option value="${escHtml(current)}">${escHtml(current)}</option>`;
                versionInput.value = current;
            });
    }

    /* ── 등록된 태그 칩 (버전 스코프, 클릭하면 검색 범위 토글) ──────────────── */
    const chatTagsInput   = document.getElementById('chat-tags-input');
    const chatAllLabel    = /*[[#{chat.tags.all}]]*/ 'All';
    const chatAllTooltip  = /*[[#{chat.tags.all.tooltip}]]*/ 'Search all documents';

    function chatCurrentTags() {
        return (chatTagsInput.value || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    }
    function chatToggleTag(tag) {
        const tags = chatCurrentTags();
        const i = tags.indexOf(tag);
        if (i >= 0) tags.splice(i, 1); else tags.push(tag);
        chatTagsInput.value = tags.join(', ');
        chatSyncTagChips();
    }
    function chatAddTag(tag) {
        const t = (tag || '').trim().toLowerCase();
        if (!t) return;
        const tags = chatCurrentTags();
        if (!tags.includes(t)) tags.push(t);
        chatTagsInput.value = tags.join(', ');
        chatSyncTagChips();
    }
    /* 'All' 칩: 태그 선택을 모두 비워 전체 문서를 검색한다(기존 "태그 미선택 = 전체 검색" 의미론
       그대로 재사용 — 서버 계약 변경 없음). 새 대화의 기본 상태(hidden 필드가 비어있음)와 같으므로
       별도 "기본 선택" 처리 없이 chatSyncTagChips()가 태그 0개일 때 자동으로 All을 활성 표시한다. */
    function chatSelectAllTags() {
        chatTagsInput.value = '';
        chatSyncTagChips();
    }
    function chatSyncTagChips() {
        const sel = chatCurrentTags();
        const allBtn = document.querySelector('#chat-tag-suggest-chips [data-tag-all]');
        if (allBtn) {
            allBtn.classList.toggle('btn-primary', sel.length === 0);
            allBtn.classList.toggle('btn-outline-secondary', sel.length > 0);
        }
        document.querySelectorAll('#chat-tag-suggest-chips [data-tag]').forEach(el => {
            el.classList.toggle('btn-primary', sel.includes(el.dataset.tag));
            el.classList.toggle('btn-outline-secondary', !sel.includes(el.dataset.tag));
        });
    }
    function loadChatTagSuggestions() {
        const ver = (document.getElementById('form-version').value || '').trim();
        const params = new URLSearchParams({excludeCommon: 'true'});
        if (ver) params.set('version', ver);
        fetch('/api/v1/tags?' + params.toString())
            .then(r => r.ok ? r.json() : [])
            .then(tags => {
                const wrap  = document.getElementById('chat-tag-suggest');
                const chips = document.getElementById('chat-tag-suggest-chips');
                if (!tags || tags.length === 0) {
                    wrap.classList.add('d-none');
                    chips.innerHTML = '';
                    if (tagSelect) {
                        tagSelect.innerHTML = '<option value="" selected>태그 선택...</option>';
                    }
                    return;
                }
                const allChip = `<button type="button" class="btn btn-sm py-0 px-2"
                         style="font-size:0.72rem;" data-tag-all="true" title="${escHtml(chatAllTooltip)}">${escHtml(chatAllLabel)}</button>`;
                chips.innerHTML = allChip + tags.map(t =>
                    `<button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2"
                             style="font-size:0.72rem;" data-tag="${escHtml(t)}">${escHtml(t)}</button>`).join('');
                chips.querySelector('[data-tag-all]').addEventListener('click', chatSelectAllTags);
                chips.querySelectorAll('[data-tag]').forEach(btn =>
                    btn.addEventListener('click', () => chatToggleTag(btn.dataset.tag)));

                if (tagSelect) {
                    const opts = ['<option value="" selected>태그 선택...</option>']
                        .concat(tags.map(t => `<option value="${escHtml(t)}">${escHtml(t)}</option>`));
                    tagSelect.innerHTML = opts.join('');
                }

                wrap.classList.remove('d-none');
                chatSyncTagChips();
            })
            .catch(() => {});
    }
    if (tagSelect) {
        tagSelect.addEventListener('change', function () {
            if (!this.value) return;
            chatAddTag(this.value);
            this.value = '';
        });
    }
    loadVersionOptions();
    loadChatTagSuggestions();

    /* ── 응답 모드 S/M/L 토글 버튼 → hidden 폼 필드 + localStorage 유지 ───────── */
    const responseModeRadios = document.querySelectorAll('input[name="response-mode-radio"]');
    const responseModeInput  = document.getElementById('form-response-mode');
    const responseModeLRadio = document.getElementById('response-mode-l');
    const RESPONSE_MODE_KEY  = 'chatResponseMode';

    function applyResponseMode(mode) {
        const requested = ['S', 'M', 'L'].includes(mode) ? mode : 'M';
        const m = (requested === 'L' && responseModeLRadio.disabled) ? 'M' : requested;
        responseModeRadios.forEach(r => { r.checked = (r.value === m); });
        responseModeInput.value = m;
    }
    /* Direct 모드에서는 L(원문 최대)이 의미가 없으므로 버튼 자체를 비활성화하고,
       현재 선택이 L이었다면 M으로 되돌린다. RAG로 돌아가도 L은 자동 재선택하지 않는다. */
    function updateResponseModeAvailability(isDirect) {
        responseModeLRadio.disabled = isDirect;
        if (isDirect && responseModeInput.value === 'L') {
            applyResponseMode('M');
            localStorage.setItem(RESPONSE_MODE_KEY, 'M');
        }
    }
    updateResponseModeAvailability(directToggle.checked);
    applyResponseMode(localStorage.getItem(RESPONSE_MODE_KEY));
    responseModeRadios.forEach(radio => radio.addEventListener('change', function () {
        if (!this.checked) return;
        responseModeInput.value = this.value;
        localStorage.setItem(RESPONSE_MODE_KEY, this.value);
    }));

    /* 네이티브 title 툴팁은 브라우저 기본 지연(~1.5s)이 있어 체감상 너무 늦게 뜬다 —
       Bootstrap Tooltip으로 대체해 짧은 delay로 표시한다. */
    document.querySelectorAll('#response-mode-group [data-bs-toggle="tooltip"]').forEach(el => {
        new bootstrap.Tooltip(el, {delay: {show: 100, hide: 0}});
    });

    /* Sync routing mode → hidden form field + PATCH thread if it exists.
       Selector is absent entirely when the deployment default is LOCAL_ONLY (localOnlyDeployment=true). */
    const routingModeSelect = document.getElementById('routing-mode-select');
    if (routingModeSelect) {
        routingModeSelect.addEventListener('change', function () {
            const mode = this.value;
            document.getElementById('form-routing-mode').value = mode;
            if (this.dataset.hasThread === 'true') {
                fetch('/ui/threads/' + this.dataset.threadId + '/routing-mode', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders()},
                    body: 'routingMode=' + encodeURIComponent(mode)
                });
            }
        });
    }

    /* Auto-expand textarea (max 6 lines) */
    function adjustTextarea() {
        questionInput.style.height = 'auto';
        const lineH = parseInt(getComputedStyle(questionInput).lineHeight);
        questionInput.style.height = Math.min(questionInput.scrollHeight, lineH * 6) + 'px';
    }
    questionInput.addEventListener('input', adjustTextarea);

    /* ── 입력 시작 시 대화 요약 선계산 (백그라운드, 응답 안 기다림) ──────
       요약 대상은 이미 저장된 turn 들뿐이라 지금 입력 중인 텍스트와 무관하므로,
       입력을 시작하는 즉시(한 글자만 쳐도) 1회만 트리거하고 이번 입력 세션 동안 재호출하지 않는다.
       실패해도 조용히 무시 — 다음 질문 전송 시 캐시가 없으면 기존 getHistory() 경로로 자동 폴백된다. */
    questionInput.addEventListener('input', function () {
        if (this.dataset.summaryPrecomputed || !this.value.trim()) return;
        this.dataset.summaryPrecomputed = '1';
        const threadId = document.getElementById('chat-form').querySelector('input[name="threadId"]').value;
        fetch('/ui/chat/summary/precompute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
            body: 'threadId=' + encodeURIComponent(threadId)
        }).catch(() => {});
    });

    /* Enter → submit, Shift+Enter → newline.
       한글 등 IME 조합 중 Enter로 조합을 확정하면 일부 브라우저(특히 Safari)가 keydown을
       두 번 발생시켜(조합 확정용 + 그 직후 실제 Enter) 같은 질문이 두 번 제출되는 버그가
       있었다 — e.isComposing만으로는 해당 브라우저에서 조합 확정 keydown 때 false로
       잘못 보고되는 경우가 있어 compositionstart/compositionend로 별도 플래그를 유지해
       이중으로 방어한다. */
    let isComposing = false;
    questionInput.addEventListener('compositionstart', function () { isComposing = true; });
    questionInput.addEventListener('compositionend', function () { isComposing = false; });
    questionInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            if (e.isComposing || isComposing) return;
            e.preventDefault();
            if (this.value.trim()) chatForm.requestSubmit();
        }
    });

    /* #chat-messages has CSS scroll-behavior:smooth (app.css) for in-stream scrolling, but that
       makes a plain `.scrollTop = x` assignment an animated scroll instead of an instant jump —
       unreliable here (the animation can get interrupted/never finish). scrollTo({behavior:
       'instant'}) explicitly overrides the CSS behavior, same as chat-stream.js's own version. */
    function scrollToBottom() {
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'instant' });
    }

    function escHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* Before request: optimistic user bubble + clear input */
    chatForm.addEventListener('htmx:beforeRequest', function () {
        const q = questionInput.value.trim();
        if (q) {
            const timeStr = new Date().toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit', hour12: false});
            const bubble = document.createElement('div');
            bubble.className = 'd-flex justify-content-end mb-3 align-items-end';
            bubble.innerHTML =
                `<div class="d-flex flex-column align-items-end me-1">` +
                `<div class="bubble-user p-3">${escHtml(q)}</div>` +
                `<small class="text-muted" style="font-size:0.68rem; margin-top:2px;">${escHtml(timeStr)}</small>` +
                `</div>` +
                `<i class="bi bi-person-circle fs-5 text-secondary ms-2 mt-1 flex-shrink-0"></i>`;
            chatMessages.appendChild(bubble);
        }
        questionInput.value = '';
        questionInput.style.height = 'auto';
        delete questionInput.dataset.summaryPrecomputed;
        sendBtn.disabled = true;
        typingIndicator.classList.remove('d-none');
        typingIndicator.classList.add('d-flex');
        scrollToBottom();
    });

    /* After request: hide indicator, re-enable send, scroll after paint */
    chatForm.addEventListener('htmx:afterRequest', function () {
        typingIndicator.classList.add('d-none');
        typingIndicator.classList.remove('d-flex');
        sendBtn.disabled = false;
        requestAnimationFrame(scrollToBottom);
    });

    /* ── Relative date formatting ──────────────────────────────────── */
    function formatRelativeDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr.replace(' ', 'T'));
        if (isNaN(d)) return dateStr;
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);
        const dStart = new Date(d);
        dStart.setHours(0, 0, 0, 0);
        const diff = Math.round((todayStart - dStart) / 86400000);
        if (diff === 0) return /*[[#{date.today}]]*/ 'Today';
        if (diff === 1) return /*[[#{date.yesterday}]]*/ 'Yesterday';
        return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
    }

    function applyRelativeDates() {
        document.querySelectorAll('.thread-date[data-date]').forEach(el => {
            el.textContent = formatRelativeDate(el.getAttribute('data-date'));
        });
    }
    applyRelativeDates();
    document.body.addEventListener('htmx:afterSettle', applyRelativeDates);

    /* ── Thread ID copy ────────────────────────────────────────────── */
    function copyThreadId(btn, id) {
        // navigator.clipboard is secure-context only (HTTPS or localhost) — undefined when the app
        // is opened over plain HTTP from a LAN address, where this used to throw and the button did
        // nothing. Fall back to the legacy execCommand path so copying still works there.
        const done = () => {
            const icon = btn.querySelector('i');
            if (icon) {
                icon.className = 'bi bi-check';
                setTimeout(() => { icon.className = 'bi bi-clipboard'; }, 1500);
            }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(id).then(done).catch(() => legacyCopy(id) && done());
        } else if (legacyCopy(id)) {
            done();
        }
    }

    function legacyCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
    }

    /* ── Inline title edit ─────────────────────────────────────────── */
    function startTitleEdit(threadId) {
        const titleEl = document.getElementById('current-thread-title');
        if (!titleEl || titleEl.tagName === 'INPUT') return;
        const current = titleEl.textContent.trim();
        const input = document.createElement('input');
        input.type = 'text';
        input.value = current;
        input.className = 'form-control form-control-sm mb-1';
        titleEl.replaceWith(input);
        input.focus();
        input.select();
        let done = false;

        function commit(save) {
            if (done) return;
            done = true;
            const newTitle = save ? (input.value.trim() || current) : current;
            const el = document.createElement('div');
            el.id = 'current-thread-title';
            el.className = 'fw-semibold text-dark text-truncate mb-1';
            el.textContent = newTitle;
            input.replaceWith(el);
            if (save && newTitle !== current) {
                fetch(`/ui/threads/${threadId}/title`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
                    body: 'title=' + encodeURIComponent(newTitle)
                }).then(() => {
                    const item = document.getElementById('thread-' + threadId);
                    if (item) {
                        const t = item.querySelector('.text-truncate');
                        if (t) t.textContent = newTitle;
                    }
                });
            }
        }

        input.addEventListener('blur', () => commit(true));
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); commit(true); }
            if (e.key === 'Escape') { e.preventDefault(); commit(false); }
        });
    }

    /* ── Delete current thread ─────────────────────────────────────── */
    function deleteCurrentThread(threadId) {
        if (!confirm(I18N.deleteConfirmThread)) return;
        fetch(`/ui/threads/${threadId}`, { method: 'DELETE', headers: getCsrfHeaders() })
            .then(r => { if (r.ok) window.location.href = '/'; })
            .catch(() => showToast(I18N.requestFailed, 'danger'));
    }

    /* ── 5초 지연 2차 갱신 (LLM 비동기 제목 반영) ───────────────────── */
    document.body.addEventListener('refreshThreadList', function () {
        const wrapper = document.getElementById('thread-list-wrapper');
        if (wrapper) setTimeout(() => htmx.trigger(wrapper, 'refreshThreadListDelayed'), 5000);
    });

    /* ── 복원된 turn 시간 포맷팅 (UTC DB 시간 → 로컬 HH:MM) ─────────────── */
    function applyMsgTimes() {
        document.querySelectorAll('.msg-time[data-utc-time]').forEach(function (el) {
            const raw = el.getAttribute('data-utc-time');
            if (!raw) return;
            try {
                const d = new Date(raw.replace(' ', 'T') + 'Z');
                if (!isNaN(d)) {
                    const t = d.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit', hour12: false});
                    el.textContent = (el.textContent.includes('🕐') ? '🕐 ' : '') + t;
                }
            } catch (e) {}
            el.removeAttribute('data-utc-time');
        });
    }
    applyMsgTimes();

    /* ── 서버 렌더 이전 turn 마크다운 처리 + syntax highlight + 초기 스크롤 ── */
    document.querySelectorAll('.md-content[data-md]').forEach(function (el) {
        const raw = el.dataset.md || '';
        if (typeof marked === 'undefined') { el.textContent = raw; delete el.dataset.md; return; }
        const html = marked.parse(raw);
        el.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(html) : html;
        if (typeof hljs !== 'undefined') {
            el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        }
        delete el.dataset.md;
    });

    /* ── 응답 피드백 (좋아요/싫어요) — 서버 렌더/HTMX/스트리밍 버블 공통 위임 처리 ── */
    document.getElementById('chat-messages').addEventListener('click', function (e) {
        const btn = e.target.closest('.feedback-btn');
        if (!btn) return;
        const container = btn.closest('.feedback-controls');
        if (!container) return;
        const tId = container.dataset.threadId;
        const turnId = container.dataset.turnId;
        if (!tId || !turnId) return;

        const clickedValue = btn.dataset.feedback;
        const activeClass = clickedValue === 'LIKE' ? 'btn-primary' : 'btn-danger';
        const wasActive = btn.classList.contains(activeClass);
        const newValue = wasActive ? 'NONE' : clickedValue;

        fetch(`/ui/threads/${tId}/turns/${turnId}/feedback`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
            body: 'feedback=' + encodeURIComponent(newValue)
        }).then(function (r) {
            if (!r.ok) { showToast(I18N.requestFailed, 'danger'); return; }
            container.querySelectorAll('.feedback-btn').forEach(function (b) {
                b.classList.remove('btn-primary', 'btn-danger');
                b.classList.add('btn-outline-secondary');
            });
            if (newValue !== 'NONE') {
                btn.classList.remove('btn-outline-secondary');
                btn.classList.add(activeClass);
            }
            // §10.10 — 편집 아이콘은 LIKE 상태일 때만 노출(승격 즉시 임베딩되므로 그 즉시부터 편집 가능).
            const editBtn = container.querySelector('.curated-edit-btn');
            if (editBtn) editBtn.style.display = (newValue === 'LIKE') ? '' : 'none';
        }).catch(function () { showToast(I18N.requestFailed, 'danger'); });
    });

    /* ── §10.10 큐레이션 Q&A 인라인 편집 (본인 좋아요 답변) ─────────────────── */
    let curatedEditTarget = null; // { threadId, turnId, container }

    document.getElementById('chat-messages').addEventListener('click', function (e) {
        const editBtn = e.target.closest('.curated-edit-btn');
        if (!editBtn) return;
        const container = editBtn.closest('.feedback-controls');
        if (!container) return;
        const threadId = container.dataset.threadId;
        const turnId = container.dataset.turnId;
        if (!threadId || !turnId) return;

        fetch(`/ui/threads/${threadId}/turns/${turnId}/curated`)
            .then(function (r) { if (!r.ok) throw new Error(); return r.json(); })
            .then(function (data) {
                curatedEditTarget = { threadId, turnId };
                document.getElementById('curated-edit-chat-answer').value = data.answer || '';
                new bootstrap.Offcanvas(document.getElementById('curatedEditOffcanvas')).show();
            })
            .catch(function () { showToast(I18N.requestFailed, 'danger'); });
    });

    document.getElementById('curated-edit-save-btn').addEventListener('click', function () {
        if (!curatedEditTarget) return;
        const { threadId, turnId } = curatedEditTarget;
        const answer = document.getElementById('curated-edit-chat-answer').value;

        fetch(`/ui/threads/${threadId}/turns/${turnId}/curated`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
            body: 'answer=' + encodeURIComponent(answer)
        }).then(function (r) {
            if (!r.ok) { showToast(I18N.requestFailed, 'danger'); return; }
            showToast(I18N.curatedSaved, 'success');
            bootstrap.Offcanvas.getInstance(document.getElementById('curatedEditOffcanvas')).hide();
        }).catch(function () { showToast(I18N.requestFailed, 'danger'); });
    });

    scrollToBottom();
</script>
</th:block>

</body>
</html>
