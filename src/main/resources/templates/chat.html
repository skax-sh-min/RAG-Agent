       질문 원본은 오직 .user-turn[data-question] 하나에서 읽는다 — 서버 렌더 경로와
       스트리밍 경로(chat-stream.js appendUserBubble)가 같은 표식을 심기 때문에
       두 경로를 따로 다룰 필요가 없다. */
    const QNAV_I18N = {
        empty: /*[[#{chat.questions.empty}]]*/ 'No questions yet.',
        countSuffix: /*[[#{chat.questions.count}]]*/ ''
    };
    const qnavFloat     = document.getElementById('current-question-float');
    const qnavFloatText = document.getElementById('current-question-float-text');
    const qnavBtn       = document.getElementById('question-nav-btn');
    const qnavPanel     = document.getElementById('question-nav-panel');
    const qnavList      = document.getElementById('question-nav-list');
    const qnavCount     = document.getElementById('question-nav-count');
    let qnavCurrent     = null;  // 지금 풍선이 가리키는 .user-turn
    let qnavTicking     = false; // scroll 핸들러 rAF 스로틀

    function qnavTurns() {
        return Array.prototype.slice.call(chatMessages.querySelectorAll('.user-turn'));
    }

    function qnavTextOf(el) {
        if (el.dataset.question) return el.dataset.question;
        const body = el.querySelector('.bubble-user > div');
        return body ? body.textContent.trim() : '';
    }

    /* 목록·풍선에 붙는 '[RN] ' 접두. 버블의 표기 span 을 읽지 않고 data-response-mode 로 다시
       만드는 이유는 qnavTextOf() 가 data-question(원본)을 우선하기 때문이다 — 원본에는 표기가
       없으므로 여기서 붙이지 않으면 버블에는 보이고 목록에는 안 보이는 상태가 된다.
       모드를 심지 않은 옛 경로가 남아 있어도 빈 문자열로 떨어져 질문만 나온다. */
    function qnavModePrefix(el) {
        const m = el.dataset.responseMode;
        return m ? '[' + m + '] ' : '';
    }

    function qnavTimeOf(el) {
        const t = el.querySelector('.bubble-user-time');
        return t ? t.textContent.replace('🕐', '').trim() : '';
    }

    /* 목록/풍선에서 해당 질문으로 이동. scrollIntoView는 페이지 전체를 움직일 수 있어
       스크롤 컨테이너 기준 상대 이동으로 직접 계산한다(#chat-messages의 CSS
       scroll-behavior:smooth가 부드러운 이동을 담당). */
    function qnavJumpTo(el) {
        if (!el) return;
        const cRect = chatMessages.getBoundingClientRect();
        const top = chatMessages.scrollTop + (el.getBoundingClientRect().top - cRect.top) - 12;
        chatMessages.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
        const bubble = el.querySelector('.bubble-user');
        if (bubble) {
            bubble.classList.remove('question-flash');
            void bubble.offsetWidth; // 연속 클릭 시 애니메이션 재시작
            bubble.classList.add('question-flash');
            setTimeout(function () { bubble.classList.remove('question-flash'); }, 1500);
        }
    }

    /* 지금 읽고 있는 턴 = 목록 상단(정확히는 상단에서 QNAV_ANCHOR_PX 아래) 위로 시작점이
       올라간 마지막 질문. 그 질문 버블이 아직 화면에 남아 있으면 풍선은 숨긴다 — 같은
       문구를 두 번 보여줄 이유가 없다.
       기준선을 상단 딱 그 지점이 아니라 조금 아래로 잡는 이유: 목록에서 질문으로 이동하면
       그 질문이 상단에서 12px 아래에 놓이는데, 상단을 기준으로 하면 방금 이동해 온 질문이
       아직 '다음 턴'으로 분류돼 풍선이 바로 앞 질문을 가리킨다. */
    const QNAV_ANCHOR_PX = 48;

    function qnavUpdateFloat() {
        if (!qnavFloat) return;
        const cTop = chatMessages.getBoundingClientRect().top;
        let found = null;
        const turns = qnavTurns();
        for (let i = 0; i < turns.length; i++) {
            if (turns[i].getBoundingClientRect().top <= cTop + QNAV_ANCHOR_PX) found = turns[i];
            else break;
        }
        qnavCurrent = found;
        const text = found ? (qnavModePrefix(found) + qnavTextOf(found)) : '';
        // bottom > cTop → 질문 버블이 아직 (일부라도) 보인다.
        const stillVisible = found && found.getBoundingClientRect().bottom > cTop + 4;
        if (!text || stillVisible) { qnavFloat.classList.add('d-none'); return; }
        if (qnavFloatText.textContent !== text) qnavFloatText.textContent = text;
        qnavFloat.classList.remove('d-none');
    }

    function qnavRenderList() {
        const turns = qnavTurns();
        qnavCount.textContent = turns.length + (QNAV_I18N.countSuffix || '');
        qnavList.innerHTML = '';
        if (turns.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'p-3 small text-muted';
            empty.textContent = QNAV_I18N.empty;
            qnavList.appendChild(empty);
            return;
        }
        turns.forEach(function (turn, idx) {
            const item = document.createElement('button');
            item.type = 'button';
            item.className = 'list-group-item list-group-item-action question-nav-item d-flex gap-2';
            if (turn === qnavCurrent) item.classList.add('active');
            const time = qnavTimeOf(turn);
            item.innerHTML =
                '<span class="text-muted flex-shrink-0">' + (idx + 1) + '.</span>' +
                '<span class="qn-text flex-grow-1">' + escHtml(qnavModePrefix(turn) + qnavTextOf(turn)) + '</span>' +
                (time ? '<span class="text-muted flex-shrink-0 small">' + escHtml(time) + '</span>' : '');
            item.addEventListener('click', function () {
                qnavJumpTo(turn);
                qnavClosePanel();
            });
            qnavList.appendChild(item);
        });
    }

    function qnavOpenPanel() {
        qnavRenderList();
        qnavPanel.classList.remove('d-none');
        qnavBtn.setAttribute('aria-expanded', 'true');
    }

    function qnavClosePanel() {
        qnavPanel.classList.add('d-none');
        qnavBtn.setAttribute('aria-expanded', 'false');
    }

    /* 질문이 하나도 없는 새 대화에서는 목록 버튼 자체를 감춘다. */
    function qnavSyncButton() {
        const has = qnavTurns().length > 0;
        qnavBtn.classList.toggle('d-none', !has);
        if (!has) qnavClosePanel();
        else if (!qnavPanel.classList.contains('d-none')) qnavRenderList();
    }

    chatMessages.addEventListener('scroll', function () {
        if (qnavTicking) return;
        qnavTicking = true;
        requestAnimationFrame(function () {
            qnavTicking = false;
            qnavUpdateFloat();
        });
    }, { passive: true });

    qnavFloat.addEventListener('click', function () { qnavJumpTo(qnavCurrent); });
    qnavFloat.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); qnavJumpTo(qnavCurrent); }
    });
    qnavBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        if (qnavPanel.classList.contains('d-none')) qnavOpenPanel(); else qnavClosePanel();
    });
    document.getElementById('question-nav-close').addEventListener('click', qnavClosePanel);
    document.addEventListener('click', function (e) {
        if (qnavPanel.classList.contains('d-none')) return;
        if (qnavPanel.contains(e.target) || qnavBtn.contains(e.target)) return;
        qnavClosePanel();
    });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') qnavClosePanel();
    });

    /* 스트리밍/HTMX로 버블이 붙을 때 목록·풍선을 따라가게 한다. subtree:false가 중요 —
       스트리밍 토큰은 답변 버블 '안'에서 일어나므로 여기서는 아무 일도 일어나지 않는다. */
    new MutationObserver(function () {
        qnavSyncButton();
        qnavUpdateFloat();
    }).observe(chatMessages, { childList: true });

    qnavSyncButton();

    scrollToBottom();
    qnavUpdateFloat();
</script>
</th:block>

</body>
</html>
