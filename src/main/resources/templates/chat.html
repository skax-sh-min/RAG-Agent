<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="ko">
<head>
    <title th:text="#{nav.chat}">Chat</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex" style="height: calc(100vh - 56px);">

        <!-- ── Sidebar ──────────────────────────────────────────────── -->
        <div class="sidebar border-end bg-light d-flex flex-column p-3">

            <!-- New chat + version -->
            <div class="d-flex align-items-center gap-2 mb-2">
                <form th:action="@{/ui/chat/new}" method="post" class="flex-grow-1">
                    <button type="submit" class="btn btn-sm btn-primary w-100">
                        <i class="bi bi-plus-lg me-1"></i>
                        <span th:text="#{chat.new}">New Chat</span>
                    </button>
                </form>
                <input id="version-input" type="text" class="form-control form-control-sm"
                       style="width: 80px;"
                       th:value="${version}"
                       th:placeholder="#{chat.version.placeholder}"/>
            </div>

            <!-- Routing strategy selector -->
            <div class="mb-3">
                <label class="form-label small text-muted mb-1" for="routing-mode-select"
                       th:text="#{chat.routing.label}">Routing Strategy</label>
                <select id="routing-mode-select"
                        class="form-select form-select-sm"
                        th:attr="data-thread-id=${threadId}, data-has-thread=${meta != null}">
                    <option value="COST_FIRST"
                            th:selected="${routingMode == 'COST_FIRST'}"
                            th:text="#{routing.cost_first}">Cost First</option>
                    <option value="QUALITY_FIRST"
                            th:selected="${routingMode == 'QUALITY_FIRST'}"
                            th:text="#{routing.quality_first}">Quality First</option>
                    <option value="PROGRESSIVE"
                            th:selected="${routingMode == 'PROGRESSIVE'}"
                            th:text="#{routing.progressive}">Progressive</option>
                    <option value="DUAL"
                            th:selected="${routingMode == 'DUAL'}"
                            th:disabled="${!hasLocalProvider}"
                            th:title="${!hasLocalProvider ? #{routing.requires_local} : ''}"
                            th:text="#{routing.dual}">Parallel Compare</option>
                    <option value="LOCAL_ONLY"
                            th:selected="${routingMode == 'LOCAL_ONLY'}"
                            th:disabled="${!hasLocalProvider}"
                            th:title="${!hasLocalProvider ? #{routing.requires_local} : ''}"
                            th:text="#{routing.local_only}">Local Only</option>
                </select>
            </div>

            <!-- Thread list (HTMX auto-refresh on refreshThreadList event) -->
            <div id="thread-list-wrapper"
                 class="overflow-auto flex-grow-1"
                 th:attr="hx-get=@{/ui/threads(activeThreadId=${threadId})}"
                 hx-trigger="refreshThreadList from:body, refreshThreadListDelayed"
                 hx-target="#thread-list"
                 hx-swap="outerHTML">
                <div th:replace="~{fragments/thread-list :: list}"></div>
            </div>

            <!-- Current thread info -->
            <div th:if="${meta != null}" class="border-top pt-2 mt-2 small">
                <!-- Title -->
                <div id="current-thread-title" class="fw-semibold text-dark text-truncate mb-1"
                     th:text="${meta.title}"></div>
                <!-- Thread ID + copy -->
                <div class="d-flex align-items-center gap-1 mb-2 text-muted font-monospace">
                    <span th:text="${#strings.substring(meta.threadId, 0, 8)}"></span>
                    <button class="btn btn-link btn-sm p-0 text-muted lh-1"
                            th:title="#{chat.copy}"
                            th:onclick="'copyThreadId(this, \'' + ${meta.threadId} + '\')'" >
                        <i class="bi bi-clipboard" style="font-size:0.75rem;"></i>
                    </button>
                </div>
                <!-- Actions -->
                <div class="d-flex gap-1">
                    <button class="btn btn-outline-secondary btn-sm flex-grow-1"
                            th:onclick="'startTitleEdit(\'' + ${meta.threadId} + '\')'" >
                        <i class="bi bi-pencil me-1"></i>
                        <span th:text="#{chat.edit}">Edit</span>
                    </button>
                    <button class="btn btn-outline-danger btn-sm"
                            th:onclick="'deleteCurrentThread(\'' + ${meta.threadId} + '\')'"
                            th:title="#{chat.delete}">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ── Chat area ─────────────────────────────────────────────── -->
        <div class="flex-grow-1 d-flex flex-column overflow-hidden">

            <!-- Previous thread resume banner -->
            <div th:if="${meta != null and historyCount != null and historyCount > 0}"
                 class="alert alert-info rounded-0 mb-0 py-2 small">
                <i class="bi bi-chat-left-dots me-1"></i>
                <strong th:text="${meta.title}"></strong>
                <span th:text="#{chat.resume.label}">Continuing conversation</span> ·
                <span th:text="${historyCount}"></span>
                <span th:text="#{chat.resume.prev}">previous messages</span> ·
                <span th:text="#{chat.resume.hint}">Continue typing below.</span>
            </div>

            <!-- Messages -->
            <div id="chat-messages" class="flex-grow-1 p-3">
                <!-- Server-rendered previous turns (restored from conversation_turns) -->
                <th:block th:if="${turns != null}" th:each="turn : ${turns}">
                    <div class="d-flex justify-content-end mb-3">
                        <div class="bubble-user p-3" th:text="${turn.question}"></div>
                        <i class="bi bi-person-circle fs-5 text-secondary ms-2 mt-1 flex-shrink-0"></i>
                    </div>
                    <div class="d-flex align-items-start mb-3">
                        <i class="bi bi-robot fs-5 text-secondary me-2 mt-1 flex-shrink-0"></i>
                        <div class="bubble-assistant p-3 flex-grow-1">
                            <div class="md-content" th:attr="data-md=${turn.answer}"></div>
                        </div>
                    </div>
                </th:block>
            </div>

            <!-- Typing indicator (outside scroll area, shown during request) -->
            <div id="typing-indicator" class="d-none align-items-center gap-2 px-3 pb-1">
                <i class="bi bi-robot fs-5 text-secondary"></i>
                <div class="bubble-assistant px-3 py-2">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>

            <!-- Input form -->
            <div class="border-top p-3">
                <form id="chat-form"
                      hx-post="/ui/chat"
                      hx-target="#chat-messages"
                      hx-swap="beforeend">
                    <input type="hidden" name="threadId" th:value="${threadId}"/>
                    <input type="hidden" id="form-version" name="version" th:value="${version}"/>
                    <input type="hidden" id="form-routing-mode" name="routingMode" th:value="${routingMode}"/>
                    <div class="input-group">
                        <textarea id="question-input" name="question"
                                  class="form-control"
                                  th:placeholder="#{chat.input.placeholder}"
                                  rows="1"
                                  style="resize: none; overflow-y: hidden;"></textarea>
                        <button id="send-btn" type="submit" class="btn btn-primary">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script>
    const chatMessages    = document.getElementById('chat-messages');
    const typingIndicator = document.getElementById('typing-indicator');
    const chatForm        = document.getElementById('chat-form');
    const questionInput   = document.getElementById('question-input');
    const sendBtn         = document.getElementById('send-btn');

    /* Sync version input → hidden form field */
    document.getElementById('version-input').addEventListener('change', function () {
        document.getElementById('form-version').value = this.value;
    });

    /* Sync routing mode → hidden form field + PATCH thread if it exists */
    document.getElementById('routing-mode-select').addEventListener('change', function () {
        const mode = this.value;
        document.getElementById('form-routing-mode').value = mode;
        if (this.dataset.hasThread === 'true') {
            fetch('/ui/threads/' + this.dataset.threadId + '/routing-mode', {
                method: 'PATCH',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'routingMode=' + encodeURIComponent(mode)
            });
        }
    });

    /* Auto-expand textarea (max 6 lines) */
    function adjustTextarea() {
        questionInput.style.height = 'auto';
        const lineH = parseInt(getComputedStyle(questionInput).lineHeight);
        questionInput.style.height = Math.min(questionInput.scrollHeight, lineH * 6) + 'px';
    }
    questionInput.addEventListener('input', adjustTextarea);

    /* Enter → submit, Shift+Enter → newline */
    questionInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            if (this.value.trim()) chatForm.requestSubmit();
        }
    });

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    /* Before request: optimistic user bubble + clear input */
    chatForm.addEventListener('htmx:beforeRequest', function () {
        const q = questionInput.value.trim();
        if (q) {
            const bubble = document.createElement('div');
            bubble.className = 'd-flex justify-content-end mb-3';
            bubble.innerHTML =
                `<div class="bubble-user p-3">${escHtml(q)}</div>` +
                `<i class="bi bi-person-circle fs-5 text-secondary ms-2 mt-1 flex-shrink-0"></i>`;
            chatMessages.appendChild(bubble);
        }
        questionInput.value = '';
        questionInput.style.height = 'auto';
        sendBtn.disabled = true;
        typingIndicator.classList.remove('d-none');
        typingIndicator.classList.add('d-flex');
        scrollToBottom();
    });

    /* After request: hide indicator, re-enable send, scroll after paint */
    chatForm.addEventListener('htmx:afterRequest', function () {
        typingIndicator.classList.add('d-none');
        typingIndicator.classList.remove('d-flex');
        sendBtn.disabled = false;
        requestAnimationFrame(scrollToBottom);
    });

    /* ── Relative date formatting ──────────────────────────────────── */
    function formatRelativeDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr.replace(' ', 'T'));
        if (isNaN(d)) return dateStr;
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);
        const dStart = new Date(d);
        dStart.setHours(0, 0, 0, 0);
        const diff = Math.round((todayStart - dStart) / 86400000);
        if (diff === 0) return /*[[#{date.today}]]*/ 'Today';
        if (diff === 1) return /*[[#{date.yesterday}]]*/ 'Yesterday';
        return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
    }

    function applyRelativeDates() {
        document.querySelectorAll('.thread-date[data-date]').forEach(el => {
            el.textContent = formatRelativeDate(el.getAttribute('data-date'));
        });
    }
    applyRelativeDates();
    document.body.addEventListener('htmx:afterSettle', applyRelativeDates);

    /* ── Thread ID copy ────────────────────────────────────────────── */
    function copyThreadId(btn, id) {
        navigator.clipboard.writeText(id).then(() => {
            const icon = btn.querySelector('i');
            if (icon) {
                icon.className = 'bi bi-check';
                setTimeout(() => { icon.className = 'bi bi-clipboard'; }, 1500);
            }
        });
    }

    /* ── Inline title edit ─────────────────────────────────────────── */
    function startTitleEdit(threadId) {
        const titleEl = document.getElementById('current-thread-title');
        if (!titleEl || titleEl.tagName === 'INPUT') return;
        const current = titleEl.textContent.trim();
        const input = document.createElement('input');
        input.type = 'text';
        input.value = current;
        input.className = 'form-control form-control-sm mb-1';
        titleEl.replaceWith(input);
        input.focus();
        input.select();
        let done = false;

        function commit(save) {
            if (done) return;
            done = true;
            const newTitle = save ? (input.value.trim() || current) : current;
            const el = document.createElement('div');
            el.id = 'current-thread-title';
            el.className = 'fw-semibold text-dark text-truncate mb-1';
            el.textContent = newTitle;
            input.replaceWith(el);
            if (save && newTitle !== current) {
                fetch(`/ui/threads/${threadId}/title`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'title=' + encodeURIComponent(newTitle)
                }).then(() => {
                    const item = document.getElementById('thread-' + threadId);
                    if (item) {
                        const t = item.querySelector('.text-truncate');
                        if (t) t.textContent = newTitle;
                    }
                });
            }
        }

        input.addEventListener('blur', () => commit(true));
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); commit(true); }
            if (e.key === 'Escape') { e.preventDefault(); commit(false); }
        });
    }

    /* ── Delete current thread ─────────────────────────────────────── */
    function deleteCurrentThread(threadId) {
        if (!confirm(I18N.deleteConfirmThread)) return;
        fetch(`/ui/threads/${threadId}`, { method: 'DELETE' })
            .then(r => { if (r.ok) window.location.href = '/'; })
            .catch(() => showToast(I18N.requestFailed, 'danger'));
    }

    /* ── 5초 지연 2차 갱신 (LLM 비동기 제목 반영) ───────────────────── */
    document.body.addEventListener('refreshThreadList', function () {
        const wrapper = document.getElementById('thread-list-wrapper');
        if (wrapper) setTimeout(() => htmx.trigger(wrapper, 'refreshThreadListDelayed'), 5000);
    });

    /* ── 서버 렌더 이전 turn 마크다운 처리 + syntax highlight + 초기 스크롤 ── */
    document.querySelectorAll('.md-content[data-md]').forEach(function (el) {
        const raw = el.dataset.md || '';
        if (typeof marked === 'undefined') { el.textContent = raw; delete el.dataset.md; return; }
        const html = marked.parse(raw);
        el.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(html) : html;
        if (typeof hljs !== 'undefined') {
            el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        }
        delete el.dataset.md;
    });
    scrollToBottom();
</script>
</th:block>

</body>
</html>
