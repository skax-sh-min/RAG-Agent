<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      lang="ko">
<head>
    <title th:text="#{nav.chat}">Chat</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex chat-shell">

        <!-- ── Sidebar (offcanvas drawer < md, static column ≥ md) ──────── -->
        <div class="sidebar border-end bg-light d-flex flex-column p-3 offcanvas-md offcanvas-start"
             id="threadDrawer" tabindex="-1"
             th:attr="aria-label=#{chat.threads.aria}" aria-label="Conversations">

            <!-- Drawer header (mobile only) -->
            <div class="offcanvas-header d-md-none px-0 pt-0 pb-2 mb-2 border-bottom">
                <h6 class="offcanvas-title mb-0 fw-semibold" th:text="#{chat.threads.title}">Conversations</h6>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas"
                        data-bs-target="#threadDrawer"
                        th:attr="aria-label=#{action.close}" aria-label="Close"></button>
            </div>


            <!-- New chat -->
            <div class="d-flex align-items-center gap-2 mb-2">
                <form th:action="@{/ui/chat/new}" method="post" class="flex-grow-1">
                    <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
                           th:value="${_csrf != null ? _csrf.token : ''}"/>
                    <button type="submit" class="btn btn-sm btn-primary w-100">
                        <i class="bi bi-plus-lg me-1"></i>
                        <span th:text="#{chat.new}">New Chat</span>
                    </button>
                </form>
            </div>

            <!-- Routing strategy selector — meaningless when the deployment default is
                 LOCAL_ONLY (LLM_ROUTING_MODE=LOCAL_ONLY, the operator's local-only-mode
                 setting), so hidden entirely there -->
            <div class="mb-3" th:if="${!localOnlyDeployment}">
                <label class="form-label small text-muted mb-1" for="routing-mode-select"
                       th:text="#{chat.routing.label}">Routing Strategy</label>
                <select id="routing-mode-select"
                        class="form-select form-select-sm"
                        th:attr="data-thread-id=${threadId}, data-has-thread=${meta != null}">
                    <option value="COST_FIRST"
                            th:selected="${routingMode == 'COST_FIRST'}"
                            th:text="#{routing.cost_first}">Cost First</option>
                    <option value="QUALITY_FIRST"
                            th:selected="${routingMode == 'QUALITY_FIRST'}"
                            th:text="#{routing.quality_first}">Quality First</option>
                    <option value="PROGRESSIVE"
                            th:selected="${routingMode == 'PROGRESSIVE'}"
                            th:text="#{routing.progressive}">Progressive</option>
                    <option value="LOCAL_ONLY"
                            th:with="reqLocal=#{routing.requires_local}"
                            th:selected="${routingMode == 'LOCAL_ONLY'}"
                            th:disabled="${!hasLocalProvider}"
                            th:title="${!hasLocalProvider ? reqLocal : ''}"
                            th:text="#{routing.local_only}">Local Only</option>
                </select>
            </div>

            <!-- Thread list (HTMX auto-refresh on refreshThreadList event) -->
            <div id="thread-list-wrapper"
                 class="overflow-auto flex-grow-1"
                 th:attr="hx-get=@{/ui/threads(activeThreadId=${threadId})}"
                 hx-trigger="refreshThreadList from:body, refreshThreadListDelayed"
                 hx-target="#thread-list"
                 hx-swap="outerHTML">
                <div th:replace="~{fragments/thread-list :: list}"></div>
            </div>

            <!-- Current thread info -->
            <div th:if="${meta != null}" class="border-top pt-2 mt-2 small">
                <!-- Title -->
                <div id="current-thread-title" class="fw-semibold text-dark text-truncate mb-1"
                     th:text="${meta.title}"></div>
                <!-- Thread ID + copy -->
                <div class="d-flex align-items-center gap-1 mb-2 text-muted font-monospace">
                    <!-- 8자 자르기를 템플릿에서 하지 않는다: 8자보다 짧은 id(레거시 "default" 등)에서
                         #strings.substring 이 예외를 던져 채팅 페이지 전체가 500으로 죽었다. -->
                    <span th:text="${meta.shortThreadId}"></span>
                    <button class="btn btn-link btn-sm p-0 text-muted lh-1"
                            th:title="#{chat.copy}"
                            th:attr="data-thread-id=${meta.threadId}"
                            onclick="copyThreadId(this, this.dataset.threadId)" >
                        <i class="bi bi-clipboard" style="font-size:0.75rem;"></i>
                    </button>
                </div>
                <!-- Actions -->
                <div class="d-flex gap-1">
                    <button class="btn btn-outline-secondary btn-sm flex-grow-1"
                            th:attr="data-thread-id=${meta.threadId}"
                            onclick="startTitleEdit(this.dataset.threadId)" >
                        <i class="bi bi-pencil me-1"></i>
                        <span th:text="#{chat.edit}">Edit</span>
                    </button>
                    <button class="btn btn-outline-danger btn-sm"
                            th:attr="data-thread-id=${meta.threadId}"
                            onclick="deleteCurrentThread(this.dataset.threadId)"
                            th:title="#{chat.delete}">
                        <i class="bi bi-trash"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ── Chat area ─────────────────────────────────────────────── -->
        <div class="flex-grow-1 d-flex flex-column overflow-hidden position-relative">

            <!-- Mobile top bar (hamburger → opens thread drawer) -->
            <div class="d-flex d-md-none align-items-center gap-2 border-bottom p-2">
                <button type="button" class="btn btn-outline-secondary btn-sm btn-icon"
                        data-bs-toggle="offcanvas" data-bs-target="#threadDrawer"
                        aria-controls="threadDrawer"
                        th:attr="aria-label=#{chat.threads.open}" aria-label="Open conversations">
                    <i class="bi bi-list fs-5"></i>
                </button>
                <span class="fw-semibold text-truncate"
                      th:text="${meta != null} ? ${meta.title} : #{chat.new}">New Chat</span>
            </div>

            <!-- Previous thread resume banner -->
            <div th:if="${meta != null and historyCount != null and historyCount > 0}"
                 class="alert alert-info rounded-0 mb-0 py-2 small">
                <i class="bi bi-chat-left-dots me-1"></i>
                <strong th:text="${meta.title}"></strong>
                <span th:text="#{chat.resume.label}">Continuing conversation</span> ·
                <span th:text="${historyCount}"></span>
                <span th:text="#{chat.resume.prev}">previous messages</span> ·
                <strong th:text="#{chat.resume.hint}">Continue typing below.</strong>
            </div>

            <!-- Messages
                 .chat-messages-wrap는 순전히 위치 기준(positioning context)용 래퍼다 —
                 현재 질문 풍선(#current-question-float)은 스크롤과 무관하게 목록 상단에
                 고정돼야 하는데, 스크롤 컨테이너(#chat-messages) 안에 absolute로 두면
                 내용과 함께 흘러가 버린다. 바깥 채팅 영역(.position-relative)에 걸면
                 이번엔 상단바/이어가기 배너 위에 얹혀 버린다. -->
            <div class="chat-messages-wrap position-relative d-flex flex-column flex-grow-1 overflow-hidden">
            <div id="chat-messages" class="flex-grow-1 p-3">
                <!-- Server-rendered previous turns (restored from conversation_turns) -->
                <th:block th:if="${turns != null}" th:each="turn : ${turns}">
                    <!-- .user-turn + data-question: 질문 내비게이션(현재 질문 풍선 / 전체 질문
                         목록)이 읽는 유일한 표식. 스트리밍 경로의 chat-stream.js
                         appendUserBubble()도 같은 표식을 심는다 — 한쪽만 고치면 새로 보낸
                         질문이 목록에서 빠진다. -->
                    <!-- data-response-mode: 질문 내비게이션이 같은 표기를 다시 만들 수 있도록 심는다.
                         data-question 은 질문 '원본'만 담는다 — 표기를 그 안에 섞으면 추천/재사용처럼
                         질문 텍스트를 그대로 쓰는 소비자에게 대괄호가 함께 딸려간다. -->
                    <div class="d-flex justify-content-end mb-3 align-items-end user-turn"
                         th:attr="data-question=${turn.question},data-response-mode=${turn.responseModeLabel}">
                        <div class="me-1">
                            <div class="bubble-user p-3">
                                <div><span class="bubble-user-mode"
                                           th:text="'[' + ${turn.responseModeLabel} + '] '">[RN] </span><span
                                        th:text="${turn.question}"></span></div>
                                <small class="text-white bubble-user-time msg-time"
                                       th:if="${turn.askedAt != null}"
                                       th:attr="data-utc-time=${turn.askedAt}">🕐</small>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex align-items-end mb-3">
                        <div class="bubble-assistant p-3 flex-grow-1">
                            <!-- 저장해 둔 검증 결과 배지 (§6.24 Step 4-b) — 문구·색·툴팁 판단은 전부
                                 VerificationSnapshot 한 곳에 있다(message-assistant.html 과 같은 레코드를
                                 읽는다). 맵에 없는 턴은 검증 기록이 없는 턴이고, 그 경우 이 컬럼이
                                 생기기 전과 똑같이 아무것도 띄우지 않는다. -->
                            <th:block th:with="v=${verificationByTurnId != null ? verificationByTurnId[turn.id] : null}">
                                <span th:if="${v != null and v.verdictLabel != null}"
                                      class="badge mb-2"
                                      th:classappend="${v.verdictClass}"
                                      th:attr="title=${v.verdictTitle}"
                                      th:style="${v.verdictTitle != null} ? 'cursor:help;' : ''"
                                      th:text="${v.verdictLabel}"></span>
                                <span th:if="${v != null and v.hasInventedSymbols}"
                                      class="badge bg-warning text-dark ms-1 mb-2" style="cursor:help;"
                                      th:attr="title=${v.inventedSymbolsText}">문서 밖 이름
                                    <span th:text="${#lists.size(v.inventedSymbols)}"></span></span>
                            </th:block>
                            <div class="md-content" th:attr="data-md=${turn.answer}"></div>

                            <th:block th:with="v=${verificationByTurnId != null ? verificationByTurnId[turn.id] : null}">
                                <div th:if="${v != null and v.showsEvalReasonLine}" class="small text-warning mt-2">
                                    <i class="bi bi-exclamation-triangle me-1"></i>검증 미통과 사유:
                                    <span th:text="${v.evalReason}"></span>
                                </div>
                                <div th:if="${v != null and v.hasInventedSymbols}" class="small text-warning mt-2">
                                    <i class="bi bi-exclamation-triangle me-1"></i>문서에서 확인되지 않은 이름:
                                    <span th:text="${v.inventedSymbolsText}"></span>
                                </div>
                                <div th:if="${v != null and v.envNote != null}" class="small text-info mt-2">
                                    <i class="bi bi-info-circle me-1"></i>환경에 따라 달라질 수 있는 값:
                                    <span th:text="${v.envNote}"></span>
                                </div>
                                <div th:if="${v != null and v.budgetNote != null}" class="small text-warning mt-2">
                                    <i class="bi bi-scissors me-1"></i>
                                    <span th:text="${v.budgetNote}"></span>
                                </div>
                                <!-- §10.12 — 저장해 둔 검색어 재작성. 질문 버블에는 원문이 떠 있어
                                     이 줄이 없으면 새로고침 후 원인을 짚을 방법이 없다. 진단값이라
                                     기본 숨김(아래 RETRIEVAL_METRICS_ENABLED 가 벗긴다). -->
                                <div th:if="${v != null and v.hasCondensedQuestion()}"
                                     class="condensed-question small text-muted mt-2 d-none">
                                    <i class="bi bi-search me-1"></i>검색에 사용된 질문:
                                    <span th:text="${v.condensedQuestion}"></span>
                                </div>
                            </th:block>

                               <div th:if="${turnImageRefsByTurnId != null and turnImageRefsByTurnId[turn.id] != null and !#lists.isEmpty(turnImageRefsByTurnId[turn.id])}"
                                   class="mt-2 d-flex flex-wrap gap-2">
                                  <a th:each="ref : ${turnImageRefsByTurnId[turn.id]}"
                                    href="#"
                                    class="chat-image-thumb"
                                    th:attr="data-image-ref=${ref},data-turn-id=${turn.id}">
                                     <img th:src="@{'/api/v1/' + ${ref}}"
                                         alt="참조 이미지"
                                         style="max-height:120px; max-width:180px; object-fit:contain; border:1px solid var(--border-default, #dee2e6); border-radius:4px;"
                                         loading="lazy" />
                                  </a>
                               </div>

                                     <div th:if="${turnSourcesByTurnId != null and turnSourcesByTurnId[turn.id] != null and !#lists.isEmpty(turnSourcesByTurnId[turn.id])}"
                                            class="mt-2">
                                          <!-- 배지와 그 수치는 .source-item 한 단위로 묶는다 —
                                               느슨한 inline 형제로 두면 줄바꿈이 배지와 수치 사이에서
                                               일어나 수치가 다음 배지 것처럼 읽힌다(chat-stream.js와 동일). -->
                                          <!-- data-turn-id/data-answer-share: 원문 보기 모달의 "이 청크 제거"
                                               버튼이 어느 턴의 어느 출처인지와 응답 참여도 0% 여부를
                                               판단하는 키. 스트리밍 경로는 chat-stream.js가 같은 값을 심는다. -->
                                          <span class="source-item" th:each="src : ${turnSourcesByTurnId[turn.id]}"
                                                th:attr="data-turn-id=${turn.id},data-share=${src.answerShare}">
                                          <a href="#"
                                              class="source-ref badge bg-secondary text-decoration-none"
                                              th:text="${src.label}"
                                              th:attr="data-bs-toggle='popover',
                                                          data-bs-trigger='hover focus',
                                                          data-bs-placement='top',
                                                          data-preview-md=${src.preview},
                                                          data-chunk-id=${src.chunkId}"></a><!--
                                          --><!-- 청크 변경 표시 — 배지 문구와 표시 여부 판단은
                                               SourceRef.staleBadge()가 전부 갖고 있다(삭제는 항상,
                                               수정은 응답 지분이 있는 출처만). 템플릿에 조건을 풀어
                                               쓰면 스트리밍/HTMX 경로와 규칙이 갈라진다. -->
                                          <span th:if="${src.promptExcluded}"
                                                class="badge ms-1 bg-secondary-subtle text-secondary-emphasis border border-secondary-subtle"
                                                style="font-size:0.62rem; vertical-align:middle; cursor:help;"
                                                th:title="'컨텍스트 한도로 이 출처는 답변 생성에 사용되지 않았습니다. 모델이 읽지 못한 문서이므로 답변이 이 내용을 반영하지 못했을 수 있습니다.'">미사용</span>
                                          <span th:if="${src.staleBadge != null}"
                                                class="badge ms-1"
                                                style="font-size:0.62rem; vertical-align:middle;"
                                                th:classappend="${src.staleStatus == 'deleted'}
                                                    ? 'bg-danger-subtle text-danger-emphasis border border-danger-subtle'
                                                    : 'bg-warning-subtle text-warning-emphasis border border-warning-subtle'"
                                                th:text="${src.staleBadge}"
                                                th:title="${src.staleStatus == 'deleted'}
                                                    ? '이 답변을 만든 뒤 출처 청크가 삭제되었습니다. 내용이 현재 문서와 다를 수 있습니다.'
                                                    : '이 답변을 만든 뒤 출처 청크가 수정되었습니다. 내용이 현재 문서와 다를 수 있습니다.'"></span>
                                          <!-- 저장해 둔 검색 진단 수치(3단계) 복원 — 표시 규칙은
                                               스트리밍/HTMX 경로와 동일: 유사도 우선, 없으면 축 표기.
                                               기본은 숨김이고 아래 스크립트가 토글에 따라 해제한다. -->
                                          <span class="source-metrics text-muted d-none" style="font-size:0.72rem;"
                                                th:if="${src.similarity != null or src.axisRanks != null or src.answerShare != null}">
                                              <span th:if="${src.similarity != null}"
                                                    th:text="'유사도 ' + ${#numbers.formatDecimal(src.similarity, 1, 2)}"></span>
                                              <span th:if="${src.similarity == null and src.axisRanks != null}"
                                                    th:text="${src.axisRanks}"></span>
                                              <strong th:if="${src.answerShare != null}"
                                                      th:text="${(src.similarity != null or src.axisRanks != null) ? ' · ' : ''}
                                                               + '응답 ' + ${#numbers.formatDecimal(src.answerShare * 100, 1, 0)} + '%'"></strong>
                                          </span>
                                          </span>
                                     </div>

                            <!-- Feedback (like/dislike) + Metadata, same line -->
                            <div class="mt-1 d-flex align-items-center flex-wrap gap-2">
                                <div class="feedback-controls d-flex gap-1"
                                     th:attr="data-turn-id=${turn.id},data-thread-id=${threadId}">
                                    <button type="button" class="btn btn-sm feedback-btn" data-feedback="LIKE"
                                            th:if="${turn.proposable}"
                                            th:classappend="${turn.feedback == 'LIKE'} ? 'btn-primary' : 'btn-outline-secondary'"
                                            th:attr="aria-label=#{feedback.like},title=#{feedback.like}">👍</button>
                                    <!-- 좋아요가 지식 제안을 열어 주지 않는 모드(S). 이전에 눌린 LIKE
                                         기록이 남아 있어도 강조하지 않는다 — 그 좋아요는 아무것도 만든
                                         적이 없으므로, 기여 중인 것처럼 칠하는 것이 여기서 고치려는
                                         거짓말이다. -->
                                    <button type="button" class="btn btn-sm btn-outline-secondary feedback-btn opacity-50"
                                            th:unless="${turn.proposable}" disabled
                                            th:attr="aria-label=#{${turn.submissionBlockedMessageKey}},
                                                     title=#{${turn.submissionBlockedMessageKey}}">👍</button>
                                    <button type="button" class="btn btn-sm feedback-btn" data-feedback="DISLIKE"
                                            th:classappend="${turn.feedback == 'DISLIKE'} ? 'btn-danger' : 'btn-outline-secondary'"
                                            th:attr="aria-label=#{feedback.dislike},title=#{feedback.dislike}">👎</button>
                                    <!-- §10.11 — 채팅은 감상만 다룬다. 큐레이션 상태(연필·임베딩 실패
                                         배지)는 여기 있지 않다: 등록·수정·철회가 전부 지식 제안 페이지에서
                                         일어나므로, 두 화면이 같은 것을 서로 다르게 말할 자리를 없앴다. -->
                                </div>
                                <div class="text-muted"
                                     style="font-size:0.68rem;"
                                     th:if="${turn.provider != null or turn.answeredAt != null}">
                                    <span th:if="${turn.provider != null}">🤖 <span th:text="${turn.provider}"></span> &nbsp;·&nbsp;</span>
                                    <span th:if="${turn.elapsedMs > 0}">⏱ <span th:text="${#numbers.formatDecimal(turn.elapsedMs / 1000.0, 1, 1)}"></span>s &nbsp;·&nbsp;</span>
                                    <span th:if="${turn.inputTokens > 0 or turn.outputTokens > 0}">
                                        📥 <span th:text="${turn.inputTokens}"></span>
                                        &nbsp;·&nbsp;
                                        📤 <span th:text="${turn.outputTokens}"></span>
                                        &nbsp;·&nbsp;
                                        합계 <span th:text="${turn.inputTokens + turn.outputTokens}"></span> tok
                                        &nbsp;·&nbsp;
                                    </span>
                                    <span th:if="${turn.llmCalls > 0}">🔄 <span th:text="${turn.llmCalls}"></span> &nbsp;·&nbsp;</span>
                                    <span>📝 <span th:text="${#strings.length(turn.answer)}"></span>자 &nbsp;·&nbsp;</span>
                                    <span class="msg-time"
                                          th:if="${turn.answeredAt != null}"
                                          th:attr="data-utc-time=${turn.answeredAt}">🕐</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </th:block>
            </div>

            <!-- 현재 질문 풍선 — 답변이 길어 질문이 위로 밀려났을 때만(질문 버블이 목록
                 상단 밖으로 나갔을 때) 나타난다. 클릭하면 그 질문 위치로 되돌아간다. -->
            <div id="current-question-float" class="current-question-float d-none"
                 role="button" tabindex="0"
                 th:attr="title=#{chat.question.jump},aria-label=#{chat.question.current}">
                <i class="bi bi-chat-quote-fill flex-shrink-0 mt-1"></i>
                <span class="cq-text" id="current-question-float-text"></span>
            </div>
            </div><!-- /.chat-messages-wrap -->

            <!-- 전체 질문 보기 — '맨 아래로' 버튼 바로 위. 열면 이 대화의 질문 목록이
                 풍선 창으로 뜨고, 항목을 누르면 그 질문으로 이동한다. -->
            <button type="button" id="question-nav-btn"
                    class="btn btn-secondary question-nav-btn d-none"
                    th:attr="aria-label=#{chat.questions.title},title=#{chat.questions.title}"
                    aria-expanded="false">
                <i class="bi bi-list-ul"></i>
            </button>
            <div id="question-nav-panel" class="question-nav-panel card d-none">
                <div class="card-header py-2 d-flex align-items-center gap-2">
                    <span class="small fw-semibold" th:text="#{chat.questions.title}">전체 질문 보기</span>
                    <span id="question-nav-count" class="badge bg-secondary"></span>
                    <button type="button" class="btn-close btn-sm ms-auto" id="question-nav-close"
                            th:attr="aria-label=#{action.close}"></button>
                </div>
                <div class="list-group list-group-flush question-nav-list" id="question-nav-list"></div>
            </div>

            <!-- Jump-to-latest: shown when the user scrolls up (e.g. to read earlier content
                 while an answer is streaming); auto-scroll is suppressed until they return. -->
            <button type="button" id="scroll-to-bottom-btn"
                    class="btn btn-secondary scroll-to-bottom-btn d-none"
                    th:attr="aria-label=#{chat.scroll.bottom},title=#{chat.scroll.bottom}"
                    aria-label="Jump to latest">
                <i class="bi bi-arrow-down"></i>
            </button>

            <!-- Typing indicator (outside scroll area, shown during request) -->
            <div id="typing-indicator" class="d-none align-items-center gap-2 px-3 pb-1">
                <div class="bubble-assistant px-3 py-2">
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                    <span class="typing-dot"></span>
                </div>
            </div>

            <!-- Input form -->
            <div class="border-top p-3 chat-input-bar">
                <form id="chat-form"
                      hx-post="/ui/chat"
                      hx-target="#chat-messages"
                      hx-swap="beforeend">
                    <input type="hidden" name="threadId" th:value="${threadId}"/>
                    <input type="hidden" id="form-version" name="version" th:value="${version}"/>
                    <input type="hidden" id="form-routing-mode" name="routingMode" th:value="${routingMode}"/>
                    <input type="hidden" id="form-direct-mode" name="directMode" value="false"/>
                    <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                        <!-- 버전: 하나만 선택 -->
                        <div class="input-group input-group-sm w-auto">
                            <span class="input-group-text">Version</span>
                            <select id="version-input" class="form-select" style="max-width: 100px;">
                                <option th:value="${version}" th:text="${version}" selected>latest</option>
                            </select>
                        </div>

                        <!-- 검색 스코프 태그: 칩으로만 선택한다(별도 입력창 없음).
                             칩 토글 결과는 이 hidden 필드에 쉼표로 모여 폼/SSE로 전송된다. -->
                        <input type="hidden" id="chat-tags-input" name="tags"/>
                        <div id="chat-tag-suggest" class="d-none d-flex flex-wrap align-items-center gap-1">
                            <span id="chat-tag-suggest-chips" class="d-inline-flex flex-wrap gap-1"></span>
                        </div>

                        <div class="flex-grow-1"></div>

                        <!-- 응답 모드 S/N/C 토글 — 답변의 성격 (기본 N). PLAN §6.24: L은 N과 구분되지
                             않아 제거했고(같은 검색 재료를 받으므로 길이도 같았다), C(응용)는 길이가
                             아니라 근거 엄격도 축이다 — 문서를 재료로 코드·설정을 만들어낸다.
                             C는 검색 결과가 전제라 Direct와 배타다: 아래 스크립트가 버튼을 비활성화하고,
                             서버도 같은 규칙을 독립적으로 건다(ChatForm/ChatRequest — 구 L은 서버 가드가
                             없어 손으로 만든 요청이 통과했다).
                             툴팁은 네이티브 title(브라우저 기본 지연 ~1.5s)이 아니라 Bootstrap Tooltip(짧은 delay)로 표시 — 하단 스크립트에서 초기화. -->
                        <span class="small text-muted" th:text="#{chat.response.group.label}">응답옵션</span>
                        <div id="response-mode-group" class="btn-group btn-group-sm" role="group"
                             th:attr="aria-label=#{chat.response.tooltip}">
                            <input type="radio" class="btn-check" name="response-mode-radio"
                                   id="response-mode-s" value="S" autocomplete="off"/>
                            <label class="btn btn-outline-secondary response-mode-btn" for="response-mode-s"
                                   data-bs-toggle="tooltip" th:title="#{chat.response.s}">S</label>

                            <input type="radio" class="btn-check" name="response-mode-radio"
                                   id="response-mode-n" value="N" checked autocomplete="off"/>
                            <label class="btn btn-outline-secondary response-mode-btn" for="response-mode-n"
                                   data-bs-toggle="tooltip" th:title="#{chat.response.n}">N</label>

                            <!-- C는 운영자가 /settings 에서 끌 수 있다(app.llm.creative-mode-enabled).
                                 꺼진 배포에서는 비활성이 아니라 **아예 렌더하지 않는다** — 사용자가
                                 영영 켤 수 없는 회색 버튼이 입력창에 상주할 이유가 없다. 아래 스크립트가
                                 이 요소의 부재를 견디고, 서버도 같은 판정을 독립적으로 건다
                                 (SettingsService.effectiveResponseMode). -->
                            <th:block th:if="${creativeModeEnabled}">
                            <input type="radio" class="btn-check" name="response-mode-radio"
                                   id="response-mode-c" value="C" autocomplete="off"/>
                            <label class="btn btn-outline-secondary response-mode-btn" for="response-mode-c"
                                   data-bs-toggle="tooltip" th:title="#{chat.response.c}">C</label>
                            </th:block>
                        </div>
                        <input type="hidden" id="form-response-mode" name="responseMode" value="N"/>
                    </div>
                    <div id="question-suggest-box" class="list-group mb-1 d-none" style="max-height: 220px; overflow:auto;"></div>
                    <div class="input-group">
                        <textarea id="question-input" name="question"
                                  class="form-control"
                                  th:placeholder="#{chat.input.placeholder}"
                                  rows="1"
                                  style="resize: none; overflow-y: hidden;"></textarea>
                        <!-- RAG / Direct LLM 토글 -->
                        <span class="input-group-text bg-body border-start-0 px-2"
                              id="direct-mode-wrapper"
                              th:title="#{chat.direct.tooltip}">
                            <div class="form-check form-switch mb-0 d-flex align-items-center gap-1">
                                <input class="form-check-input mt-0" type="checkbox"
                                       id="direct-mode-toggle" role="switch"
                                       style="cursor:pointer;"/>
                                <label class="form-check-label small text-muted mb-0"
                                       for="direct-mode-toggle"
                                       id="direct-mode-label"
                                       style="cursor:pointer; white-space:nowrap;"
                                       th:text="#{chat.direct.label.rag}">RAG</label>
                            </div>
                        </span>
                        <button id="send-btn" type="submit" class="btn btn-primary btn-icon"
                                th:data-send-label="#{chat.send}" th:data-stop-label="#{chat.stop}"
                                th:attr="aria-label=#{chat.send}" aria-label="Send">
                            <i class="bi bi-send-fill"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="modal fade" id="chatImageModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-body p-2 text-center bg-dark">
                    <img id="chat-image-modal-img" src="" alt="확대 이미지"
                         style="max-width:100%; max-height:75vh; object-fit:contain;" />
                </div>
                <div class="modal-footer py-2">
                    <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal"
                            th:text="#{action.close}">닫기</button>
                    <button type="button" class="btn btn-sm btn-outline-danger" id="chat-image-exclude-btn"
                            th:text="#{chat.image.exclude}">대화에서 제외하기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 청크 원문 보기: 출처 배지 클릭 시 (호버 미리보기와 별개) 잘리지 않은 전체 청크 내용을
         이미지 포함해서 보여준다. -->
    <div class="modal fade" id="chunkFullTextModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable modal-lg">
            <div class="modal-content">
                <div class="modal-header py-2">
                    <h6 class="modal-title small fw-semibold mb-0" id="chunk-fulltext-modal-title"
                        th:text="#{chat.chunk.title}">원문 보기</h6>
                    <!-- 두 버튼을 래퍼로 묶어 래퍼에만 ms-auto를 건다. .modal-header에는
                         justify-content가 없고, X가 오른쪽 끝에 붙는 것은 순전히 Bootstrap의
                         `.modal-header .btn-close { margin-left: auto }` 덕분이다 — 그래서
                         btn-close의 여백은 손대면 안 된다(m-0으로 지웠더니 제거 버튼이 숨겨진
                         경우 X가 제목 바로 옆으로 딸려 왔다). 래퍼는 내용 너비라 그 안의
                         auto 여백은 남는 공간이 없어 무해하고, X를 헤더 패딩 안쪽으로 당기는
                         음수 여백은 그대로 살아 있다. -->
                    <div class="d-flex align-items-center gap-2 ms-auto">
                        <!-- 응답 참여도가 0%인 출처에만 노출된다(스크립트가 d-none을 토글). 답변에
                             쓰이지 않은 청크를 그 대화의 출처 목록에서 치우는 표시 전용 동작이라
                             닫기 버튼 옆(왼쪽)에 두고, 문서/검색에는 영향이 없다. -->
                        <button type="button" class="btn btn-sm btn-outline-danger d-none"
                                id="chunk-exclude-btn"
                                th:text="#{chat.chunk.exclude}">현재 대화에서 이 청크 제거</button>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="md-content" id="chunk-fulltext-modal-body"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block layout:fragment="scripts">
<script th:src="@{/js/chat-stream.js}" defer></script>
<!-- th:inline="javascript" 필수 — 이 블록은 `/*[[${x}]]*/ 기본값` 패턴을 여러 곳에서 쓴다.
     이 속성이 없으면 Thymeleaf가 표현식을 텍스트 모드로 처리해 **값을 주석 안에 써 넣고**
     뒤의 기본값이 그대로 살아남는다(`const X = /*true*/ false;`) — 문법 오류가 아니라서
     조용히 항상 기본값으로 동작한다. admin/documents/base/curated-submissions.html은
     이미 이 속성을 갖고 있었고 chat.html만 빠져 있었다. -->
<script th:inline="javascript">
    const chatMessages    = document.getElementById('chat-messages');
    const typingIndicator = document.getElementById('typing-indicator');
    const chatForm        = document.getElementById('chat-form');
    const questionInput   = document.getElementById('question-input');
    const sendBtn         = document.getElementById('send-btn');
    const directToggle    = document.getElementById('direct-mode-toggle');
    const directLabel     = document.getElementById('direct-mode-label');
    const directModeInput = document.getElementById('form-direct-mode');
    const suggestBox      = document.getElementById('question-suggest-box');
    let suggestTimer      = null;
    let suggestSeq        = 0;
    const SOURCE_PREVIEW_ENABLED = /*[[${sourcePreviewEnabled}]]*/ true;
    window.isSourcePreviewEnabled = function () {
        return !!SOURCE_PREVIEW_ENABLED;
    };
    const RETRIEVAL_METRICS_ENABLED = /*[[${retrievalMetricsEnabled}]]*/ false;
    window.isRetrievalMetricsEnabled = function () {
        return !!RETRIEVAL_METRICS_ENABLED;
    };
    /* 서버가 렌더한 이전 turn들의 진단 수치 노출 — 이 페이지는 message-assistant 프래그먼트가
       아니라 자체 마크업으로 이전 turn을 그리므로(§복원 경로), 해제 처리도 여기서 한다. */
    if (RETRIEVAL_METRICS_ENABLED) {
        document.querySelectorAll('.source-metrics.d-none, .condensed-question.d-none').forEach(function (el) {
            el.classList.remove('d-none');
        });
    }
    const imageModalEl = document.getElementById('chatImageModal');
    const imageModal = imageModalEl ? bootstrap.Modal.getOrCreateInstance(imageModalEl) : null;
    const imageModalImg = document.getElementById('chat-image-modal-img');
    const imageExcludeBtn = document.getElementById('chat-image-exclude-btn');
    let activeImageContext = null;

    /* 청크 원문 보기 — 출처 배지 클릭. 배지의 호버 미리보기(항상 잘린 텍스트, 이미지 제거)와
       달리 전체 청크 원문을 이미지 포함해서 보여준다. 서버·스트리밍 렌더 배지 모두 document
       레벨 위임으로 한 번에 처리한다(.chat-image-thumb 클릭 위임과 동일한 패턴) — 스트리밍으로
       나중에 추가된 배지에도 별도 바인딩 없이 그대로 적용된다. */
    const chunkFullTextModalEl = document.getElementById('chunkFullTextModal');
    const chunkFullTextModal = chunkFullTextModalEl ? bootstrap.Modal.getOrCreateInstance(chunkFullTextModalEl) : null;
    const chunkFullTextModalTitle = document.getElementById('chunk-fulltext-modal-title');
    const chunkFullTextModalBody  = document.getElementById('chunk-fulltext-modal-body');
    const CHUNK_TITLE_DEFAULT = /*[[#{chat.chunk.title}]]*/ '원문 보기';
    const CHUNK_LOADING_TEXT  = /*[[#{chat.chunk.loading}]]*/ '불러오는 중...';
    const CHUNK_NOTFOUND_TEXT = /*[[#{chat.chunk.notfound}]]*/ '청크를 찾을 수 없습니다.';
    const CHUNK_ERROR_TEXT    = /*[[#{chat.chunk.error}]]*/ '불러오는 중 오류가 발생했습니다.';
    const CHUNK_EXCLUDE_FAILED = /*[[#{chat.chunk.exclude.failed}]]*/ '청크 제거에 실패했습니다.';
    const chunkExcludeBtn = document.getElementById('chunk-exclude-btn');
    /* 모달이 지금 보여주는 출처가 어느 턴의 어느 청크인지 — 제거 버튼이 쓴다. */
    let activeChunkContext = null;

    /* 응답 참여도 0% 판정. AnswerAttribution은 답변에 기여하지 않은 청크에 0.0이 아니라 값을
       아예 넣지 않으므로(§ SourceRef.answerShare), "값 없음"이 곧 0%다. 참여도 계산 자체가
       실패한 턴에서는 모든 출처가 여기 걸리는데, 그 턴은 실제로 어느 청크가 답변을 떠받쳤는지
       알 수 없으므로 사용자 판단에 맡기는 편이 맞다(제거는 표시 전용이라 되돌릴 수 있다). */
    function hasNoAnswerShare(el) {
        const raw = el && el.dataset ? el.dataset.share : undefined;
        if (raw === undefined || raw === '' || raw === 'null') return true;
        const share = parseFloat(raw);
        return !(share > 0) || Math.round(share * 100) === 0;
    }

    function openChunkFullTextModal(chunkId, label, item) {
        if (!chunkFullTextModal || !chunkFullTextModalBody) return;
        const turnId = item && item.dataset ? (item.dataset.turnId || '') : '';
        /* 버튼은 "제거 대상을 특정할 수 있고" + "참여도 0%"일 때만. 스트리밍 중인 턴은 done
           이벤트로 turnId가 심어지기 전까지 turnId가 없어 자연히 숨겨진다. */
        const removable = !!(turnId && chunkId && hasNoAnswerShare(item));
        activeChunkContext = removable ? { turnId, chunkId, item } : null;
        if (chunkExcludeBtn) chunkExcludeBtn.classList.toggle('d-none', !removable);
        chunkFullTextModalTitle.textContent = label || CHUNK_TITLE_DEFAULT;
        chunkFullTextModalBody.innerHTML = `<div class="text-muted small">${CHUNK_LOADING_TEXT}</div>`;
        chunkFullTextModal.show();
        fetch('/api/v1/chunks/' + encodeURIComponent(chunkId))
            .then(res => res.ok ? res.json() : Promise.reject(res.status === 404 ? 'notfound' : 'error'))
            .then(data => renderMarkdownWithImageMarkers(chunkFullTextModalBody, data.content || ''))
            .catch(reason => {
                const text = reason === 'notfound' ? CHUNK_NOTFOUND_TEXT : CHUNK_ERROR_TEXT;
                chunkFullTextModalBody.innerHTML = `<div class="text-muted small">${text}</div>`;
            });
    }

    document.addEventListener('click', function (e) {
        if (!isSourcePreviewEnabled()) return;
        const badge = e.target.closest('.source-ref');
        if (!badge) return;
        const chunkId = badge.dataset.chunkId;
        if (!chunkId) return;
        e.preventDefault();
        openChunkFullTextModal(chunkId, badge.textContent, badge.closest('.source-item'));
    });

    /* 현재 대화에서 이 청크 제거 — 표시 전용(서버도 turn_source_ref.hidden_at만 세운다).
       문서/벡터 스토어는 그대로이고, 이 답변의 재사용 검증도 계속 이 청크를 본다. */
    async function excludeActiveChunk() {
        if (!activeChunkContext) return;
        const { turnId, chunkId, item } = activeChunkContext;
        const threadId = chatForm.querySelector('input[name="threadId"]').value;
        const res = await fetch(
            `/ui/threads/${encodeURIComponent(threadId)}/turns/${encodeURIComponent(turnId)}/sources/exclude`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
                body: new URLSearchParams({ chunkId })
            });
        if (!res.ok) throw new Error('exclude failed');
        /* 같은 청크가 같은 턴에 두 번 그려지는 일은 없지만, 배지를 지우는 기준은 서버 WHERE와
           같게 (turnId, chunkId) 쌍으로 둔다 — 다른 턴의 같은 청크는 남아야 한다. */
        document.querySelectorAll('.source-item').forEach(el => {
            if ((el.dataset.turnId || '') === String(turnId)
                && el.querySelector(`.source-ref[data-chunk-id="${CSS.escape(chunkId)}"]`)) {
                el.remove();
            }
        });
        activeChunkContext = null;
        chunkFullTextModal.hide();
    }

    if (chunkExcludeBtn) {
        chunkExcludeBtn.addEventListener('click', function () {
            excludeActiveChunk().catch(() => {
                if (typeof showToast === 'function') showToast(CHUNK_EXCLUDE_FAILED, 'warning');
            });
        });
    }

    /* RAG ↔ Direct LLM 토글 */
    const labelRag    = /*[[#{chat.direct.label.rag}]]*/ 'RAG';
    const labelDirect = /*[[#{chat.direct.label.direct}]]*/ 'Direct';
    directToggle.addEventListener('change', function () {
        const isDirect = this.checked;
        directModeInput.value = isDirect ? 'true' : 'false';
        directLabel.textContent = isDirect ? labelDirect : labelRag;
        directLabel.classList.toggle('text-primary', isDirect);
        directLabel.classList.toggle('text-muted', !isDirect);
        updateResponseModeAvailability(isDirect);
        /* RAG ↔ Direct 를 오갈 때는 응답 모드를 **항상** 기본값(N)으로 되돌린다 — 어느 방향이든,
           직전 선택이 무엇이었든. 두 축은 성격이 달라(검색 여부 vs 답변의 성격) 한쪽을 바꾼 뒤에도
           남아 있는 다른 쪽 선택은 "내가 고른 것"이 아니라 "직전 대화에서 흘러온 것"에 가깝다.
           특히 S 는 버튼만 봐서는 눈에 잘 띄지 않아, Direct 로 옮긴 뒤 짧은 답변이 오는 이유를
           알기 어려웠다. 저장된 선택(localStorage)까지 함께 덮어써야 다음 방문에서 되살아나지 않는다.
           ⚠️ 이 초기화는 **토글 이벤트에서만** 한다 — updateResponseModeAvailability() 안에 넣으면
           페이지 로드 때도 실행되어(그 함수는 로드 시 현재 상태로 한 번 불린다) 사용자가 저장해 둔
           선택을 매번 지운다. */
        applyResponseMode(RESPONSE_MODE_DEFAULT);
        localStorage.setItem(RESPONSE_MODE_KEY, RESPONSE_MODE_DEFAULT);
    });

    const versionInput  = document.getElementById('version-input');
    const tagSelect     = document.getElementById('chat-tag-select');

    /* Sync version selector → hidden form field */
    versionInput.addEventListener('change', function () {
        const ver = (this.value || '').trim() || 'latest';
        document.getElementById('form-version').value = ver;
        loadChatTagSuggestions();   // 버전 변경 시 해당 버전 태그로 갱신
    });

    function loadVersionOptions() {
        const current = (document.getElementById('form-version').value || 'latest').trim();
        fetch('/api/v1/versions')
            .then(r => r.ok ? r.json() : [])
            .then(versions => {
                const list = Array.isArray(versions) ? versions.filter(Boolean) : [];
                if (!list.includes(current)) list.push(current);
                if (!list.includes('latest')) list.push('latest');
                list.sort();
                versionInput.innerHTML = list.map(v =>
                    `<option value="${escHtml(v)}">${escHtml(v)}</option>`).join('');
                versionInput.value = current;
            })
            .catch(() => {
                versionInput.innerHTML = `<option value="${escHtml(current)}">${escHtml(current)}</option>`;
                versionInput.value = current;
            });
    }

    /* ── 등록된 태그 칩 (버전 스코프, 클릭하면 검색 범위 토글) ──────────────── */
    const chatTagsInput   = document.getElementById('chat-tags-input');
    const chatAllLabel    = /*[[#{chat.tags.all}]]*/ 'All';
    const chatAllTooltip  = /*[[#{chat.tags.all.tooltip}]]*/ 'Search all documents';

    function chatCurrentTags() {
        return (chatTagsInput.value || '').split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
    }
    function chatToggleTag(tag) {
        const tags = chatCurrentTags();
        const i = tags.indexOf(tag);
        if (i >= 0) tags.splice(i, 1); else tags.push(tag);
        chatTagsInput.value = tags.join(', ');
        chatSyncTagChips();
    }
    function chatAddTag(tag) {
        const t = (tag || '').trim().toLowerCase();
        if (!t) return;
        const tags = chatCurrentTags();
        if (!tags.includes(t)) tags.push(t);
        chatTagsInput.value = tags.join(', ');
        chatSyncTagChips();
    }
    /* 'All' 칩: 태그 선택을 모두 비워 전체 문서를 검색한다(기존 "태그 미선택 = 전체 검색" 의미론
       그대로 재사용 — 서버 계약 변경 없음). 새 대화의 기본 상태(hidden 필드가 비어있음)와 같으므로
       별도 "기본 선택" 처리 없이 chatSyncTagChips()가 태그 0개일 때 자동으로 All을 활성 표시한다. */
    function chatSelectAllTags() {
        chatTagsInput.value = '';
        chatSyncTagChips();
    }
    function chatSyncTagChips() {
        const sel = chatCurrentTags();
        const allBtn = document.querySelector('#chat-tag-suggest-chips [data-tag-all]');
        if (allBtn) {
            allBtn.classList.toggle('btn-primary', sel.length === 0);
            allBtn.classList.toggle('btn-outline-secondary', sel.length > 0);
        }
        document.querySelectorAll('#chat-tag-suggest-chips [data-tag]').forEach(el => {
            el.classList.toggle('btn-primary', sel.includes(el.dataset.tag));
            el.classList.toggle('btn-outline-secondary', !sel.includes(el.dataset.tag));
        });
    }
    function loadChatTagSuggestions() {
        const ver = (document.getElementById('form-version').value || '').trim();
        const params = new URLSearchParams({excludeCommon: 'true'});
        if (ver) params.set('version', ver);
        fetch('/api/v1/tags?' + params.toString())
            .then(r => r.ok ? r.json() : [])
            .then(tags => {
                const wrap  = document.getElementById('chat-tag-suggest');
                const chips = document.getElementById('chat-tag-suggest-chips');
                if (!tags || tags.length === 0) {
                    wrap.classList.add('d-none');
                    chips.innerHTML = '';
                    if (tagSelect) {
                        tagSelect.innerHTML = '<option value="" selected>태그 선택...</option>';
                    }
                    return;
                }
                const allChip = `<button type="button" class="btn btn-sm py-0 px-2"
                         style="font-size:0.72rem;" data-tag-all="true" title="${escHtml(chatAllTooltip)}">${escHtml(chatAllLabel)}</button>`;
                chips.innerHTML = allChip + tags.map(t =>
                    `<button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2"
                             style="font-size:0.72rem;" data-tag="${escHtml(t)}">${escHtml(t)}</button>`).join('');
                chips.querySelector('[data-tag-all]').addEventListener('click', chatSelectAllTags);
                chips.querySelectorAll('[data-tag]').forEach(btn =>
                    btn.addEventListener('click', () => chatToggleTag(btn.dataset.tag)));

                if (tagSelect) {
                    const opts = ['<option value="" selected>태그 선택...</option>']
                        .concat(tags.map(t => `<option value="${escHtml(t)}">${escHtml(t)}</option>`));
                    tagSelect.innerHTML = opts.join('');
                }

                wrap.classList.remove('d-none');
                chatSyncTagChips();
            })
            .catch(() => {});
    }
    if (tagSelect) {
        tagSelect.addEventListener('change', function () {
            if (!this.value) return;
            chatAddTag(this.value);
            this.value = '';
        });
    }
    loadVersionOptions();
    loadChatTagSuggestions();

    /* ── 응답 모드 S/N 토글 버튼 → hidden 폼 필드 + localStorage 유지 ───────── */
    const responseModeRadios = document.querySelectorAll('input[name="response-mode-radio"]');
    const responseModeInput  = document.getElementById('form-response-mode');
    const RESPONSE_MODE_KEY  = 'chatResponseMode';
    /* 버튼으로 고를 수 있는 값. 여기 없는 값(옛 'M'/'L', 손으로 넣은 값)은 기본값으로 떨어진다 —
       화이트리스트에 버튼 없는 값을 넣으면 어느 라디오도 체크되지 않은 상태가 만들어진다.
       서버도 같은 규칙이다(ResponseMode.parse). */
    /* 운영자가 C를 꺼 두면 버튼 자체가 렌더되지 않는다 — 화이트리스트에서도 빼야
       localStorage 에 남은 'C' 선택이 기본값 N으로 흡수된다(안 그러면 어느 라디오도 체크되지
       않은 화면이 만들어진다). 서버 판정은 이와 무관하게 따로 돈다. */
    const CREATIVE_MODE_ENABLED = /*[[${creativeModeEnabled}]]*/ true;
    const RESPONSE_MODES = CREATIVE_MODE_ENABLED ? ['S', 'N', 'C'] : ['S', 'N'];
    const RESPONSE_MODE_DEFAULT = 'N';
    const responseModeCRadio = document.getElementById('response-mode-c');

    function applyResponseMode(mode) {
        const requested = RESPONSE_MODES.includes(mode) ? mode : RESPONSE_MODE_DEFAULT;
        /* 비활성(또는 없는) 버튼을 고른 상태로 두면 어느 라디오도 체크되지 않은 화면이 만들어진다. */
        const m = (requested === 'C' && (!responseModeCRadio || responseModeCRadio.disabled))
                ? RESPONSE_MODE_DEFAULT : requested;
        responseModeRadios.forEach(r => { r.checked = (r.value === m); });
        responseModeInput.value = m;
    }
    /* Direct는 검색을 건너뛰므로 문서를 재료로 삼는 C가 성립하지 않는다 — 버튼을 비활성화한다.
       사용자가 토글을 직접 움직이는 경우의 초기화는 위 change 핸들러가 (C뿐 아니라 모든 모드를)
       담당하므로, 여기 남은 C→N 은 **로드 시점** 몫이다: 저장된 선택이 C인데 Direct 상태로 화면이
       열리면 어느 라디오도 체크되지 않은 상태가 되기 때문이다.
       이것은 편의일 뿐이고 실제 방어는 서버에 있다 — ChatForm/ChatRequest 가 같은 성질을 묻는다. */
    function updateResponseModeAvailability(isDirect) {
        if (!responseModeCRadio) return;   /* 운영자가 C를 꺼 둔 배포 — 비활성화할 버튼이 없다 */
        responseModeCRadio.disabled = isDirect;
        if (isDirect && responseModeInput.value === 'C') {
            applyResponseMode(RESPONSE_MODE_DEFAULT);
            localStorage.setItem(RESPONSE_MODE_KEY, RESPONSE_MODE_DEFAULT);
        }
    }
    updateResponseModeAvailability(directToggle.checked);
    /* 브라우저에 남아 있던 옛 'M'/'L' 선택도 여기서 기본값 N으로 흡수된다(마이그레이션 불필요). */
    applyResponseMode(localStorage.getItem(RESPONSE_MODE_KEY));
    responseModeRadios.forEach(radio => radio.addEventListener('change', function () {
        if (!this.checked) return;
        responseModeInput.value = this.value;
        localStorage.setItem(RESPONSE_MODE_KEY, this.value);
    }));

    /* 네이티브 title 툴팁은 브라우저 기본 지연(~1.5s)이 있어 체감상 너무 늦게 뜬다 —
       Bootstrap Tooltip으로 대체해 짧은 delay로 표시한다. */
    document.querySelectorAll('#response-mode-group [data-bs-toggle="tooltip"]').forEach(el => {
        new bootstrap.Tooltip(el, {delay: {show: 100, hide: 0}});
    });

    /* Sync routing mode → hidden form field + PATCH thread if it exists.
       Selector is absent entirely when the deployment default is LOCAL_ONLY (localOnlyDeployment=true). */
    const routingModeSelect = document.getElementById('routing-mode-select');
    if (routingModeSelect) {
        routingModeSelect.addEventListener('change', function () {
            const mode = this.value;
            document.getElementById('form-routing-mode').value = mode;
            if (this.dataset.hasThread === 'true') {
                fetch('/ui/threads/' + this.dataset.threadId + '/routing-mode', {
                    method: 'PATCH',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders()},
                    body: 'routingMode=' + encodeURIComponent(mode)
                });
            }
        });
    }

    /* Auto-expand textarea (max 6 lines) */
    function adjustTextarea() {
        questionInput.style.height = 'auto';
        const lineH = parseInt(getComputedStyle(questionInput).lineHeight);
        questionInput.style.height = Math.min(questionInput.scrollHeight, lineH * 6) + 'px';
    }
    questionInput.addEventListener('input', adjustTextarea);

    function hideQuestionSuggestions() {
        suggestBox.classList.add('d-none');
        suggestBox.innerHTML = '';
    }

    function renderMarkdownText(raw) {
        if (!raw) return '';
        if (typeof marked === 'undefined') return escHtml(raw);
        const html = marked.parse(raw);
        return typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(html) : html;
    }

    function stripImagePreviewFromSourceMarkdown(raw) {
        if (!raw) return '';
        const mdImagePattern = new RegExp('!\\\\[' + '[^\\\\]]*\\\\]\\\\([^)]*\\\\)', 'g');
        return String(raw)
            .replace(mdImagePattern, '')
            .replace(/<img\b[^>]*>/gi, '')
            .replace(/\[이미지(?:\(변환불가\))?:[^\]]*\]/g, '');
    }

    function renderSourcePreviewHtml(raw) {
        const text = stripImagePreviewFromSourceMarkdown(raw);
        if (!text.trim()) return '<span class="text-muted small">미리보기 없음</span>';
        if (typeof marked === 'undefined') return `<div class="md-content small">${escHtml(text)}</div>`;
        const parsed = marked.parse(text);
        const sanitized = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(parsed) : parsed;
        const wrap = document.createElement('div');
        wrap.innerHTML = sanitized;
        wrap.querySelectorAll('img').forEach(img => img.remove());
        return `<div class="md-content small">${wrap.innerHTML}</div>`;
    }

    function renderSourceBadges(sources) {
        if (!Array.isArray(sources) || sources.length === 0) return '';
        const previewEnabled = typeof window.isSourcePreviewEnabled === 'function'
            ? window.isSourcePreviewEnabled()
            : true;
        const refs = sources.map(s => {
            const label = escHtml((s && s.label) ? s.label : '출처');
            const previewMd = escHtml((s && s.preview) ? s.preview : '');
            const chunkId = escHtml((s && s.chunk_id) ? s.chunk_id : '');
            const popoverAttrs = previewEnabled
                ? `data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="top" data-preview-md="${previewMd}"`
                : '';
            const chunkIdAttr = chunkId ? `data-chunk-id="${chunkId}"` : '';
            return `<a href="#" class="source-ref badge bg-secondary text-decoration-none me-1 mb-1" ${popoverAttrs} ${chunkIdAttr} title="${label}">${label}</a>`;
        }).join('');
        return `<div class="mt-2">${refs}</div>`;
    }

    /* trigger를 hover/focus 자동 바인딩 대신 manual로 두고 show/hide를 직접 제어한다 —
       배지에서 마우스를 떼는 순간 Bootstrap 기본 동작(hide 지연 없음)이 팝오버 박스에
       닿기도 전에 먼저 닫아버려 미리보기 텍스트를 드래그로 선택/복사할 수 없었다. 짧은
       유예(250ms) 뒤에 닫되, 팝오버 박스 위에 마우스가 있는 동안은 유예를 계속 취소한다. */
    function bindSourcePopover(el) {
        const popover = new bootstrap.Popover(el, {
            html: true,
            sanitize: false,
            trigger: 'manual',
            content: () => renderSourcePreviewHtml(el.getAttribute('data-preview-md') || '')
        });
        let hideTimer = null;
        const cancelHide = () => { clearTimeout(hideTimer); hideTimer = null; };
        const scheduleHide = () => { cancelHide(); hideTimer = setTimeout(() => popover.hide(), 250); };
        el.addEventListener('mouseenter', () => { cancelHide(); popover.show(); });
        el.addEventListener('mouseleave', scheduleHide);
        el.addEventListener('focus', () => { cancelHide(); popover.show(); });
        el.addEventListener('blur', scheduleHide);
        el.addEventListener('shown.bs.popover', function () {
            const tipId = el.getAttribute('aria-describedby');
            const tip = tipId ? document.getElementById(tipId) : null;
            if (!tip || tip.dataset.hoverBridged) return;
            tip.dataset.hoverBridged = '1';
            tip.addEventListener('mouseenter', cancelHide);
            tip.addEventListener('mouseleave', scheduleHide);
        });
    }

    function initSourcePopovers(rootEl) {
        if (!rootEl) return;
        const previewEnabled = typeof window.isSourcePreviewEnabled === 'function'
            ? window.isSourcePreviewEnabled()
            : true;
        rootEl.querySelectorAll('.source-ref').forEach(function (el) {
            if (previewEnabled && el.hasAttribute('data-bs-toggle')) {
                bindSourcePopover(el);
            } else {
                el.removeAttribute('data-bs-toggle');
                el.removeAttribute('data-bs-trigger');
                el.removeAttribute('data-bs-placement');
            }
        });
    }
    initSourcePopovers(document);

    function appendReusedTurn(question, answer, turnId, provider, sources) {
        const t = new Date().toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit', hour12: false});
        const userBubble = document.createElement('div');
        userBubble.className = 'd-flex justify-content-end mb-3 align-items-end';
        // 재사용 버블도 같은 표기를 단다. 저장된 그 턴의 모드가 아니라 '지금 폼에 선택된' 모드인데,
        // 재사용은 방금 고른 설정으로 새 턴을 만드는 동작이라 그것이 맞다. 검색 축도 마찬가지다.
        const reuseMode = bubbleModeLabel(responseModeInput.value || RESPONSE_MODE_DEFAULT,
                                          directModeInput.value);
        userBubble.dataset.responseMode = reuseMode;
        userBubble.innerHTML =
            `<div class="me-1">` +
            `<div class="bubble-user p-3">` +
                `<div><span class="bubble-user-mode">[${escHtml(reuseMode)}] </span>${escHtml(question)}</div>` +
                `<small class="text-white bubble-user-time">🕐 ${escHtml(t)}</small>` +
            `</div>` +
            `</div>`;
        chatMessages.appendChild(userBubble);

        const assistant = document.createElement('div');
        assistant.className = 'd-flex align-items-end mb-3';
        assistant.innerHTML =
            `<div class="bubble-assistant p-3 flex-grow-1">` +
                `<div class="md-content">${renderMarkdownText(answer)}</div>` +
                `${renderSourceBadges(sources)}` +
                `<div class="mt-1 d-flex align-items-center flex-wrap gap-2">` +
                    // 재사용(db-reuse) 경로에는 좋아요 비활성 분기가 없다 — S·C 는 재사용 후보에서
                    // 아예 빠지므로(ResponseMode.allowsReuse) 여기에 도달하는 턴은 항상 큐레이션
                    // 가능한 모드다. 재사용 제외 규칙을 바꾸면 이 가정도 함께 깨진다.
                    `<div class="feedback-controls d-flex gap-1" data-turn-id="${turnId}" data-thread-id="${escHtml(chatForm.querySelector('input[name="threadId"]').value)}">` +
                        `<button type="button" class="btn btn-sm btn-outline-secondary feedback-btn" data-feedback="LIKE" aria-label="좋아요" title="좋아요">👍</button>` +
                        `<button type="button" class="btn btn-sm btn-outline-secondary feedback-btn" data-feedback="DISLIKE" aria-label="싫어요" title="싫어요">👎</button>` +
                    `</div>` +
                    `<div class="text-muted" style="font-size:0.68rem;">` +
                        `<span class="badge bg-info text-dark me-1">DB 재사용</span>` +
                        `🤖 ${escHtml(provider || 'db-reuse')} · 🕐 ${escHtml(t)}` +
                    `</div>` +
                `</div>` +
            `</div>`;
        chatMessages.appendChild(assistant);
        initSourcePopovers(assistant);

        if (typeof hljs !== 'undefined') {
            assistant.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        }
        scrollToBottom();
        if (typeof htmx !== 'undefined') htmx.trigger(document.body, 'refreshThreadList');
    }

    function submitWithFallback(question, message) {
        if (message) {
            if (typeof showToast === 'function') showToast(message, 'warning');
            else alert(message);
        }
        questionInput.value = question || '';
        questionInput.focus();
        chatForm.requestSubmit();
    }

    async function onSelectSuggestion(turnId) {
        const threadId = chatForm.querySelector('input[name="threadId"]').value;
        const version = document.getElementById('form-version').value || 'latest';
        const scope = 'shared';
        try {
            const body = new URLSearchParams({ turnId: String(turnId), threadId, version, scope });
            const res = await fetch('/api/v1/questions/reuse', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
                body
            });
            const data = res.ok ? await res.json() : null;
            if (!data) throw new Error('reuse failed');
            hideQuestionSuggestions();

            if (data.reused) {
                questionInput.value = '';
                questionInput.style.height = 'auto';
                appendReusedTurn(data.question || '', data.answer || '', data.turnId || '', data.provider || 'db-reuse', data.sources || []);
                return;
            }
            submitWithFallback(data.question || '', data.message || '기존 답변 검증에 실패하여 일반 질의로 전환합니다.');
        } catch (e) {
            submitWithFallback(questionInput.value.trim(), '재사용 호출에 실패하여 일반 질의로 전환합니다.');
        }
    }

    function renderSuggestions(items) {
        if (!Array.isArray(items) || items.length === 0) {
            hideQuestionSuggestions();
            return;
        }
        suggestBox.innerHTML = items.map(it =>
            `<button type="button" class="list-group-item list-group-item-action" data-turn-id="${it.turnId}">` +
                `<div class="small fw-semibold text-start">${escHtml(it.question || '')}</div>` +
            `</button>`
        ).join('');
        suggestBox.classList.remove('d-none');
        suggestBox.querySelectorAll('[data-turn-id]').forEach(btn => {
            btn.addEventListener('click', () => onSelectSuggestion(btn.getAttribute('data-turn-id')));
        });
    }

    async function loadQuestionSuggestions() {
        const q = questionInput.value.trim();
        if (q.length < 2) {
            hideQuestionSuggestions();
            return;
        }
        const seq = ++suggestSeq;
        const scope = 'shared';
        const params = new URLSearchParams({ q, scope, limit: '12' });
        try {
            const res = await fetch('/api/v1/questions/suggest?' + params.toString(), {
                headers: getCsrfHeaders()
            });
            const data = res.ok ? await res.json() : [];
            if (seq !== suggestSeq) return;
            renderSuggestions(data);
        } catch (e) {
            if (seq === suggestSeq) hideQuestionSuggestions();
        }
    }

    questionInput.addEventListener('input', function () {
        if (suggestTimer) clearTimeout(suggestTimer);
        suggestTimer = setTimeout(loadQuestionSuggestions, 220);
    });

    questionInput.addEventListener('blur', function () {
        setTimeout(hideQuestionSuggestions, 180);
    });

    /* ── 입력 시작 시 대화 요약 선계산 (백그라운드, 응답 안 기다림) ──────
       요약 대상은 이미 저장된 turn 들뿐이라 지금 입력 중인 텍스트와 무관하므로,
       입력을 시작하는 즉시(한 글자만 쳐도) 1회만 트리거하고 이번 입력 세션 동안 재호출하지 않는다.
       실패해도 조용히 무시 — 다음 질문 전송 시 캐시가 없으면 기존 getHistory() 경로로 자동 폴백된다. */
    questionInput.addEventListener('input', function () {
        if (this.dataset.summaryPrecomputed || !this.value.trim()) return;
        this.dataset.summaryPrecomputed = '1';
        const threadId = document.getElementById('chat-form').querySelector('input[name="threadId"]').value;
        fetch('/ui/chat/summary/precompute', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
            body: 'threadId=' + encodeURIComponent(threadId)
        }).catch(() => {});
    });

    /* Enter → submit, Shift+Enter → newline.
       한글 등 IME 조합 중 Enter로 조합을 확정하면 일부 브라우저(특히 Safari)가 keydown을
       두 번 발생시켜(조합 확정용 + 그 직후 실제 Enter) 같은 질문이 두 번 제출되는 버그가
       있었다 — e.isComposing만으로는 해당 브라우저에서 조합 확정 keydown 때 false로
       잘못 보고되는 경우가 있어 compositionstart/compositionend로 별도 플래그를 유지해
       이중으로 방어한다. */
    let isComposing = false;
    questionInput.addEventListener('compositionstart', function () { isComposing = true; });
    questionInput.addEventListener('compositionend', function () { isComposing = false; });
    questionInput.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            if (e.isComposing || isComposing) return;
            e.preventDefault();
            hideQuestionSuggestions();
            if (this.value.trim()) chatForm.requestSubmit();
        }
        if (e.key === 'Escape') hideQuestionSuggestions();
    });

    /* #chat-messages has CSS scroll-behavior:smooth (app.css) for in-stream scrolling, but that
       makes a plain `.scrollTop = x` assignment an animated scroll instead of an instant jump —
       unreliable here (the animation can get interrupted/never finish). scrollTo({behavior:
       'instant'}) explicitly overrides the CSS behavior, same as chat-stream.js's own version. */
    function scrollToBottom() {
        chatMessages.scrollTo({ top: chatMessages.scrollHeight, behavior: 'instant' });
    }

    function escHtml(s) {
        return String(s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function openImageModal(anchor) {
        if (!imageModal || !imageModalImg) return;
        const imageRef = anchor.dataset.imageRef || '';
        if (!imageRef) return;
        imageModalImg.src = '/api/v1/' + encodeURI(imageRef);
        activeImageContext = {
            imageRef,
            turnId: anchor.dataset.turnId || ''
        };
        imageExcludeBtn.disabled = !(activeImageContext.turnId && activeImageContext.imageRef);
        imageModal.show();
    }

    async function excludeActiveImage() {
        if (!activeImageContext || !activeImageContext.turnId || !activeImageContext.imageRef) return;
        const threadId = chatForm.querySelector('input[name="threadId"]').value;
        const body = new URLSearchParams({ imageRef: activeImageContext.imageRef });
        const res = await fetch(`/ui/threads/${encodeURIComponent(threadId)}/turns/${encodeURIComponent(activeImageContext.turnId)}/images/exclude`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
            body
        });
        if (!res.ok) throw new Error('exclude failed');
        document.querySelectorAll('.chat-image-thumb').forEach(el => {
            if ((el.dataset.turnId || '') === activeImageContext.turnId
                && (el.dataset.imageRef || '') === activeImageContext.imageRef) {
                el.remove();
            }
        });
        imageModal.hide();
    }

    if (imageExcludeBtn) {
        imageExcludeBtn.addEventListener('click', function () {
            excludeActiveImage().catch(() => {
                if (typeof showToast === 'function') showToast('이미지 제외 처리에 실패했습니다.', 'warning');
            });
        });
    }

    document.addEventListener('click', function (e) {
        const thumb = e.target.closest('.chat-image-thumb');
        if (!thumb) return;
        e.preventDefault();
        openImageModal(thumb);
    });

    /* Before request: optimistic user bubble + clear input */
    chatForm.addEventListener('htmx:beforeRequest', function () {
        const q = questionInput.value.trim();
        if (q) {
            const timeStr = new Date().toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit', hour12: false});
            const bubble = document.createElement('div');
            bubble.className = 'd-flex justify-content-end mb-3 align-items-end';
            const optimisticMode = bubbleModeLabel(responseModeInput.value || RESPONSE_MODE_DEFAULT,
                                                   directModeInput.value);
            bubble.dataset.responseMode = optimisticMode;
            bubble.innerHTML =
                `<div class="me-1">` +
                `<div class="bubble-user p-3">` +
                    `<div><span class="bubble-user-mode">[${escHtml(optimisticMode)}] </span>${escHtml(q)}</div>` +
                    `<small class="text-white bubble-user-time">🕐 ${escHtml(timeStr)}</small>` +
                `</div>` +
                `</div>`;
            chatMessages.appendChild(bubble);
        }
        questionInput.value = '';
        questionInput.style.height = 'auto';
        delete questionInput.dataset.summaryPrecomputed;
        sendBtn.disabled = true;
        typingIndicator.classList.remove('d-none');
        typingIndicator.classList.add('d-flex');
        scrollToBottom();
    });

    /* After request: hide indicator, re-enable send, scroll after paint */
    chatForm.addEventListener('htmx:afterRequest', function () {
        typingIndicator.classList.add('d-none');
        typingIndicator.classList.remove('d-flex');
        sendBtn.disabled = false;
        requestAnimationFrame(scrollToBottom);
    });

    /* ── Relative date formatting ──────────────────────────────────── */
    function formatRelativeDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr.replace(' ', 'T'));
        if (isNaN(d)) return dateStr;
        const todayStart = new Date();
        todayStart.setHours(0, 0, 0, 0);
        const dStart = new Date(d);
        dStart.setHours(0, 0, 0, 0);
        const diff = Math.round((todayStart - dStart) / 86400000);
        if (diff === 0) return /*[[#{date.today}]]*/ 'Today';
        if (diff === 1) return /*[[#{date.yesterday}]]*/ 'Yesterday';
        return String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
    }

    function applyRelativeDates() {
        document.querySelectorAll('.thread-date[data-date]').forEach(el => {
            el.textContent = formatRelativeDate(el.getAttribute('data-date'));
        });
    }
    applyRelativeDates();
    document.body.addEventListener('htmx:afterSettle', applyRelativeDates);

    /* ── Thread ID copy ────────────────────────────────────────────── */
    function copyThreadId(btn, id) {
        // navigator.clipboard is secure-context only (HTTPS or localhost) — undefined when the app
        // is opened over plain HTTP from a LAN address, where this used to throw and the button did
        // nothing. Fall back to the legacy execCommand path so copying still works there.
        const done = () => {
            const icon = btn.querySelector('i');
            if (icon) {
                icon.className = 'bi bi-check';
                setTimeout(() => { icon.className = 'bi bi-clipboard'; }, 1500);
            }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(id).then(done).catch(() => legacyCopy(id) && done());
        } else if (legacyCopy(id)) {
            done();
        }
    }

    function legacyCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
        document.body.removeChild(ta);
        return ok;
    }

    /* ── Inline title edit ─────────────────────────────────────────── */
    function startTitleEdit(threadId) {
        const titleEl = document.getElementById('current-thread-title');
        if (!titleEl || titleEl.tagName === 'INPUT') return;
        const current = titleEl.textContent.trim();
        const input = document.createElement('input');
        input.type = 'text';
        input.value = current;
        input.className = 'form-control form-control-sm mb-1';
        titleEl.replaceWith(input);
        input.focus();
        input.select();
        let done = false;

        function commit(save) {
            if (done) return;
            done = true;
            const newTitle = save ? (input.value.trim() || current) : current;
            const el = document.createElement('div');
            el.id = 'current-thread-title';
            el.className = 'fw-semibold text-dark text-truncate mb-1';
            el.textContent = newTitle;
            input.replaceWith(el);
            if (save && newTitle !== current) {
                fetch(`/ui/threads/${threadId}/title`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
                    body: 'title=' + encodeURIComponent(newTitle)
                }).then(() => {
                    const item = document.getElementById('thread-' + threadId);
                    if (item) {
                        const t = item.querySelector('.text-truncate');
                        if (t) t.textContent = newTitle;
                    }
                });
            }
        }

        input.addEventListener('blur', () => commit(true));
        input.addEventListener('keydown', e => {
            if (e.key === 'Enter') { e.preventDefault(); commit(true); }
            if (e.key === 'Escape') { e.preventDefault(); commit(false); }
        });
    }

    /* ── Delete current thread ─────────────────────────────────────── */
    function deleteCurrentThread(threadId) {
        if (!confirm(I18N.deleteConfirmThread)) return;
        fetch(`/ui/threads/${threadId}`, { method: 'DELETE', headers: getCsrfHeaders() })
            .then(r => { if (r.ok) window.location.href = '/'; })
            .catch(() => showToast(I18N.requestFailed, 'danger'));
    }

    /* ── 5초 지연 2차 갱신 (LLM 비동기 제목 반영) ───────────────────── */
    document.body.addEventListener('refreshThreadList', function () {
        const wrapper = document.getElementById('thread-list-wrapper');
        if (wrapper) setTimeout(() => htmx.trigger(wrapper, 'refreshThreadListDelayed'), 5000);
    });

    /* ── 복원된 turn 시간 포맷팅 (UTC DB 시간 → 로컬 HH:MM) ─────────────── */
    function applyMsgTimes() {
        document.querySelectorAll('.msg-time[data-utc-time]').forEach(function (el) {
            const raw = el.getAttribute('data-utc-time');
            if (!raw) return;
            try {
                const d = new Date(raw.replace(' ', 'T') + 'Z');
                if (!isNaN(d)) {
                    const t = d.toLocaleTimeString('ko-KR', {hour: '2-digit', minute: '2-digit', hour12: false});
                    el.textContent = (el.textContent.includes('🕐') ? '🕐 ' : '') + t;
                }
            } catch (e) {}
            el.removeAttribute('data-utc-time');
        });
    }
    applyMsgTimes();

    /* ── 서버 렌더 이전 turn 마크다운 처리 + syntax highlight + 초기 스크롤 ── */
    document.querySelectorAll('.md-content[data-md]').forEach(function (el) {
        const raw = el.dataset.md || '';
        if (typeof marked === 'undefined') { el.textContent = raw; delete el.dataset.md; return; }
        const html = marked.parse(raw);
        el.innerHTML = typeof DOMPurify !== 'undefined' ? DOMPurify.sanitize(html) : html;
        if (typeof hljs !== 'undefined') {
            el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));
        }
        delete el.dataset.md;
    });

    /* ── 턴 삭제 (싫어요 직후 확인) ─────────────────────────────────────── */
    /** 버블 한 쌍을 DOM에서 걷어낸다. 피드백 컨트롤에서 #chat-messages의 직계 자식까지
        거슬러 올라가 어시스턴트 행을 찾고, 그 앞 형제가 질문 행이다 — 두 렌더 경로(서버 복원,
        스트리밍)가 모두 '질문 행 다음 답변 행'을 직계 자식으로 붙이므로 이 규칙 하나로 충분하다. */
    function removeTurnFromDom(controls) {
        const chat = document.getElementById('chat-messages');
        let assistantRow = controls;
        while (assistantRow && assistantRow.parentElement !== chat) assistantRow = assistantRow.parentElement;
        if (!assistantRow) return;
        const userRow = assistantRow.previousElementSibling;
        if (userRow && userRow.classList.contains('user-turn')) userRow.remove();
        assistantRow.remove();
    }

    function deleteTurn(threadId, turnId, controls) {
        fetch(`/ui/threads/${encodeURIComponent(threadId)}/turns/${encodeURIComponent(turnId)}`, { method: 'DELETE', headers: getCsrfHeaders() })
            .then(function (r) {
                if (!r.ok) { showToast(I18N.turnDeleteFailed, 'danger'); return; }
                removeTurnFromDom(controls);
                showToast(I18N.turnDeleted, 'success');
            })
            .catch(function () { showToast(I18N.turnDeleteFailed, 'danger'); });
    }

    /* ── 응답 피드백 (좋아요/싫어요) — 서버 렌더/HTMX/스트리밍 버블 공통 위임 처리 ── */
    document.getElementById('chat-messages').addEventListener('click', function (e) {
        const btn = e.target.closest('.feedback-btn');
        if (!btn) return;
        const container = btn.closest('.feedback-controls');
        if (!container) return;
        const tId = container.dataset.threadId;
        const turnId = container.dataset.turnId;
        if (!tId || !turnId) return;

        const clickedValue = btn.dataset.feedback;
        const activeClass = clickedValue === 'LIKE' ? 'btn-primary' : 'btn-danger';
        const wasActive = btn.classList.contains(activeClass);
        const newValue = wasActive ? 'NONE' : clickedValue;

        // 싫어요로 '바뀌는' 클릭에서만 삭제를 먼저 묻는다 — 해제 토글(NONE)이나 좋아요에는 묻지 않는다.
        // 저장보다 확인이 앞서는 이유: 삭제를 고르면 그 턴 자체가 사라지므로 피드백을 남길 대상이
        // 없다. 삭제하지 않을 때만 평소대로 DISLIKE를 저장한다(그 턴은 §6.9에 따라 이후 프롬프트
        // 컨텍스트에서 빠진다) — 즉 '삭제'와 '맥락에서만 제외'가 서로 배타적인 두 선택지가 된다.
        // 삭제가 실패하면 아무것도 저장하지 않고 실패 토스트만 띄운다. 사용자가 고른 것은 삭제이지
        // 싫어요가 아니므로, 조용히 약한 쪽으로 바꿔 적용하지 않는다.
        if (newValue === 'DISLIKE' && confirm(I18N.deleteConfirmTurn)) {
            deleteTurn(tId, turnId, container);
            return;
        }

        // §10.11 — 좋아요로 '바뀌는' 클릭에서만 지식 제안을 묻는다(해제 토글에는 묻지 않는다).
        // '아니오'는 좋아요 자체를 취소한다 — 무엇도 저장하지 않고 그냥 돌아간다. 좋아요만 남기고
        // 제안은 안 하는 중간 상태를 만들지 않는 것이 이 화면의 계약이다: 채팅은 감상만 다루고,
        // 지식으로 만드는 일은 전부 제안 페이지에서 일어난다.
        if (newValue === 'LIKE' && !confirm(I18N.proposeConfirm)) return;

        fetch(`/ui/threads/${tId}/turns/${turnId}/feedback`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded', ...getCsrfHeaders() },
            body: 'feedback=' + encodeURIComponent(newValue)
        }).then(function (r) {
            if (!r.ok) { showToast(I18N.requestFailed, 'danger'); return; }
            container.querySelectorAll('.feedback-btn').forEach(function (b) {
                b.classList.remove('btn-primary', 'btn-danger');
                b.classList.add('btn-outline-secondary');
            });
            if (newValue !== 'NONE') {
                btn.classList.remove('btn-outline-secondary');
                btn.classList.add(activeClass);
            }
            // 좋아요가 기록된 뒤에 이동한다 — 제안 화면에서 뒤로 오면 버튼이 눌린 채로 있어야 한다.
            // 본문은 서버가 그 턴에서 읽으므로 URL 로는 어느 턴인지만 넘긴다.
            if (newValue === 'LIKE') {
                location.href = '/curated/submissions?fromThread=' + encodeURIComponent(tId)
                        + '&fromTurn=' + encodeURIComponent(turnId);
            }
        }).catch(function () { showToast(I18N.requestFailed, 'danger'); });
    });

    /* ── 질문 내비게이션 ────────────────────────────────────────────────
       답변이 수십 줄이라 조금만 스크롤해도 질문이 화면 밖으로 나간다.
       (1) 지금 보고 있는 답변의 질문을 오른쪽 위 풍선으로 띄우고,
       (2) '맨 아래로' 버튼 위 목록 버튼으로 전체 질문 목록을 열어 바로 이동한다.
