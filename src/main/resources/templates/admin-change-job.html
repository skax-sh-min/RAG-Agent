<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:lang="${#locale.language}">
<head>
    <title th:text="#{maint.title}">Document maintenance</title>
</head>
<body>

<section layout:fragment="content" class="container py-4">
    <div th:fragment="body"
         th:attr="hx-get=${running} ? @{/admin/change-jobs/{id}/body(id=${job.id})} : null,
                  hx-trigger=${running} ? 'every 3s' : null,
                  hx-swap=${running} ? 'outerHTML' : null">

        <p class="small mb-2"><a th:href="@{/admin/change-jobs}" th:text="#{maint.back}">Back</a></p>
        <h5 class="fw-semibold mb-1">
            <i class="bi bi-pencil-square me-2"></i><span th:text="#{maint.title}">Document maintenance</span>
            <span class="text-muted fs-6" th:text="'#' + ${job.id}">#1</span>
        </h5>
        <p class="mb-3"><strong th:text="${job.requestText}">text</strong></p>

        <div th:unless="${anyApplied}" class="alert alert-secondary py-2 small" th:text="#{maint.not-applied}">Nothing has been changed yet.</div>
        <div th:if="${anyApplied}" class="alert alert-warning py-2 small" th:text="#{maint.original-file}">Original files are not changed.</div>

        <div th:if="${running}" class="alert alert-info py-2">
            <span class="spinner-border spinner-border-sm me-2"></span><span th:text="#{maint.running}">Running…</span>
        </div>
        <div th:if="${job.status == 'interrupted'}" class="alert alert-warning py-2" th:text="#{maint.interrupted}">Interrupted</div>
        <div th:if="${job.status == 'failed'}" class="alert alert-danger py-2">
            <span th:text="#{maint.failed}">Failed</span>: <span th:text="${job.error}"></span>
        </div>

        <div th:if="${report != null}">
            <p class="mb-2"><code th:text="${report.from}">A</code> → <code th:text="${report.to}">B</code></p>
            <div th:if="${report.tooShort}" class="alert alert-warning py-2" th:text="#{maint.too-short}">Too short</div>
            <div th:if="${report.truncated}" class="alert alert-warning py-2" th:text="#{maint.truncated(${report.mentions})}">Truncated</div>
            <ul class="small text-muted" th:unless="${report.tooShort}">
                <li th:text="#{maint.report.proposals(${report.proposals}, ${report.mentions})}">n proposals</li>
                <li th:if="${report.unchanged > 0}" th:text="#{maint.report.unchanged(${report.unchanged})}">n unchanged</li>
                <li th:if="${report.manualCurated > 0}" th:text="#{maint.report.manual(${report.manualCurated})}">n manual</li>
                <li th:if="${report.semantic}" th:text="#{maint.report.semantic(${report.semanticTried}, ${report.semanticProposed})}">semantic</li>
                <li th:each="d : ${report.discarded}" class="text-danger"
                    th:text="${d.file} + ' — ' + ${d.reason}">discarded</li>
            </ul>
            <div th:if="${report.semanticSkipped != null and !report.semanticSkipped.isEmpty()}" class="small text-muted mb-3">
                <div th:text="#{maint.report.semantic-skipped}">skipped</div>
                <ul class="mb-0"><li th:each="s : ${report.semanticSkipped}" th:text="${s.file} + ' — ' + ${s.reason}">skipped</li></ul>
            </div>
        </div>

        <div class="mb-4" th:each="d : ${docs}">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-2">
                <h6 class="mb-0"><span th:text="${d.filename}">file</span>
                    <span class="text-muted small" th:text="'(' + ${d.views.size()} + ')'">(n)</span></h6>
                <div class="d-flex align-items-center gap-2">
                    <span class="small text-muted" th:if="${d.mdStatus != null}" th:text="#{'maint.md.' + ${d.mdStatus}}">md</span>
                    <form th:if="${d.pending > 0}" th:action="@{/admin/change-jobs/{id}/docs/reject(id=${job.id})}" method="post">
                        <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}"/>
                        <input type="hidden" name="docId" th:value="${d.docId}"/>
                        <button type="submit" class="btn btn-outline-secondary btn-sm" th:text="#{maint.reject}">Reject</button>
                    </form>
                    <form th:if="${d.pending > 0}" th:action="@{/admin/change-jobs/{id}/docs/approve(id=${job.id})}" method="post"
                          th:attr="onsubmit='return confirm(\'' + #{maint.approve.confirm} + '\')'">
                        <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}" th:value="${_csrf != null ? _csrf.token : ''}"/>
                        <input type="hidden" name="docId" th:value="${d.docId}"/>
                        <button type="submit" class="btn btn-primary btn-sm" th:text="#{maint.approve}">Approve and apply</button>
                    </form>
                </div>
            </div>
            <div class="card mb-2" th:each="v : ${d.views}">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><span class="text-muted small" th:text="${v.proposal.chunkId}">id</span>
                        <span class="badge ms-1" th:classappend="${v.proposal.kind == 'semantic'} ? 'bg-warning text-dark' : 'bg-light text-dark border'"
                              th:text="#{'maint.kind.' + ${v.proposal.kind}}">literal</span></span>
                    <span class="badge bg-secondary" th:text="#{'maint.status.' + ${v.proposal.status}}">pending</span>
                </div>
                <div class="card-body">
                    <pre class="small mb-0" style="white-space:pre-wrap" th:text="${v.diff}">diff</pre>
                    <p class="small text-muted mt-2 mb-0" th:if="${v.tooLarge}" th:text="#{maint.diff.too-large}">too large</p>
                </div>
            </div>
        </div>
    </div>
</section>

</body>
</html>
