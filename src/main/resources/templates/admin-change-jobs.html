<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}"
      th:lang="${#locale.language}">
<head>
    <title th:text="#{maint.title}">Document maintenance</title>
</head>
<body>

<section layout:fragment="content" class="container py-4">
    <h5 class="fw-semibold mb-3"><i class="bi bi-pencil-square me-2"></i><span th:text="#{maint.title}">Document maintenance</span></h5>

    <div th:if="${error == 'busy'}" class="alert alert-warning py-2" th:text="#{maint.error.busy}">busy</div>
    <div th:if="${error == 'invalid'}" class="alert alert-danger py-2" th:text="#{maint.error.invalid}">invalid</div>

    <div class="card mb-4">
        <div class="card-body">
            <p class="small text-muted mb-3" th:text="#{maint.hint}">hint</p>
            <form th:action="@{/admin/change-requests}" method="post">
                <input type="hidden" th:name="${_csrf != null ? _csrf.parameterName : '_csrf'}"
                       th:value="${_csrf != null ? _csrf.token : ''}"/>
                <div class="mb-2">
                    <label class="form-label small" for="instruction" th:text="#{maint.instruction}">Instruction</label>
                    <input class="form-control" id="instruction" name="instruction" maxlength="500"
                           th:placeholder="#{maint.instruction.placeholder}" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label small" for="from" th:text="#{maint.from}">From</label>
                        <input class="form-control" id="from" name="from" maxlength="200">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small" for="to" th:text="#{maint.to}">To</label>
                        <input class="form-control" id="to" name="to" maxlength="200">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-sm" th:text="#{maint.submit}">Create proposals</button>
            </form>
        </div>
    </div>

    <h6 th:text="#{maint.recent}">Recent requests</h6>
    <div class="list-group">
        <a th:each="j : ${jobs}" class="list-group-item list-group-item-action d-flex justify-content-between"
           th:href="@{/admin/change-jobs/{id}(id=${j.id})}">
            <span><strong th:text="'#' + ${j.id}">#1</strong> <span th:text="${j.requestText}">text</span></span>
            <span class="badge bg-secondary" th:text="${j.status}">done</span>
        </a>
        <div th:if="${jobs.isEmpty()}" class="list-group-item text-muted" th:text="#{maint.none}">None</div>
    </div>
</section>

</body>
</html>
