server.port=8080

# ── Caddy 리버스 프록시 통합 ────────────────────────────────────────────
# X-Forwarded-For/Proto 헤더를 신뢰해 실제 클라이언트 IP·HTTPS 여부 인식
server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
# 세션 쿠키 보안 (Caddy HTTPS 종료 환경 전제)
server.servlet.session.cookie.secure=${USE_CADDY_REVERSE_PROXY_HTTPS:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Auth
# Set to false to disable login — guest/admin auto-login. First access creates admin via /setup.
app.auth.enabled=${AUTH_ENABLED:true}

# Java 21 virtual threads for I/O-bound LLM calls
spring.threads.virtual.enabled=true

# SSE streaming — -1 lets SseEmitter control the timeout (see app.sse-timeout-seconds)
spring.mvc.async.request-timeout=-1

# ── Actuator: expose loggers endpoint for runtime log-level changes ─────
# Usage: POST /actuator/loggers/com.example.ragagent.service.RagService
#        Body: {"configuredLevel":"DEBUG"}  (or "INFO" to revert)
management.endpoints.web.exposure.include=loggers,health
management.endpoint.loggers.access=unrestricted

# ── Log levels ──────────────────────────────────────────────────────────
# Set to DEBUG to see per-chunk indexing progress; toggle at runtime via Actuator.
logging.level.com.example.ragagent=${LOGGING_LEVEL:INFO}
# Spring AI internal request logging (limited — does not include raw HTTP body)
# Toggle at runtime: POST /actuator/loggers/org.springframework.ai.openai  {"configuredLevel":"DEBUG"}
logging.level.org.springframework.ai.openai=${LOGGING_LEVEL:WARN}
# Reactor Netty wire log — shows full HTTP request/response bytes for WebClient (streaming path).
# WARNING: very verbose during streaming (every chunk logged). Enable only when debugging.
# Toggle at runtime: POST /actuator/loggers/reactor.netty.http.client  {"configuredLevel":"DEBUG"}
logging.level.reactor.netty.http.client=${LOGGING_LEVEL:INFO}

# Multipart upload (no size limit for documents)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Spring AI - OpenAI (also for local OpenAI-compatible endpoints)
spring.ai.openai.api-key=${LOCAL_LLM_KEY:sk-fake-key}
spring.ai.openai.base-url=${LOCAL_LLM_URL:http://localhost:1234/v1}
spring.ai.openai.chat.options.model=${LOCAL_LLM_MODEL:google/gemma-4-e4b}
spring.ai.openai.chat.options.temperature=${LLM_TEMPERATURE:0.0}
spring.ai.openai.chat.options.max-tokens=${LLM_MAX_TOKENS:8000}

# Embedding model — dedicated endpoint, fully decoupled from spring.ai.openai.*
# EMBED_BASE_URL has no default: app fails at startup if unset.
app.embedding.base-url=${EMBED_BASE_URL:${LOCAL_LLM_URL:http://localhost:1234/v1}}
app.embedding.api-key=${EMBED_API_KEY:${LOCAL_LLM_KEY:}}
app.embedding.model=${EMBED_MODEL:text-embedding-nomic-embed-text-v1.5}
# Required ONLY for app.vectorstore.type=sqlite-vec: the vec0 table is FLOAT[dim], so the
# dimension is baked into the DDL and MUST equal the embedding model's real output dimension
# (nomic-embed-text=768, bge-m3=1024, text-embedding-3-small=1536). Ignored in chroma mode.
# Empty when EMBED_DIMENSIONS is unset → binds to null (safe for chroma; sqlite-vec fails fast at startup).
app.embedding.dimensions=${EMBED_DIMENSIONS:}
app.embedding.connect-timeout-seconds=${EMBED_CONNECT_TIMEOUT_SECONDS:10}
app.embedding.read-timeout-seconds=${EMBED_READ_TIMEOUT_SECONDS:120}

# Vector store backend selection — chroma (default) | sqlite-vec
app.vectorstore.type=${VECTORSTORE_TYPE:chroma}
# sqlite-vec only: absolute path to the vec0 loadable extension binary (no Maven artifact
# bundles it — operator provides it; suffix .so/.dylib/.dll optional). Required when type=sqlite-vec.
app.vectorstore.sqlite-vec.extension-path=${SQLITE_VEC_EXTENSION_PATH:}
# sqlite-vec only: override the load_extension entrypoint (leave blank to let SQLite derive it;
# set to sqlite3_vec_init only if loading fails with an entrypoint error).
app.vectorstore.sqlite-vec.entrypoint=${SQLITE_VEC_ENTRYPOINT:}
# sqlite-vec only (optional feature switch): when set, the vector + FTS tables
# (vec_embeddings/vec_document_chunks/chunk_fts) live in a SEPARATE SQLite file for operational
# isolation from memory.db (index write I/O no longer contends with chat/auth/usage). Empty
# (default) → tables stay in memory.db (unchanged behavior). Recommended value: ${DATA_DIR}/vector.db.
# Switching requires re-indexing (vectors are not migrated). Ignored in chroma mode.
app.vectorstore.sqlite-vec.db-path=${SQLITE_VEC_DB_PATH:}

# Spring AI - Chroma Vector Store
# Auto-config is excluded: VectorStoreRegistry manages per-version stores directly.
# ChromaApi bean is provided by ChromaConfig.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8001}
app.chroma.connect-timeout-seconds=${CHROMA_CONNECT_TIMEOUT_SECONDS:5}
app.chroma.read-timeout-seconds=${CHROMA_READ_TIMEOUT_SECONDS:60}

# SQLite DataSource for conversation memory
# pool size 1: SQLite serializes writes even in WAL mode
spring.datasource.url=jdbc:sqlite:${DATA_DIR:./data}/memory.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
# WAL mode: better read concurrency; busy_timeout: wait instead of instant SQLITE_BUSY on write lock
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;
spring.sql.init.mode=never

# ── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate: if no flyway_schema_history exists on a non-empty DB,
# mark V1 as already applied (skip it) and only run V2+ going forward.
# On empty (new) DBs, V1 runs normally regardless of this flag.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Security: log-level for Spring Security (WARN in prod)
logging.level.org.springframework.security=${SPRING_SECURITY_LOGGING_LEVEL:WARN}

# i18n — disable JVM system-locale fallback so messages.properties is used for EN
spring.messages.fallback-to-system-locale=false

# App config
app.data-dir=${DATA_DIR:./data}
app.max-retry-count=${MAX_RETRY_COUNT:2}
app.max-conversation-chars=${MAX_CONVERSATION_CHARS:8000}
app.chunk-size=${CHUNK_SIZE:800}
app.chunk-overlap=${CHUNK_OVERLAP:100}
app.search-top-k=${SEARCH_TOP_K:7}
# Min cosine similarity [0,1] to retain a chunk (0 = accept all). Tune 0.5~0.75 in production.
app.search-similarity-threshold=${SEARCH_SIMILARITY_THRESHOLD:0.0}
# multi-query expansion gate. enabled=false disables expansion entirely.
# min-length = query chars at/above which expansion runs (0 = always; e.g. 12 skips short keyword queries → lower TTFT).
app.search-multiquery-enabled=${SEARCH_MULTIQUERY_ENABLED:true}
app.search-multiquery-min-length=${SEARCH_MULTIQUERY_MIN_LENGTH:0}
#  hybrid (keyword FTS5 + vector) search. Default off; enabling adds a BM25 axis to RRF.
# Note: only newly indexed docs populate the FTS index — reindex existing docs after enabling.
app.search-hybrid-enabled=${SEARCH_HYBRID_ENABLED:false}
# retry escalation. On each retry topK grows by ×(retryCount+1), capped at 3×. Default on.
app.search-retry-escalate=${SEARCH_RETRY_ESCALATE:true}
# LLM-based reranking. Default off (adds one LLM call per turn).
# candidate-multiplier: how many candidates to fetch before reranking (topK × N → topK).
app.search-rerank-enabled=${SEARCH_RERANK_ENABLED:false}
app.search-candidate-multiplier=${SEARCH_CANDIDATE_MULTIPLIER:3}
# candidate-expansion multiplier when tags are selected (candidateK = max(candidateK, topK × this))
app.search-tag-candidate-multiplier=${SEARCH_TAG_CANDIDATE_MULTIPLIER:2}
# SSE connection timeout in seconds (0 = use default 300 s)
app.sse-timeout-seconds=${SSE_TIMEOUT_SECONDS:300}
app.indexing.max-concurrent-files=${INDEXING_MAX_FILES:3}
app.indexing.max-concurrent-llm-calls=${INDEXING_MAX_LLM:4}
# Per-chunk keyword extraction timeout (seconds). Chunk is indexed without keywords on timeout.
app.indexing.keyword-timeout-seconds=${INDEXING_KEYWORD_TIMEOUT_SECONDS:180}

# Image description (Vision LLM enrichment)
# mode: strip | describe   enabled: set to true to activate LazyVisionService
app.image-description.mode=strip
app.image-description.enabled=true
app.image-description.ocr-enabled=true
app.image-description.min-image-bytes=1000
app.image-description.classify-type=true
app.image-description.docx-emf-convert=true
app.image-description.docx-wmf-convert=false

# Rate limiting
# Emergency toggle: Disable immediately with app.rate-limit.enabled=false
app.rate-limit.enabled=true
app.rate-limit.chat-per-minute=60
app.rate-limit.upload-per-minute=10
app.rate-limit.sync-per-minute=3
app.rate-limit.image-per-minute=300
app.rate-limit.default-per-minute=120

# Audit log — file-based rolling log (logback-spring.xml AUDIT_FILE appender)
# Emergency toggle: Disable immediately with app.audit.enabled=false
app.audit.enabled=true
app.audit.max-file-size=10MB
app.audit.max-history-days=7
app.audit.total-size-cap=100MB

# ── LLM Providers ──────────────────────────────────────────────────────────
# Routing: COST_FIRST | QUALITY_FIRST | PROGRESSIVE | DUAL | LOCAL_ONLY
# Air-gapped / local-only: set LLM_ROUTING_MODE=LOCAL_ONLY to block all external provider calls.
app.llm.default-routing-mode=${LLM_ROUTING_MODE:COST_FIRST}
app.llm.progressive-threshold=0.6
# Circuit Breaker: how long (minutes) to block a provider after 429/error
app.llm.circuit-breaker-minutes=4
app.llm.connect-timeout-seconds=${LLM_CONNECT_TIMEOUT_SECONDS:10}
app.llm.read-timeout-seconds=${LLM_READ_TIMEOUT_SECONDS:180}

# Default: single local LLM. Add more providers (gemini, openai) as needed.
# role: LOCAL | NORMAL | PREMIUM   type: LIGHT_TEXT | TEXT | VISION | LIGHT_BOTH | BOTH
# stream: true (default) = streaming API; false = blocking API (useful for providers with poor SSE support)
app.llm.providers[0].name=local
app.llm.providers[0].base-url=${LOCAL_LLM_URL:http://localhost:1234/v1}
app.llm.providers[0].api-key=${LOCAL_LLM_KEY:}
app.llm.providers[0].model=${LOCAL_LLM_MODEL:google/gemma-4-e4b}
app.llm.providers[0].type=BOTH
app.llm.providers[0].role=LOCAL
app.llm.providers[0].priority=0
app.llm.providers[0].stream=true

# ── [LOCAL] Vision-dedicated local model (optional) ────────────────────
# Uses index [6] to avoid colliding with the active openai provider at [5].
# app.llm.providers[6].name=local-vision
# app.llm.providers[6].base-url=${LOCAL_LLM_URL:http://localhost:1235/v1}
# app.llm.providers[6].api-key=${LOCAL_LLM_KEY:}
# app.llm.providers[6].model=llava-1.6-34b
# app.llm.providers[6].type=VISION
# app.llm.providers[6].role=LOCAL
# app.llm.providers[6].priority=0

# ── [NORMAL] Gemini Flash — low-cost, primary ──────────────────────────
# Provider is auto-disabled at startup when GEMINI_API_KEY is unset or empty.
app.llm.providers[1].name=gemini-flash-lite
app.llm.providers[1].base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
app.llm.providers[1].api-key=${GEMINI_API_KEY1:}
app.llm.providers[1].model=gemini-3.1-flash-lite
app.llm.providers[1].type=TEXT
app.llm.providers[1].role=NORMAL
app.llm.providers[1].priority=1

# ── [NORMAL] Gemini Flash — low-cost, secondary ────────────────────────
app.llm.providers[2].name=gemini-flash
app.llm.providers[2].base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
app.llm.providers[2].api-key=${GEMINI_API_KEY2:}
app.llm.providers[2].model=gemini-2.5-flash
app.llm.providers[2].type=TEXT
app.llm.providers[2].role=NORMAL
app.llm.providers[2].priority=2

# ── [NORMAL] OpenAI Mini — low-cost, fallback ──────────────────────────
app.llm.providers[3].name=openai-mini
app.llm.providers[3].base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.llm.providers[3].api-key=${OPENAI_API_KEY:}
app.llm.providers[3].model=gpt-4o-mini
app.llm.providers[3].type=TEXT
app.llm.providers[3].role=NORMAL
app.llm.providers[3].priority=3

# ── [PREMIUM] Gemma 4 31B — high-reasoning, primary ────────────────────
app.llm.providers[4].name=gemma-4-31b
app.llm.providers[4].base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
app.llm.providers[4].api-key=${GEMINI_API_KEY2:}
app.llm.providers[4].model=gemma-4-31b-it
app.llm.providers[4].type=TEXT
app.llm.providers[4].role=PREMIUM
app.llm.providers[4].priority=4

# ── [PREMIUM] OpenAI GPT-4o — high-reasoning, fallback ────────────────
app.llm.providers[5].name=openai
app.llm.providers[5].base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.llm.providers[5].api-key=${OPENAI_API_KEY:}
app.llm.providers[5].model=gpt-5o
app.llm.providers[5].type=TEXT
app.llm.providers[5].role=PREMIUM
app.llm.providers[5].priority=5
