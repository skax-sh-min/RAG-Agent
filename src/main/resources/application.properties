server.port=${SERVER_PORT:8080}

# ── Caddy reverse-proxy integration ─────────────────────────────────────
# Trust X-Forwarded-For/Proto headers to resolve the real client IP / HTTPS status
server.forward-headers-strategy=framework
server.tomcat.remoteip.protocol-header=X-Forwarded-Proto
# Session cookie security (assumes Caddy terminates HTTPS in front of this app)
server.servlet.session.cookie.secure=${USE_CADDY_REVERSE_PROXY_HTTPS:true}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# Auth
# Set to false to disable login — guest/admin auto-login. First access creates admin via /setup.
app.auth.enabled=${AUTH_ENABLED:true}
# Only meaningful when app.auth.enabled=false. true: chat/browsing stay open to guests,
# but /admin/** and document-management (upload/delete) require a real login against the /setup admin account.
app.auth.management-only=${AUTH_MANAGEMENT_ONLY:false}

# Java 21 virtual threads for I/O-bound LLM calls
spring.threads.virtual.enabled=true

# SSE streaming — -1 lets SseEmitter control the timeout (see app.sse-timeout-seconds)
spring.mvc.async.request-timeout=-1

# ── Actuator: expose loggers endpoint for runtime log-level changes ─────
# Usage: POST /actuator/loggers/com.example.ragagent.service.RagService
#        Body: {"configuredLevel":"DEBUG"}  (or "INFO" to revert)
management.endpoints.web.exposure.include=loggers,health
management.endpoint.loggers.access=unrestricted

# ── Log levels ──────────────────────────────────────────────────────────
# Set to DEBUG to see per-chunk indexing progress; toggle at runtime via Actuator.
logging.level.com.example.ragagent=${LOGGING_LEVEL:INFO}
# Spring AI internal request logging (limited — does not include raw HTTP body)
# Toggle at runtime: POST /actuator/loggers/org.springframework.ai.openai  {"configuredLevel":"DEBUG"}
logging.level.org.springframework.ai.openai=${LOGGING_LEVEL:WARN}
# Reactor Netty wire log — shows full HTTP request/response bytes for WebClient (streaming path).
# WARNING: very verbose during streaming (every chunk logged). Enable only when debugging.
# Toggle at runtime: POST /actuator/loggers/reactor.netty.http.client  {"configuredLevel":"DEBUG"}
logging.level.reactor.netty.http.client=${LOGGING_LEVEL:INFO}

# Multipart upload — 200MB per-file cap
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Spring AI - OpenAI global properties.
# NOTE: these are now VESTIGIAL — the Spring AI OpenAI auto-configs that would read them are all
# excluded below (spring.autoconfigure.exclude), because the app builds every chat/embedding/OpenAiApi
# bean itself in LlmConfig.llmRouter()/primaryChatModel() and EmbeddingBeanConfig from app.llm.providers[N].*
# / app.embedding.* (temperature/max-tokens come from app.llm.temperature/max-tokens below, §6.18).
# Kept only as a harmless fallback; nothing reads them at runtime. The api-key default stays non-blank
# so nothing can trip an Assert.hasText even if an OpenAI auto-config is ever un-excluded.
spring.ai.openai.api-key=${LOCAL_LLM_KEY:sk-fake-key}
spring.ai.openai.base-url=${LOCAL_LLM_URL:http://localhost:1234/v1}
spring.ai.openai.chat.options.model=${LOCAL_LLM_MODEL:google/gemma-4-e4b}

# Embedding model — dedicated endpoint, fully decoupled from spring.ai.openai.*
# EMBED_BASE_URL has no default: app fails at startup if unset.
app.embedding.base-url=${EMBED_BASE_URL:${LOCAL_LLM_URL:http://localhost:1234/v1}}
app.embedding.api-key=${EMBED_API_KEY:${LOCAL_LLM_KEY:}}
app.embedding.model=${EMBED_MODEL:text-embedding-nomic-embed-text-v1.5}
# Required ONLY for app.vectorstore.type=sqlite-vec: the vec0 table is FLOAT[dim], so the
# dimension is baked into the DDL and MUST equal the embedding model's real output dimension
# (nomic-embed-text=768, bge-m3=1024, text-embedding-3-small=1536). Ignored in chroma mode.
# Empty when EMBED_DIMENSIONS is unset → binds to null (safe for chroma; sqlite-vec fails fast at startup).
app.embedding.dimensions=${EMBED_DIMENSIONS:}
app.embedding.connect-timeout-seconds=${EMBED_CONNECT_TIMEOUT_SECONDS:10}
app.embedding.read-timeout-seconds=${EMBED_READ_TIMEOUT_SECONDS:180}
# When the embedding server doesn't report token usage, approximate input tokens as chars/4
# for llm_usage tracking instead of recording 0. Set to false to record 0 in that case.
app.embedding.usage-fallback-enabled=${EMBED_USAGE_FALLBACK_ENABLED:true}
# Hard per-chunk character ceiling to fit the embedding server's physical batch (token limit).
# 0 = disabled (default). Set this when the embedding server rejects chunks with errors like
# "input (N tokens) is too large ... (current batch size: 512)". Any chunk longer than this is
# force-split at line boundaries as a last-resort safety net (after semantic chunking). Char count
# roughly tracks tokens for Korean/code — e.g. ~450 keeps chunks under a 512-token batch. Prefer
# raising the server batch (llama-server -b/-ub) first; use this as a guardrail. See OPERATOR_MANUAL §8.
app.embedding.max-chunk-chars=${EMBED_MAX_CHUNK_CHARS:0}

# §6.21 E1 — additional embedding endpoints (same model + dimension, e.g. N GPU replicas of the same
# embedding server). Comma-separated. Empty (default) = single endpoint above. When set, embed calls
# are load-balanced least-in-flight across [base-url] + these. All MUST serve EMBED_MODEL at the same
# dimension — mixing models corrupts the vector index.
app.embedding.additional-base-urls=${EMBED_ADDITIONAL_BASE_URLS:}
# §6.21 E2 — parallel sub-batch embeds within one document's indexing (1 = serial, the default → zero
# regression). Set to roughly (endpoints × per-endpoint parallel) to fill all E1 endpoints from a single
# large file. Chroma parallelizes only the embed step (buffers, then one upsert); sqlite-vec embeds in
# parallel then inserts serially (SQLite pool=1), trading §10.9.3's streaming memory bound for speed.
# Bulk indexing of many files already spreads across E1 endpoints via app.indexing.max-concurrent-files.
app.embedding.max-concurrent-batches=${EMBED_MAX_CONCURRENT_BATCHES:1}

# Vector store backend selection — chroma (default) | sqlite-vec
app.vectorstore.type=${VECTORSTORE_TYPE:chroma}
# sqlite-vec only: absolute path to the vec0 loadable extension binary (no Maven artifact
# bundles it — operator provides it; suffix .so/.dylib/.dll optional). Required when type=sqlite-vec.
app.vectorstore.sqlite-vec.extension-path=${SQLITE_VEC_EXTENSION_PATH:}
# sqlite-vec only: override the load_extension entrypoint (leave blank to let SQLite derive it;
# set to sqlite3_vec_init only if loading fails with an entrypoint error).
app.vectorstore.sqlite-vec.entrypoint=${SQLITE_VEC_ENTRYPOINT:}
# sqlite-vec only (optional feature switch): when set, the vector + FTS tables
# (vec_embeddings/vec_document_chunks/chunk_fts) live in a SEPARATE SQLite file for operational
# isolation from memory.db (index write I/O no longer contends with chat/auth/usage). Empty
# (default) → tables stay in memory.db (unchanged behavior). Recommended value: ${DATA_DIR}/vector.db.
# Switching requires re-indexing (vectors are not migrated). Ignored in chroma mode.
app.vectorstore.sqlite-vec.db-path=${SQLITE_VEC_DB_PATH:}

# Spring AI - Chroma Vector Store
# Auto-config is excluded: VectorStoreRegistry manages per-version stores directly.
# ChromaApi bean is provided by ChromaConfig.
# Also exclude ALL SIX OpenAI model auto-configs (chat, embedding, audio speech/transcription,
# image, moderation). The app builds its OWN chat (LlmConfig.llmRouter/primaryChatModel), embedding
# (EmbeddingBeanConfig) and per-provider OpenAiApi instances (OpenAiApi.builder()), so it never uses
# Spring AI's autoconfigured OpenAI beans. Left active, EACH of these auto-configs eagerly creates an
# `openAiApi` bean that runs Assert.hasText on spring.ai.openai.api-key and crashes startup with
# "OpenAI API key must be set" whenever LOCAL_LLM_KEY is blank (the normal local / no-key setup) —
# even the chat/embedding ones, whose MODEL bean is skipped via @ConditionalOnMissingBean but whose
# openAiApi bean is not. Excluding them all removes that whole failure class.
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.chroma.autoconfigure.ChromaVectorStoreAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration,\
  org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8001}
app.chroma.connect-timeout-seconds=${CHROMA_CONNECT_TIMEOUT_SECONDS:5}
app.chroma.read-timeout-seconds=${CHROMA_READ_TIMEOUT_SECONDS:120}

# SQLite DataSource for conversation memory
# pool size 1: SQLite serializes writes even in WAL mode
spring.datasource.url=jdbc:sqlite:${DATA_DIR:./data}/memory.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
# WAL mode: better read concurrency; busy_timeout: wait instead of instant SQLITE_BUSY on write lock
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA busy_timeout=5000;
spring.sql.init.mode=never

# ── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate: if no flyway_schema_history exists on a non-empty DB,
# mark V1 as already applied (skip it) and only run V2+ going forward.
# On empty (new) DBs, V1 runs normally regardless of this flag.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Security: log-level for Spring Security (WARN in prod)
logging.level.org.springframework.security=${SPRING_SECURITY_LOGGING_LEVEL:WARN}

# i18n — disable JVM system-locale fallback so messages.properties is used for EN
spring.messages.fallback-to-system-locale=false

# App config
# Lines tagged "(hot)" below are runtime-overridable from /settings (persisted in the
# settings_override DB table) — a persisted override always wins over the default set here until
# an admin resets it; editing this file only changes what a not-yet-overridden deployment starts
# with. Untagged app.search-*/app.chunk-*/app.indexing.* lines require a restart to change. Full
# list + which apply on the next search vs. the next indexing: OPERATOR_MANUAL.md §6.5.
app.data-dir=${DATA_DIR:./data}
app.max-retry-count=${MAX_RETRY_COUNT:2}
# Chunk size/overlap (chars) + min-chunk-size floor for section-merge/sliding-window splitting.
# (hot — applies on the NEXT indexing/↺ re-index, not retroactively to already-indexed chunks)
app.chunk-size=${CHUNK_SIZE:800}
app.chunk-overlap=${CHUNK_OVERLAP:100}
app.min-chunk-size=${MIN_CHUNK_SIZE:300}
# Final result count / candidate base for retrieval. (hot)
app.search-top-k=${SEARCH_TOP_K:7}
# Min cosine similarity [0,1] to retain a chunk (0 = accept all). Tune 0.5~0.75 in production. (hot)
app.search-similarity-threshold=${SEARCH_SIMILARITY_THRESHOLD:0.0}
# multi-query expansion gate (hot). enabled=false disables expansion entirely.
# min-length = query chars at/above which expansion runs (0 = always; §10.8.1 — short keyword-ish
# queries gain little from expansion but always paid the LLM round-trip on the critical path).
app.search-multiquery-enabled=${SEARCH_MULTIQUERY_ENABLED:true}
app.search-multiquery-min-length=${SEARCH_MULTIQUERY_MIN_LENGTH:15}
# hybrid (keyword FTS5 + vector) search (hot). Adds a BM25 axis to RRF;
# the FTS index is populated unconditionally at indexing time regardless of this flag, so no
# reindex is needed to benefit — except docs indexed before FTS5/hybrid search existed at all.
app.search-hybrid-enabled=${SEARCH_HYBRID_ENABLED:true}
# retry escalation (hot). On each retry topK grows by ×(retryCount+1), capped at 3×. Default on.
app.search-retry-escalate=${SEARCH_RETRY_ESCALATE:true}
# LLM-based reranking — restart required (a @ConditionalOnProperty bean; the RerankerService bean
# only exists if this was true at startup, so it can't be hot-swapped). Default off (adds one LLM
# call per turn). candidate-multiplier: how many candidates to fetch before reranking (topK × N → topK). (hot)
app.search-rerank-enabled=${SEARCH_RERANK_ENABLED:false}
app.search-candidate-multiplier=${SEARCH_CANDIDATE_MULTIPLIER:3}
# candidate-expansion multiplier when tags are selected (candidateK = max(candidateK, topK × this)). (hot)
app.search-tag-candidate-multiplier=${SEARCH_TAG_CANDIDATE_MULTIPLIER:2}
# weighted RRF (hot). Vector axes (MultiQuery variants) are always group-normalized
# (weight = 1/axisCount) so their combined score doesn't scale with axis count; keyword-weight
# only tunes the BM25 axis (only matters when app.search-hybrid-enabled=true). k = RRF constant.
app.search-rrf-keyword-weight=${SEARCH_RRF_KEYWORD_WEIGHT:1.0}
app.search-rrf-k=${SEARCH_RRF_K:60}
# §10.10 — curated-Q&A RRF axis (liked chat answers promoted to a separate searchable knowledge
# axis under the reserved "curated" version namespace). enabled=false skips the axis search
# entirely; weight follows the same flat-weight treatment as the keyword axis (not group-normalized
# with the vector axes) — default 1.5 sits above the normalized vector group's effective 1.0 so a
# verified answer tends to surface without dominating outright (RRF's own rank decay still applies). (hot)
app.search-curated-qa-enabled=${SEARCH_CURATED_QA_ENABLED:true}
app.search-curated-qa-weight=${SEARCH_CURATED_QA_WEIGHT:1.5}
# query embedding cache — restart required (Caffeine cache sized at bean creation, not overridable).
# Caches normalized-query -> vector by model name so repeated/similar questions skip the embedding
# round-trip. In-memory only (Caffeine), so a model change is invalidated automatically on restart.
# max-size = entry cap, ttl = write-based expiry.
app.search-query-embed-cache-enabled=${SEARCH_QUERY_EMBED_CACHE_ENABLED:true}
app.search-query-embed-cache-max-size=${SEARCH_QUERY_EMBED_CACHE_MAX_SIZE:500}
app.search-query-embed-cache-ttl-seconds=${SEARCH_QUERY_EMBED_CACHE_TTL_SECONDS:600}
# SSE idle timeout in seconds (0 = use default 120 s) — aborts only when the agent graph makes
# NO forward progress (no node change, token, or sources-ready event) for this long. Resets on
# every such signal, so a slow-but-actively-generating local LLM response is never cut off.
app.sse-idle-timeout-seconds=${SSE_IDLE_TIMEOUT_SECONDS:120}
# SSE connection timeout in seconds (0 = use default 3600 s) — an absolute hard ceiling
# regardless of activity, purely a backstop against a pathological runaway generation.
# app.sse-idle-timeout-seconds above is what actually bounds a stuck local-LLM response.
app.sse-timeout-seconds=${SSE_TIMEOUT_SECONDS:3600}
# Conversation memory (fallback history path). fetch-limit-turns = max recent turns fetched
# before the char budget (LLM_MAX_TOKENS × 0.5, floor 1000) trims them newest-first.
app.memory.fetch-limit-turns=${MEMORY_FETCH_LIMIT_TURNS:10}
# Conversation summary cache (ConversationSummarizerService). Both the summary path and the
# fallback path above respect the same char budget; these only tune the cache/compaction shape.
#   max-cached-threads     LRU cache size (distinct threads kept warm)
#   max-summary-chars      hard cap on the generated summary string
#   recent-raw-turns       verbatim recent turns appended after the summary
#   precompute-ttl-seconds suppression window for duplicate precompute triggers on one thread
app.summary.max-cached-threads=${SUMMARY_MAX_CACHED_THREADS:3}
app.summary.max-summary-chars=${SUMMARY_MAX_SUMMARY_CHARS:2000}
app.summary.recent-raw-turns=${SUMMARY_RECENT_RAW_TURNS:2}
app.summary.precompute-ttl-seconds=${SUMMARY_PRECOMPUTE_TTL_SECONDS:15}
# Both (hot — apply on the NEXT indexing/sync, not retroactively). Peak indexing LLM concurrency
# is roughly the PRODUCT of these two (FILES × LLM) — files aren't synchronized with each other,
# so file A can be in the keyword-extraction stage while file B is in MD correction, and the
# correction/structuring semaphore is created fresh per file. FILES=1 removes the multiplication,
# pinning the peak to exactly the LLM value — an easy default to match against a local LLM
# server's --parallel setting.
app.indexing.max-concurrent-files=${INDEXING_MAX_FILES:1}
app.indexing.max-concurrent-llm-calls=${INDEXING_MAX_LLM:3}
# Per-chunk keyword extraction timeout (seconds). Chunk is indexed without keywords on timeout.
# Applies per LLM call whether it covers one chunk or a keyword-batch-size-sized batch — a larger
# batch generates proportionally more output tokens, so raise this if batching causes timeouts.
app.indexing.keyword-timeout-seconds=${INDEXING_KEYWORD_TIMEOUT_SECONDS:180}
# Chunks bundled into one keyword-extraction LLM call (numbered-section prompt).
# 1 = no batching (one call per chunk). Round-trips ~= ceil(chunks / N).
# Default 2: small local models struggle to keep N independent [결과 N] sections
# well-formed as N grows, tripping the incomplete-parse TF fallback; a larger batch
# trades round-trip savings for that reliability risk.
app.indexing.keyword-batch-size=${INDEXING_KEYWORD_BATCH_SIZE:2}
# MD correction (MarkdownCorrectionService) — when the correction LLM wraps unfenced code/logs/CLI
# output into a code block and can't tell the language, it is told to use this tag. Only java/bash/sql
# are accepted (matches this project's own stack); any other value (including unset) falls back to java.
app.md-correction.default-code-language=${MD_CORRECTION_DEFAULT_CODE_LANGUAGE:java}

# Image description (Vision LLM enrichment)
# mode: strip | describe   enabled: set to true to activate LazyVisionService
app.image-description.mode=strip
app.image-description.enabled=true
app.image-description.ocr-enabled=true
app.image-description.min-image-bytes=1000
app.image-description.classify-type=true
app.image-description.docx-emf-convert=true
app.image-description.docx-wmf-convert=false

# PPTX drawing-tool shape rasterization/clustering (PptxImageExtractor).
# min-shape-dimension-pt: a shape's longer side must be at least this (points) to seed a cluster —
#   below it, treated as an icon/divider and skipped entirely.
# cluster-proximity-padding-pt: outward padding applied to each shape's bounding box before testing
#   overlap for clustering — a connector usually sits in the gap between the boxes it links rather
#   than overlapping either one, so this needs to be wide enough to bridge that gap. Too wide risks
#   merging unrelated nearby shapes into one bundle; too narrow risks splitting one diagram apart.
#   Applies regardless of rasterize-shapes below — it's also the padding used to test whether a loose
#   seed overlaps a picture/table anchor for merge-annotated-pictures, not just loose-shape clustering.
app.pptx-image.min-shape-dimension-pt=${PPTX_IMAGE_MIN_SHAPE_DIMENSION_PT:30}
app.pptx-image.cluster-proximity-padding-pt=${PPTX_IMAGE_CLUSTER_PROXIMITY_PADDING_PT:5}
# merge-annotated-pictures: true (default) — a picture also joins proximity clustering, so markup
#   (highlight circle, arrow, callout) drawn on/near it merges into one composite image with it.
#   false — pictures never join proximity clustering; only a picture already inside a real PPTX
#   group (XSLFGroupShape, i.e. actually grouped by the author) merges with its group-mates. Every
#   other picture is always extracted verbatim, standalone.
app.pptx-image.merge-annotated-pictures=${PPTX_IMAGE_MERGE_ANNOTATED_PICTURES:true}
# rasterize-shapes: controls proximity clustering of LOOSE shapes (connectors/textless auto-shapes
#   not overlapping a picture/table). true — overlapping loose shapes are unioned (union-find) and
#   rasterized together as one diagram image (the pre-existing behavior). false (default) — no such
#   clustering; a loose standalone shape is NOT rasterized at all. Independent of this flag, always:
#   real groups (Ctrl+G) / SmartArt render as one image each, a table with an overlapping seed shape
#   is composited (table also stays a markdown pipe-table), and picture+annotation still merges per
#   merge-annotated-pictures above.
app.pptx-image.rasterize-shapes=${PPTX_IMAGE_RASTERIZE_SHAPES:false}

# PPTX duplicate / table-of-contents slide removal at conversion time (PptxToMarkdownConverter).
# true (default) — an image-less slide is dropped when (1) its normalized text exactly repeats an
#   earlier slide (keeps the first occurrence), or (2) its bullets are largely a list of OTHER
#   slides' titles (an agenda / mid-deck TOC slide — the real content lives on the section slides).
#   Image-bearing slides are never dropped (their extracted image would be orphaned). Dropped slides
#   never shift the [페이지: N] numbering of the slides around them.
# false — every slide is kept verbatim (pre-dedup behavior).
app.pptx-remove-duplicate-slides=${PPTX_REMOVE_DUPLICATE_SLIDES:true}
# PPTX section-divider slide removal at conversion time (PptxToMarkdownConverter).
# true (default) — a slide with ONLY a title (no body text, no image) is dropped when the title
#   reads as a section divider: a numbered/labeled pattern (3장, PART 2, 제1절, STEP 3, "II.", "1)",
#   부록 A, …), a divider keyword (목차/개요/서론/결론/요약/agenda/overview/summary…), or a short bare
#   noun phrase (≤3 words / ≤12 chars, no subject/object particle, no sentence ending). A title that
#   reads like a full sentence / key message (ends with 다·니다·요·. etc., or carries a 은/는/이/가/을/를
#   particle) is KEPT. Body- or image-bearing slides are never affected.
# false — keep title-only slides verbatim.
app.pptx-drop-divider-slides=${PPTX_DROP_DIVIDER_SLIDES:true}
# PPTX redundant "preview title" slide removal at conversion time (PptxToMarkdownConverter).
# true (default) — a slide with NO image and NO shape group/diagram/chart text, whose only
#   content is a short title line (no body), is dropped when that exact title text also appears
#   somewhere in the IMMEDIATELY FOLLOWING slide's own heading(s)/body — a common "teaser" title
#   slide immediately restated by the next slide's real content. The last slide (no next slide)
#   is never affected by this rule.
# false — keep such slides verbatim.
app.pptx-drop-redundant-title-slides=${PPTX_DROP_REDUNDANT_TITLE_SLIDES:true}
# PPTX ending-slide removal at conversion time (PptxToMarkdownConverter).
# true (default) — the LAST slide is dropped when it has no image and its entire content
#   (title + body) is only an ending marker: 끝, END, or The End (case/punctuation-insensitive).
# false — keep the ending slide verbatim.
app.pptx-drop-ending-slide=${PPTX_DROP_ENDING_SLIDE:true}

# DOCX legacy VML shape + picture merge (DocxAnnotationShapeMerger). Unlike PPTX, POI's
# WordprocessingML model has no shape coordinates or renderer, so this uses a proximity
# approximation instead of real geometric overlap: a picture and any v:rect/v:oval/v:roundrect/
# v:line VML shape(s) found in the SAME paragraph are composited into one image. Modern
# DrawingML shapes (Insert > Shapes) have no POI type bindings at all and are not supported —
# only the legacy VML fallback is. [Experimental] true — merge when both are present in a
# paragraph; the composited shape's position can drift from where it actually sits in the
# document (same-paragraph proximity, not real geometric overlap like PPTX). false (default) —
# always extract pictures verbatim, standalone.
app.docx-image.merge-annotated-shapes=${DOCX_IMAGE_MERGE_ANNOTATED_SHAPES:false}

# Rate limiting
# Emergency toggle: Disable immediately with app.rate-limit.enabled=false
app.rate-limit.enabled=true
app.rate-limit.chat-per-minute=60
app.rate-limit.upload-per-minute=10
app.rate-limit.sync-per-minute=3
app.rate-limit.image-per-minute=300
app.rate-limit.default-per-minute=120

# Audit log — file-based rolling log (logback-spring.xml AUDIT_FILE appender)
# Emergency toggle: Disable immediately with app.audit.enabled=false
app.audit.enabled=true
app.audit.max-file-size=10MB
app.audit.max-history-days=7
app.audit.total-size-cap=100MB

# ── LLM Providers ──────────────────────────────────────────────────────────
# Routing: COST_FIRST | QUALITY_FIRST | PROGRESSIVE | DUAL | LOCAL_ONLY
# Air-gapped / local-only: set LLM_ROUTING_MODE=LOCAL_ONLY to block all external provider calls.
app.llm.default-routing-mode=${LLM_ROUTING_MODE:COST_FIRST}
app.llm.progressive-threshold=0.6
# LLM sampling temperature + response cap. These used to be dead settings (LlmConfig hardcoded
# temperature=0.0 / max-tokens=6000, ignoring these values) — §6.18 wired them in.
# temperature: general/RAG + all non-Direct calls. Baked into each provider's defaultOptions at
#   startup, so a change needs a restart (view-only in /settings). LLM_TEMPERATURE now takes effect.
# direct-temperature: Direct(meta) answers only (greetings/chit-chat, no RAG) — a little sampling
#   variety reads more naturally there. (hot — DirectAnswerService reads it per call; editable in /settings)
# max-tokens: blocking LLM calls only (indexing/classify/keyword/Direct-blocking). Streaming chat
#   answers are intentionally uncapped (bounded by app.sse-*-timeout-seconds instead). View-only.
app.llm.temperature=${LLM_TEMPERATURE:0.0}
app.llm.direct-temperature=${DIRECT_LLM_TEMPERATURE:0.1}
app.llm.max-tokens=${LLM_MAX_TOKENS:6000}
# Circuit Breaker: how long (minutes) to block a provider after 429/error — applies ONLY when a
# fallback provider exists to take over. A lone provider with no fallback (e.g. a single-provider
# LOCAL_ONLY deployment) instead gets a short fixed 30s block on overload (429/402/503 without an
# explicit Retry-After), so a transient capacity blip doesn't turn into a multi-minute outage;
# that 30s value is hardcoded (LlmRouter.SHORT_BLOCK_SECONDS), not controlled by this property.
app.llm.circuit-breaker-minutes=4
app.llm.connect-timeout-seconds=${LLM_CONNECT_TIMEOUT_SECONDS:10}
app.llm.read-timeout-seconds=${LLM_READ_TIMEOUT_SECONDS:180}
# Query-path concurrency gate: the app never sends more than this many concurrent
# requests to a single provider (should match the LLM server's real --parallel value).
# Per-provider override: app.llm.providers[N].concurrency=<n> (falls back to this default).
app.llm.default-provider-concurrency=${LLM_DEFAULT_PROVIDER_CONCURRENCY:3}
# Max time a chat/query-path request waits for a concurrency slot before failing fast
# with 429 + Retry-After, instead of hanging until app.llm.read-timeout-seconds. Indexing/
# background LLM calls are NOT subject to this cap (they keep using their own semaphore).
app.llm.permit-wait-timeout-seconds=${LLM_PERMIT_WAIT_TIMEOUT_SECONDS:20}
# Startup guard (LlmConfig G3): for every registered LOCAL-role provider (local-fast/local/local-2
# below, and local-vision if enabled), call GET {base-url}/v1/models and check the configured model
# is in the response. Fails startup entirely (Spring Boot exits non-zero) if the server is
# unreachable or the model name doesn't match — catches a wrong port/typo'd model name at boot
# instead of a confusing runtime chat failure later. Does not apply to NORMAL/PREMIUM (cloud)
# providers. Set to false only for environments where the local server may not be up yet at boot
# (e.g. a startup-order race in some deployments).
app.llm.verify-local-models-on-startup=${LLM_VERIFY_LOCAL_MODELS_ON_STARTUP:true}

# Ordering: [1/5] small local (MICRO_TEXT chores) → [2/5] local LLM 1 → [3/5] local LLM 2
# (same role+priority as #2, horizontal scale-out) → [4/5] existing external providers (unchanged
# content/priority) → [5/5] optional VISION-dedicated local model. Spring binds app.llm.providers[N]
# by NUMBER, not by file position — indices only need to be contiguous from 0 among ACTIVE (uncommented)
# entries — but this file keeps index order == file order so the two never drift apart for a human
# reader. Commented/optional blocks are excluded from that contiguity count.
# role: LOCAL | NORMAL | PREMIUM   type: MICRO_TEXT | LIGHT_TEXT | TEXT | VISION | LIGHT_BOTH | BOTH
# stream: true (default) = streaming API; false = blocking API (useful for providers with poor SSE support)

# ── [1/5] [LOCAL] Small local LLM 1 — MICRO_TEXT chores only (§6.21) ────────
# Offloads keyword+context, summary, title, MultiQuery expansion to a ~500MB model so local LLM 1/2
# below are dedicated to answer generation (TEXT) and the quality-sensitive LIGHT_TEXT tasks
# (classify, meta direct-answer). priority=0 — lower than local LLM 1/2's priority=1 — so this one
# always wins MICRO_TEXT first (TaskType.supports(): BOTH still absorbs MICRO_TEXT as a fallback,
# so comment this whole block out to disable — zero regression).
# No fallback default on base-url: if LOCAL_FAST_LLM_URL is unset or blank, this provider is
# disabled outright at startup (LlmConfig G2) instead of silently registering against localhost.
app.llm.providers[0].name=local-fast
app.llm.providers[0].base-url=${LOCAL_FAST_LLM_URL:}
app.llm.providers[0].api-key=${LOCAL_FAST_LLM_KEY:no-key}
app.llm.providers[0].model=${LOCAL_FAST_LLM_MODEL:Qwen3.5-0.8B-Q4_K_M.gguf}
app.llm.providers[0].type=MICRO_TEXT
app.llm.providers[0].role=LOCAL
app.llm.providers[0].priority=0
app.llm.providers[0].stream=true
#app.llm.providers[0].concurrency=4

# ── [2/5] [LOCAL] Local LLM 1 — answer generation (TEXT), classify/direct-answer (LIGHT_TEXT),
# Vision. priority=1 (must stay above the small model's priority=0 — see [1/5] comment above).
# No fallback default on base-url: if LOCAL_LLM_URL is unset or blank, this provider is disabled
# outright at startup (LlmConfig G2) instead of silently registering against localhost.
app.llm.providers[1].name=local
app.llm.providers[1].base-url=${LOCAL_LLM_URL:}
app.llm.providers[1].api-key=${LOCAL_LLM_KEY:no-key}
app.llm.providers[1].model=${LOCAL_LLM_MODEL:google/gemma-4-e4b}
app.llm.providers[1].type=${LOCAL_LLM_TYPE:BOTH}
app.llm.providers[1].role=LOCAL
app.llm.providers[1].priority=1
app.llm.providers[1].stream=true
# app.llm.providers[1].concurrency=3

# ── [3/5] [LOCAL] Local LLM 2 — a second physical server running the SAME model as local LLM 1,
# registered with the SAME role(LOCAL)/priority(1)/type(BOTH) and only a different base-url.
# LlmRouter load-balances same-priority ties least-in-flight (most free concurrency-gate permits) —
# see OPERATOR_MANUAL §5.4 예제 5/7. Total throughput = (# of same-tier providers) × concurrency.
# If this server is down/unreachable, one call fails, gets circuit-broken for 30s, and the SAME
# request transparently retries local LLM 1 within that call (same safety net as the small model
# falling back to BOTH) — never surfaced to the user as an error.
# To scale to a 3rd+ replica: copy this block, keep role/priority/type identical, change only
# base-url/name, and use the next free index — i.e. AFTER [4/5] below, BEFORE the VISION block,
# which then needs to move its index up by one.
# No fallback default on base-url: if LOCAL_LLM_URL_2 is unset or blank, this provider is disabled
# outright at startup (LlmConfig G2) instead of silently registering against localhost.
app.llm.providers[2].name=local-2
app.llm.providers[2].base-url=${LOCAL_LLM_URL_2:}
app.llm.providers[2].api-key=${LOCAL_LLM_KEY_2:no-key}
app.llm.providers[2].model=${LOCAL_LLM_MODEL_2:${LOCAL_LLM_MODEL:google/gemma-4-e4b}}
app.llm.providers[2].type=${LOCAL_LLM_TYPE_2:BOTH}
app.llm.providers[2].role=LOCAL
app.llm.providers[2].priority=1
app.llm.providers[2].stream=true
# app.llm.providers[2].concurrency=3

# ── [4/5] Existing external LLM providers (NORMAL/PREMIUM) — content/priority unchanged, index only ──
# ── [NORMAL] Gemini Flash — low-cost, primary ──────────────────────────
# Provider is auto-disabled at startup when GEMINI_API_KEY is unset or empty.
app.llm.providers[3].name=gemini-flash-lite
app.llm.providers[3].base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
app.llm.providers[3].api-key=${GEMINI_API_KEY1:}
app.llm.providers[3].model=${GEMINI_MODEL:gemini-3.1-flash-lite}
app.llm.providers[3].type=TEXT
app.llm.providers[3].role=NORMAL
app.llm.providers[3].priority=2

# ── [NORMAL] Gemini Flash — low-cost, secondary ────────────────────────
app.llm.providers[4].name=gemini-flash
app.llm.providers[4].base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
app.llm.providers[4].api-key=${GEMINI_API_KEY2:}
app.llm.providers[4].model=${GEMINI_MODEL:gemini-2.5-flash}
app.llm.providers[4].type=TEXT
app.llm.providers[4].role=NORMAL
app.llm.providers[4].priority=2

# ── [NORMAL] OpenAI Mini — low-cost, fallback ──────────────────────────
app.llm.providers[5].name=openai-mini
app.llm.providers[5].base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.llm.providers[5].api-key=${OPENAI_API_KEY:}
app.llm.providers[5].model=gpt-4o-mini
app.llm.providers[5].type=TEXT
app.llm.providers[5].role=NORMAL
app.llm.providers[5].priority=3

# ── [PREMIUM] Gemma 4 31B — high-reasoning, primary ────────────────────
app.llm.providers[6].name=gemma-4-31b
app.llm.providers[6].base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
app.llm.providers[6].api-key=${GEMINI_API_KEY1:}
app.llm.providers[6].model=gemma-4-31b-it
app.llm.providers[6].type=TEXT
app.llm.providers[6].role=PREMIUM
app.llm.providers[6].priority=4

# ── [PREMIUM] Gemma 4 31B — high-reasoning, primary ────────────────────
app.llm.providers[7].name=gemma-4-31b
app.llm.providers[7].base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
app.llm.providers[7].api-key=${GEMINI_API_KEY2:}
app.llm.providers[7].model=gemma-4-31b-it
app.llm.providers[7].type=TEXT
app.llm.providers[7].role=PREMIUM
app.llm.providers[7].priority=4

# ── [PREMIUM] OpenAI GPT-4o — high-reasoning, fallback ────────────────
app.llm.providers[8].name=openai
app.llm.providers[8].base-url=${OPENAI_BASE_URL:https://api.openai.com}
app.llm.providers[8].api-key=${OPENAI_API_KEY:}
app.llm.providers[8].model=gpt-5o
app.llm.providers[8].type=TEXT
app.llm.providers[8].role=PREMIUM
app.llm.providers[8].priority=5

# ── [5/5] [LOCAL] Vision-dedicated local model (optional, disabled by default) ──────────
# type=VISION → selected ahead of the BOTH-type local LLM 1/2 for VISION tasks specifically.
# Index [9] is the next free slot after the active [0]~[7] above — if you add a 3rd+ local LLM
# replica (see [3/5] comment), bump this index accordingly when you uncomment it.
# app.llm.providers[9].name=local-vision
# app.llm.providers[9].base-url=${LOCAL_LLM_URL:http://localhost:1235/v1}
# app.llm.providers[9].api-key=${LOCAL_LLM_KEY:}
# app.llm.providers[9].model=llava-1.6-34b
