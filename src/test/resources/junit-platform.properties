# Parallel test execution: run test CLASSES concurrently, methods within a class serially.
# Classes that load a Spring context (@WebMvcTest/@SpringBootTest — Spring Boot re-inits Logback on
# context start and @MockitoBean reset is not concurrency-safe across contexts in one JVM), attach a
# Logback appender (ListAppender log capture), or mutate AppProperties' process-wide static override
# source are pinned to a shared @ResourceLock("global-state") so they never overlap; the remaining
# pure-unit classes parallelize freely. ParallelIsolationConventionTest enforces the lock.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=same_thread
junit.jupiter.execution.parallel.mode.classes.default=concurrent
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=1
