services:
  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-key-fake}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}
      - EMBED_MODEL=${EMBED_MODEL:-text-embedding-ada-002}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - DATA_DIR=/app/data
      - CHUNK_SIZE=${CHUNK_SIZE:-800}
      - CHUNK_OVERLAP=${CHUNK_OVERLAP:-100}
      - SEARCH_TOP_K=${SEARCH_TOP_K:-6}
      - MAX_RETRY_COUNT=${MAX_RETRY_COUNT:-2}
      - MAX_CONVERSATION_CHARS=${MAX_CONVERSATION_CHARS:-7000}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    depends_on:
      chroma:
        condition: service_healthy

volumes:
  chroma_data:
